<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">The WorkCrew workflow</title>
  <desc id="desc">Four stages: understand the job, extract structured proposals, verify with deterministic writes and independent review, then deliver a workbook with evidence and human fallback.</desc>

  <rect width="1200" height="390" rx="26" fill="#f7f5f1"/>
  <path d="M70 74H1130" stroke="#dedad2" stroke-width="2"/>
  <circle cx="70" cy="74" r="7" fill="#d97757"/>
  <circle cx="1130" cy="74" r="7" fill="#5f806b"/>
  <text x="70" y="47" fill="#8d8982" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="2">ONE RESUMABLE RUN</text>

  <g transform="translate(60 108)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
    <g id="understand">
      <rect width="250" height="220" rx="18" fill="#fffdf9" stroke="#dfdbd3"/>
      <text x="22" y="38" fill="#d97757" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">01 · UNDERSTAND</text>
      <text x="22" y="72" fill="#25231f" font-size="24" font-weight="720">Scope the job</text>
      <text x="22" y="101" fill="#716d66" font-size="14">Manifest + schema + questions</text>
      <path d="M23 128h204" stroke="#ebe7df"/>
      <text x="22" y="158" fill="#55514b" font-size="16">Manifest every source file</text>
      <text x="22" y="185" fill="#55514b" font-size="16">Pause for open questions</text>
    </g>

    <g id="extract" transform="translate(275 0)">
      <rect width="250" height="220" rx="18" fill="#fffdf9" stroke="#dfdbd3"/>
      <text x="22" y="38" fill="#8d88ad" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">02 · EXTRACT</text>
      <text x="22" y="72" fill="#25231f" font-size="24" font-weight="720">Claude Code</text>
      <text x="22" y="101" fill="#716d66" font-size="15">Evidence-backed proposals</text>
      <path d="M23 128h204" stroke="#ebe7df"/>
      <text x="22" y="158" fill="#55514b" font-size="16">Inspect sources and rules</text>
      <text x="22" y="185" fill="#55514b" font-size="16">Return schema-valid JSON</text>
    </g>

    <g id="verify" transform="translate(550 0)">
      <rect width="250" height="220" rx="18" fill="#282723"/>
      <text x="22" y="38" fill="#e58a6e" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">03 · VERIFY</text>
      <text x="22" y="72" fill="#fffdf9" font-size="24" font-weight="720">Write, then review</text>
      <text x="22" y="101" fill="#aaa69e" font-size="14">Bounded writes + read-only QA</text>
      <path d="M23 128h204" stroke="#45423d"/>
      <text x="22" y="158" fill="#d9d5cc" font-size="16">Python controls every edit</text>
      <text x="22" y="185" fill="#d9d5cc" font-size="16">Codex reviews read-only</text>
    </g>

    <g id="deliver" transform="translate(825 0)">
      <rect width="250" height="220" rx="18" fill="#fffdf9" stroke="#cfd9d1"/>
      <text x="22" y="38" fill="#5f806b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="800">04 · DELIVER</text>
      <text x="22" y="72" fill="#25231f" font-size="24" font-weight="720">Explain every cell</text>
      <text x="22" y="101" fill="#716d66" font-size="14">Workbook + evidence + audit</text>
      <path d="M23 128h204" stroke="#e3e9e4"/>
      <text x="22" y="158" fill="#55514b" font-size="16">final.xlsx + provenance</text>
      <text x="22" y="185" fill="#55514b" font-size="15">Human queue when unresolved</text>
    </g>
  </g>

  <g fill="none" stroke="#a9a59d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M316 218h13"/><path d="M324 211l8 7-8 7"/>
    <path d="M591 218h13"/><path d="M599 211l8 7-8 7"/>
    <path d="M866 218h13"/><path d="M874 211l8 7-8 7"/>
  </g>

  <text x="60" y="356" fill="#8d8982" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">SCOPING → PROPOSALS → ALLOWLISTED MUTATIONS → CROSS-VENDOR QA → FINAL.XLSX</text>
</svg>
