<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">WorkCrew——可追溯的文档到工作簿自动化</title>
  <desc id="desc">源文件经过结构化抽取和独立复核，成为带单元格级证据的工作簿。</desc>

  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f1ede5"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="28" fill="#1f1e1c"/>
  <path d="M0 348 C190 318 350 396 566 356 S950 304 1200 348 V420 H0Z" fill="#262522"/>

  <g id="title-block" transform="translate(58 52)">
    <text x="0" y="0" dominant-baseline="hanging" fill="#d97757" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="17" font-weight="700" letter-spacing="2.6">本地优先 · 文档智能</text>
    <text x="0" y="86" fill="#fffdf8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="72" font-weight="720" letter-spacing="-3.2">Work<tspan fill="#aaa69e" font-weight="420">Crew</tspan></text>
    <text x="0" y="140" fill="#ddd8ce" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="28" font-weight="560">把源文件夹变成经复核的工作簿。</text>
    <text x="0" y="178" fill="#8f8b84" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="21">证据、复核与人工兜底全程可追溯。</text>

    <g transform="translate(0 228)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15" font-weight="650" letter-spacing=".5">
      <rect x="0" y="0" width="112" height="36" rx="18" fill="#2d2b28" stroke="#4b4842"/>
      <circle cx="20" cy="18" r="4" fill="#74a286"/>
      <text x="34" y="23" fill="#d9d5cc">本地数据</text>

      <rect x="124" y="0" width="112" height="36" rx="18" fill="#2d2b28" stroke="#4b4842"/>
      <circle cx="144" cy="18" r="4" fill="#d97757"/>
      <text x="158" y="23" fill="#d9d5cc">受控写入</text>

      <rect x="248" y="0" width="98" height="36" rx="18" fill="#2d2b28" stroke="#4b4842"/>
      <circle cx="268" cy="18" r="4" fill="#8d88ad"/>
      <text x="282" y="23" fill="#d9d5cc">可恢复</text>
    </g>

    <text x="0" y="316" fill="#77736d" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="15">Claude Code → 确定性写入 → Codex → 人工处理</text>
  </g>

  <g id="project-proof" transform="translate(650 40)">
    <g id="source-documents" transform="translate(0 60)">
      <rect x="0" y="20" width="120" height="154" rx="12" fill="#34322e" stroke="#4b4842"/>
      <path d="M18 52h50M18 68h74M18 84h62M18 113h76M18 129h54" stroke="#77736d" stroke-width="5" stroke-linecap="round"/>
      <rect x="75" y="5" width="120" height="154" rx="12" fill="url(#paper)"/>
      <path d="M93 39h56M93 56h79M93 73h65M93 104h79M93 121h47" stroke="#c6c0b6" stroke-width="5" stroke-linecap="round"/>
      <rect x="91" y="134" width="68" height="9" rx="4.5" fill="#d97757" opacity=".72"/>
      <text x="98" y="25" fill="#6d6962" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="12" font-weight="700">源文件 / 31</text>
    </g>

    <g id="flow-arrow" transform="translate(212 117)">
      <path d="M0 0 C28 0 28 30 55 30 H82" fill="none" stroke="#d97757" stroke-width="3" stroke-linecap="round"/>
      <path d="M73 21l10 9-10 9" fill="none" stroke="#d97757" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="29" cy="13" r="5" fill="#1f1e1c" stroke="#d97757" stroke-width="2"/>
    </g>

    <g id="workbook" transform="translate(292 0)">
      <rect x="8" y="10" width="242" height="322" rx="17" fill="#141311" opacity=".52"/>
      <rect x="0" y="0" width="242" height="322" rx="17" fill="#fbfaf7"/>
      <rect x="0" y="0" width="242" height="48" rx="17" fill="#ece8e0"/>
      <path d="M0 32h242v16H0z" fill="#ece8e0"/>
      <circle cx="21" cy="24" r="5" fill="#d97757"/>
      <text x="37" y="29" fill="#3f3d39" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="750">final.xlsx</text>
      <text x="180" y="29" fill="#6f8f7c" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="11" font-weight="750">已复核</text>

      <g transform="translate(16 67)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif">
        <rect x="0" y="0" width="210" height="30" rx="6" fill="#292824"/>
        <text x="11" y="20" fill="#e9e5dc" font-size="11" font-weight="700">字段</text>
        <text x="77" y="20" fill="#e9e5dc" font-size="11" font-weight="700">值</text>
        <text x="165" y="20" fill="#e9e5dc" font-size="11" font-weight="700">证据</text>

        <g font-size="12" fill="#47443e">
          <rect x="0" y="38" width="210" height="39" rx="6" fill="#f0ede7"/>
          <text x="11" y="62">名称</text><text x="77" y="62" font-weight="650">示例公司</text>
          <rect x="158" y="49" width="42" height="18" rx="9" fill="#dbe8df"/>
          <text x="168" y="62" fill="#52705e" font-size="10" font-weight="750">PDF 4</text>

          <rect x="0" y="84" width="210" height="39" rx="6" fill="#f7f4ee"/>
          <text x="11" y="108">金额</text><text x="77" y="108" font-weight="650">$119,092</text>
          <rect x="158" y="95" width="42" height="18" rx="9" fill="#f2ded6"/>
          <text x="168" y="108" fill="#a34f36" font-size="10" font-weight="750">XLSX</text>

          <rect x="0" y="130" width="210" height="39" rx="6" fill="#f0ede7"/>
          <text x="11" y="154">状态</text><text x="77" y="154" font-weight="650">已验证</text>
          <rect x="158" y="141" width="42" height="18" rx="9" fill="#e2e0ea"/>
          <text x="167" y="154" fill="#696487" font-size="10" font-weight="750">DOCX</text>
        </g>

        <path d="M0 196h210" stroke="#ded9d0"/>
        <text x="0" y="223" fill="#8a867f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="12">单元格证据账本</text>
        <text x="0" y="243" fill="#8a867f" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, sans-serif" font-size="12">运行审计数据库</text>
      </g>
    </g>
  </g>
</svg>
