rtnership with government)", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "The organization is consistently called 'The Akanksha Foundation' and Section I (p.6) describes it running after-school centers for 'some of the poorest children from the slum communities' and opening a school 'in partnership with the government', characterizing a charitable nonprofit; no legal form is explicitly stated."}]}, {"name": "Sector", "header": "Sector", "value": "Education", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "Section I (p.6) describes the organization's work as running after-school centers and schools that 'educate some of the poorest children from the slum communities of Mumbai and Pune'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "\"To impact the lives of less-privileged children in India, enabling them to maximize their potential and change their futures.\"", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "Section I (p.6) states 'The Akanksha Foundation was founded in 1991 with a mission to impact the lives of less-privileged children in India, enabling them to maximize their potential and change their futures'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "Runs 57 after-school centers educating poor children from the slum communities of Mumbai and Pune, developing academic and social skills in English, math and self-esteem. Since 2007 it also runs The School Project - six municipal-partnership schools modeled on high-performing US charter schools - and plans to expand to ten schools by 2012, adding one grade level per year.", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "Section I (p.6) states Akanksha 'runs 57 centers, reaching nearly 2,500 children' focused on 'English language, math and self-esteem development', that in 2007 it opened a school in Pune in partnership with the government based on 'models of high-performing charter schools in the U.S.', 'runs six schools that currently serve 1,000 children' and 'plans to expand to ten schools by 2012 and to add one grade level per year'."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": "Nearly 2,500 children through 57 after-school centers, plus 1,000 children in six schools; the schools need 34-35 new teachers per year", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "Section I (p.6) states 'Akanksha runs 57 centers, reaching nearly 2,500 children' and 'Akanksha runs six schools that currently serve 1,000 children', and the Executive Summary (p.5) cites an 'annual need for 34 new teachers'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Vandana Goyal", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "The title page (p.1) lists 'Akanksha School Project: Vandana Goyal and Ruchika Gupta', and the Methodology section (p.7) describes working with 'Ruchika Gupta and Vandana Goyal, of the Akanksha Schools Project, throughout their week in New Haven'."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Ruchika Gupta", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "The title page (p.1) lists 'Akanksha School Project: Vandana Goyal and Ruchika Gupta' as the client-side team."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Education, Youth Development", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "'Education' matches directly because Section I (p.6) describes running schools and after-school centers that educate poor children, and the project concerns teacher training."}, {"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "'Youth Development' is a close secondary match because Section I (p.6) says the centers 'seek to develop each child's academic and social skills, particularly in the areas of English language, math and self-esteem development'."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Urban slum education; after-school programs; charter-style municipal school replication; teacher recruitment, training and certification", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "Section I (p.6) covers slum-community after-school centers and the charter-school-modeled School Project, and the Executive Summary (p.5) covers the teacher-training and certification challenges the project addressed."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "Section I (p.6) states the foundation 'was founded in 1991' and has worked 'For almost twenty years', now operating 57 centers and six schools."}]}, {"name": "Project City", "header": "Project City", "value": "Mumbai and Pune", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "Section I (p.6) locates the after-school centers in 'the slum communities of Mumbai and Pune' and the first School Project school in Pune."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": null, "sources": []}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "Section I (p.6) states the mission is to impact 'the lives of less-privileged children in India' and the School Project 'seeks to create a replicable school model for urban areas in India'."}]}, {"name": "Project Description", "header": "Project Description", "value": "The GSE team designed a teacher-training program to solve Akanksha's shortage of high-quality teachers for its expanding School Project. After surveying educators, researching about twenty US teacher-training organizations across four models (residencies, fellowships, school-based, university-based) and interviewing eleven program leaders, the team recommended a hybrid school-based residency model - existing classroom space, competitive recruitment, cohorts, custom coursework, a four-week summer institute, a one-year clinical placement with Master Teachers, and two years of mentorship - meeting Akanksha's need for 34 new teachers per year by the second year. They addressed the Indian teacher-certification barrier (recommending recruitment of already-certified B.Ed. holders), built a financial cost model (Rs 1,241,000 start-up, annual costs growing from about Rs 6.7 million to Rs 18.4 million over five years), and proposed success metrics.", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "The Executive Summary (p.5) describes the research across four teacher-training models, the recommended hybrid school-based residency model, the certification workaround options, and the target of 34 new teachers per year."}, {"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "Sections VII.B-D (p.18-20) detail the recommended program features, the financial cost model (Rs 1,241,000 investment and annual costs of Rs 6,673,772 to Rs 18,417,900), and the recommended metrics (teachers trained, graduation, placement, retention, student achievement)."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Organizational Systems and Behavior, Financial Modeling, Scaling", "sources": [{"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "'Organizational Systems and Behavior' - the core deliverable is the design of an internal teacher-training program with recruitment, cohort, coursework, mentorship and staffing structures (Recommendations, p.11-19)."}, {"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "'Financial Modeling' - Section VII.C 'Explanation of Financial Model' (p.19-20) describes the financial cost model built as 'an ongoing financial planning tool'."}, {"file": "India 2009/Akanksha Final Report Jan 11.pdf", "reason": "'Scaling' - the program addresses Akanksha's expansion goals ('expand to ten schools by 2012', p.6) and includes a five-year growth plan doubling trainee capacity to serve teachers beyond the Akanksha network (p.18)."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Date inconsistency: the cover page says 'December 2010' while the Executive Summary says the work occurred 'In the fall 2009' and the filename suggests January 11 (the sibling reports in this  "value": "Rajib Pathak", "sources": [{"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The cover page lists the 'Udyogini Team: Arvind Malik & Rajib Pathak', and the Appendix (p.12) profiles Rajib Pathak."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": "Manager (initiating new operations in Bihar and the Northeastern states)", "sources": [{"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The Appendix 'The Udyogini Team' (p.12) states 'At Udyogini, he is a manager initiating new operations in the state of Bihar and in the Northeastern states of India'."}]}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Employment, Community Improvement & Capacity Building", "sources": [{"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "'Employment' is the closest match (approximate) because the project's stated goal is rural income generation for women - 'double the income of each woman mat weaver... from Rs. 12,500 to Rs. 25,000' (Executive Summary, p.1) - through skills training and enterprise work."}, {"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "'Community Improvement & Capacity Building' is an approximate secondary match because the Impact section (p.3) emphasizes 'imparting skills, management training, and income-generating opportunities' and building women's capacity to move up the value chain."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Women's economic empowerment and entrepreneurship; microenterprise/business development services; bamboo mat-weaving value chain; producer cooperatives; tribal women in Northeast India", "sources": [{"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The 'About Udyogini' (p.2), Impact (p.3) and 'Bamboo Enterprises: Udyogini's focus' (p.4) sections describe business development services for poor women, empowerment through enterprise, and the bamboo cooperative with tribal women in Assam."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The 'About Udyogini' section (p.2) states it 'was founded in 1992' (about 17 years before this engagement) and operates a headquarters plus program offices in six states with 65 employees."}]}, {"name": "Project City", "header": "Project City", "value": "Goalpara", "sources": [{"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The Company Pilot section (p.6) states the pilot women 'will all be from the same cluster of villages approximately 25 kilometers east of Goalpara, on the south side of the Brahmaputra River in the state of Assam, India', and the 'About Udyogini' section (p.2) gives the New Delhi headquarters."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Assam", "sources": [{"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The Executive Summary (p.1) describes 'a proposed bamboo mat weaving enterprise to be organized by Udyogini and operated by rural women in Assam, India'."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The Executive Summary (p.1) locates the enterprise in 'Assam, India'."}]}, {"name": "Project Description", "header": "Project Description", "value": "The team conducted a feasibility study for a proposed bamboo mat-weaving cooperative enterprise organized by Udyogini and operated by rural tribal women near Goalpara, Assam, aiming to double each weaver's annual income from Rs 12,500 to Rs 25,000. They performed market research on the bamboo industry, field interviews/surveys with 65 women mat-weavers plus suppliers and buyers, and built a financial model of the enterprise. The recommendation: proceed with a 300-producer pilot only if at least three of six Phase 1 value-adding improvements (productivity increases, collective raw-material purchasing, quality standardization) can be achieved, with Phase 2 improvements (de-noded mats, waste reduction, incorporating intermediaries) able to raise incomes up to three times current levels while scaling to 1,500 producers in 7 years.", "sources": [{"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The Executive Summary (p.1) describes the feasibility study, the income-doubling goal, the market research/field survey/financial modeling approach, and the conditional recommendation on Phase 1 improvements."}, {"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The Interviews and Survey section (p.7) documents interviews with '65 women mat-weavers (producers), two raw material suppliers, and four mat buyers', and the Recommendation/Conclusion (p.9-10) details the Phase 1/Phase 2 conditions and the up-to-three-times income increase."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue, Scaling", "sources": [{"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "'Financial Modeling' - the Financial Model section (p.7) and Analysis section (p.22, referring to 'the separate Excel spreadsheet') show a financial model was a core deliverable."}, {"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "'Business Strategy/Revenue' - the report is a business feasibility study with an implementation plan, enterprise structure and revenue projections (Enterprise Goals p.5, Implementation Plan p.8)."}, {"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "'Scaling' - the plan explicitly phases growth from a 300-producer pilot to 500 and then 1,500 producers by Year 7 (Organizational Structure p.6 and Implementation Plan p.8)."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Project scoping began in summer 2009 when Yale student Varun Chitkara traveled to India to work with Arvind Malik and Rajib Pathak; the Udyogini team visited Yale in late September 2009; the financial model outputs were reviewed with the Udyogini team in India in January 2010. The complete financial model is in a separate Excel spreadsheet not included in this folder.", "sources": [{"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The Project Scoping section (p.22) describes the summer 2009 India trip and the late-September visit to Yale, and the Analysis section (p.22) states the model outputs 'were analyzed along with the Udyogini team in January 2010 in India' and refers to 'the separate Excel spreadsheet for complete details'."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/09 - 6/30/10 - Mann Deshi Udyogini Business School", "org": "Mann Deshi Udyogini Business School", "folder": "India 2009", "sheet_row": 15, "parent": "Global Social Entrepreneurship India - 7/1/09 - 6/30/10", "filled": 19, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/09 - ue": "Mann Deshi Udyogini Business School", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The cover page (p.1) is headed 'MANN DESHI MAHILA SAHAKARI BANK LTD. VIKAS SAMAJIK SANSTHA' with the study titled 'A Study of the Sustainability of Education Services: Mann Deshi Business School'."}, {"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Executive Summary (p.3) states 'The Mann Deshi Group comprises, among others, the Mann Deshi Udyogini Business School and the Mann Deshi Mahila Sahakari Bank' and that 'MD Business School engaged the Yale School of Management Global Social Entrepreneurship team'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "NGO (the MD Business School is 'an independent non-governmental organization') affiliated with a bank; the school and bank are legally separate entities with separate accounting and boards", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Introduction (p.4) states 'The MD Business School is an independent non-governmental organization that provides a variety of non-financial services to MD Bank clients', and the Final Thoughts section (p.18-19) states 'MD Business School and MD Bank are, and must remain, two distinct organizations with separate accounting and boards' and that Mann Deshi 'is legally barred from becoming a unified entity' (p.16-17)."}]}, {"name": "Sector", "header": "Sector", "value": "Microfinance with financial literacy and vocational education for rural women", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Executive Summary (p.3) describes the school providing 'financial and vocational education to the clients of Mann Deshi Mahila Sahakari Bank', and the report benchmarks Mann Deshi against 'other micro-finance organizations that deliver educational services'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "The Mann Deshi Group's joint mission is \"to empower and promote the development of poor and vulnerable women and to fight injustices based on gender, class and caste.\"", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Executive Summary (p.3) states the school 'serves an indispensible role in Mann Deshi Group's joint mission to empower and promote the development of poor and vulnerable women and to fight injustices based on gender, class and caste'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "MD Bank provides banking/microfinance services to rural women, including bringing illiterate women into the banking sector; MD Business School (established 2006) provides a mandatory basic financial literacy course and a range of livelihood skills training courses to bank clients and other enterprising women, through fixed locations in Dahiwadi, Gondavale, Mhaswad, Vaduj and Karnataka plus mobile business schools in Maharashtra and Karnataka.", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Introduction (p.4) describes the school's founding in 2006, the mandatory basic financial literacy course, the livelihood skills training courses, and states 'MD Business School currently has stationary locations in Dahiwadi, Gondavale, Mhaswad, Vaduj, and Karnataka; as well as mobile business schools in Maharashtra and Karnataka', and notes 'Both the MD Business School and MD Bank have made a special effort to bring illiterate women into the banking sector'."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": "More than 6,000 women have benefited from the basic financial literacy course to date", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Introduction (p.4) states 'To date, more than 6,000 women have benefited from this course'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Chetna Sinha", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The cover page (p.1) lists the 'MANN DESHI GROUP' team as 'Chetna Sinha' and 'Vanita Shinde', with Chetna Sinha listed first."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Vanita Shinde", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The cover page (p.1) lists 'Vanita Shinde' as the second member of the Mann Deshi Group team."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Education, Community Improvement & Capacity Building", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "'Education' matches because the client organization is a business school providing financial literacy and livelihood skills courses (Executive Summary p.3; Introduction p.4)."}, {"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "'Community Improvement & Capacity Building' is an approximate match for the group's microfinance and women's economic-development work - the school helps 'women progress out of poverty and into financial independence' alongside the bank's financial services (Introduction, p.4)."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Financial literacy education; livelihood/vocational skills training; women's rural microfinance banking; financial sustainability of 'microfinance plus' education services", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Introduction (p.4) describes the financial literacy and livelihood skills courses for rural women bank clients, and the Best Practices section (p.11-17) analyzes models for delivering 'microfinance plus' education services."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "middle stage", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Executive Summary (p.3) states the school was 'Founded in 2006' (about three years before the engagement), yet the Introduction (p.4) shows it already operates five stationary locations plus mobile schools and has trained over 6,000 women - past early stage but, per the report, still lacking basic information systems and financial sustainability as it seeks to expand."}]}, {"name": "Project City", "header": "Project City", "value": "Dahiwadi, Gondavale, Mhaswad and Vaduj", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Introduction (p.4) states 'MD Business School currently has stationary locations in Dahiwadi, Gondavale, Mhaswad, Vaduj, and Karnataka; as well as mobile business schools in Maharashtra and Karnataka'."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Maharashtra", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Introduction (p.4) states the school 'seeks to improve the life quality of women and their families living in the rural areas of western Maharashtra', with additional locations/mobile schools in Karnataka."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The cover page (p.1) tagline reads 'Empowering Rural Women in India', and all locations named (Maharashtra, Karnataka) are Indian states."}]}, {"name": "Project Description", "header": "Project Description", "value": "The GSE team assessed the financial sustainability of the Mann Deshi Udyogini Business School and how to structure its relationship with Mann Deshi Bank. They built a financial model from course- and branch-level cost/revenue data, finding the school as a whole about 68% sustainable, financial literacy courses only about 3% sustainable (losing ~1.5 million rupees/year) and livelihood skills courses about 98% sustainable. They researched best practices at BRAC, Pro Mujer, Reach India and others across Partner, Parallel and Unified delivery models, and recommended moving toward a Hybrid Model - having bank staff teach basic financial literacy, sharing facilities, transferring to the school part of the estimated 92 Rs-per-client benefit the bank gains, charging ~25 rupees for a break-even advanced financial literacy course, and using the model to evaluate loss-making courses.", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Executive Summary (p.3-4) describes the two-pronged approach (financial sustainability model plus best-practices research), the 3%/98%/68% sustainability findings, the Partner/Parallel/Unified models studied and the Hybrid Model savings estimate."}, {"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "The Final Thoughts section (p.18-19) lists the recommendations, including the bank transferring part of its estimated benefit 'estimated as 92 Rs per client', the ~25 rupees break-even fee for an advanced financial literacy course, and evaluating loss-making courses with the financial model."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue, Organizational Systems and Behavior", "sources": [{"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "'Financial Modeling' - the Sustainability Analysis section (p.6-11) describes the financial models developed 'to both assess the current sustainability of the business school as well as to address opportunities for efficient expansion'."}, {"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "'Business Strategy/Revenue' - the recommendations concern fee-setting, revenue transfer from the bank, and course-mix decisions to improve sustainability (Final Thoughts, p.18)."}, {"file": "India 2009/MannDeshi_YaleSOM 011510.pdf", "reason": "'Organizational Systems and Behavior' - the best-practices research and Hybrid Model recommendation concern the organizational structure and staff/facility sharing between the school and the bank (Best Practices p.11-17; Potential Cost Savings p.17-18)."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "The engaged client entity is the Mann Deshi Udyogini Business School within the Mann Deshi Group; the cover also names 'Vikas Samajik Sanstha'. The report gives no founding date for MD Bank itself. Note the school's name ('Mann Deshi Udyogini Business School') contains the word 'Udyogini' but it is a different organization from the Udyogini client in this same folder. Filename date stamp 011510 indicates January 15, 2010.", "sources": [{" iews dated October 19 - November 3, 2009, and footnote 14 (p.20) cites a 'Meeting between Yale SOM GSE Team and ACCESS January 4 2010, ACCESS Headquarter Office in New Delhi'."}, {"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The cover page is dated January 15, 2010, the Project Approach section (p.22) says the Udyogini team came to Yale 'in late September' after summer 2009 scoping, and the Analysis section (p.22) says 'The outputs of the financial model were analyzed along with the Udyogini team in January 2010 in India'."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "SEWA Managers School (SMS)", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The cover (p.1) reads 'SEWA Managers School: Achieving Financial Sustainability through Market-Based Solutions... In Cooperation With... the Self Employed Women's Association (SEWA) and the SEWA Managers School (SMS)', and the Background (p.3) states SMS is 'one of the \"sister organizations\" within SEWA'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "Trade union (SEWA, registered as a trade union in April 1972); SMS itself is a capacity-building training institution within SEWA", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Background (p.3) states SEWA was 'Founded in December 1971 and registered as a trade union in April 1972' and that 'SMS defines itself as a \"capacity building institution (...) with the goal of facilitating economic self-sustainability through capacity building and training opportunities\"'; p.4 calls SEWA 'the oldest women's trade union in the country'."}]}, {"name": "Sector", "header": "Sector", "value": "Capacity building / management training for informal-sector women workers", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Background (p.3-4) describes SMS's leadership, management/financial literacy, and technical/vocational trainings whose end goal 'is to reach the informal sector workers, including rag pickers, paper pickers, farmers, and \"the poorest of the poor members; illiterate or semi-literate\"'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "\"The mission of SMS is to empower rural poor women in India by training them to be 'grassroots managers and entrepreneurs' through the development of their managerial ability.\" Its parent SEWA seeks fair wages and protective labor laws for self-employed women, aiming to provide poor women with full employment and self-reliance.", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Background (p.3) states the SMS mission verbatim and that SEWA 'seeks fair wages and advocates for protective labor laws on behalf of self-employed women in India', with 'two main aims... to provide poor women with full employment and empower them to be self-reliant'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "SMS delivers trainings in three groups - leadership and awareness, management and financial literacy, and technical and vocational skills - including Master Trainer courses at its Ahmedabad headquarters that create 'barefoot managers' who train other women at the village level, village-level trainings through 50 community centers across 14 district federations, and paid national and international trainings for women from 48 Indian organizations and ten organizations from other Asian countries.", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Background (p.3-4) describes the three training groups, the Master Trainer 'barefoot managers' model, the 'presence in 50 community centers across 14 district federations', and trainees from '48 organizations within India, as well as ten organizations from other countries in Asia (e.g., Afghanistan, Sri Lanka, and the Philippines)'."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": 11, "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Background (p.3) states 'SMS currently has 11 full-time employees'."}]}, {"name": "People Served", "header": "How many people do you serve?", "value": "As of fall 2009 SMS had educated 1,500 Master Trainers, conducted 14,348 trainings and trained 358,700 SEWA members; parent SEWA has over 1.2 million members throughout India", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Background (p.3-4) states 'To date, SMS has educated 1,500 Master Trainers' and 'As of fall 2009, SMS has conducted 14,348 trainings and trained 358,700 SEWA members', and the Core Strengths section (p.4) states SEWA 'has over 1.2 million members throughout India'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Reema Nanavaty", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The cover (p.1) lists the report as prepared 'In Cooperation With: Reema Nanavaty, Ami Shelat, Smita Bhatnagar of the Self Employed Women's Association (SEWA) and the SEWA Managers School (SMS)', with Reema Nanavaty listed first; the Executive Summary (p.2) names all three as 'our clients from SMS'."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Ami Shelat", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The cover (p.1) and Executive Summary (p.2) list Ami Shelat among the three SMS clients ('We worked in close partnership with our clients from SMS, Ami Shelat, Smita Bhatnagar, and Reema Nanavaty')."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Employment, Community Improvement & Capacity Building", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "'Employment' is the closest match (approximate) because SEWA 'seeks fair wages and advocates for protective labor laws on behalf of self-employed women' with aims of 'full employment' (Background, p.3)."}, {"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "'Community Improvement & Capacity Building' matches SMS's self-definition as a 'capacity building institution' whose trainings 'build the capacity of their respective institutions' at the grassroots level (Background, p.3)."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Management and financial literacy training for rural poor women; grassroots leadership ('barefoot managers'); women's trade union services for informal-sector/self-employed workers; vocational skills", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Background (p.3-4) describes the leadership/management/vocational training groups, the 'barefoot managers' concept, and the informal-sector worker target population of the trade union."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The parent organization SEWA was 'Founded in December 1971' and is 'the oldest women's trade union in the country' with over 1.2 million members (Background p.3, Core Strengths p.4); note that the SMS unit itself is much younger, 'founded in 2005' and still dependent on its start-up grant (p.3)."}]}, {"name": "Project City", "header": "Project City", "value": "Ahmedabad", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Executive Summary (p.2) describes 'the SEWA Managers School (SMS) based in Ahmedabad, India', and the Background (p.3) states SMS is 'Headquartered in Ahmedabad in the state of Gujarat'."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Gujarat", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Background (p.3) states SMS is headquartered 'in Ahmedabad in the state of Gujarat', with Master Trainers reaching 'the rural regions of Gujarat'."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Executive Summary (p.2) locates SMS in 'Ahmedabad, India'."}]}, {"name": "Project Description", "header": "Project Description", "value": "Facing expiration in March 2010 of the five-year $1.2 million IFC-administered Japanese Social Development Fund grant that covered ~93% of its costs, SMS engaged the Yale team (Letter of Engagement dated October 1, 2009) to understand its true cost structure and path to financial sustainability. The team built an Excel financial model of costs and revenues by training type (international, national, Master Trainer, village-level), determined that earned income covers only 7-8% of costs, and modeled scenarios showing SMS could reach 78% sustainability (recommended Scenario 3: 8 international, 18 national and 36 Master Trainer trainings with a 10% margin on non-SEWA trainings, phasing out village-level trainings) up to 91%. They also assessed four additional revenue sources, recommending bank-partnership loan financing for trainees and packaged e-learning curriculum modules as the most promising.", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Executive Summary (p.2-3) describes the 7-8% sustainability finding, the grant expiration in March 2010, the LOE dated October 1, 2009, the Excel financial model, the 78% sustainability scenario, and the four additional revenue sources with banking and e-learning judged most promising."}, {"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The Background (p.3) documents the 'grant of $1.2 million from the Japanese Social Development Fund... administered by the International Finance Corporation', and the Future Scenarios section (p.7-9) details Scenarios 1-4 with sustainability of 14%, 56%, 78% and 91%."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "'Financial Modeling' - the primary deliverable was the Excel financial model of SMS costs, revenues, training mixes and sustainability ratios (Section IV, p.6-9)."}, {"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "'Business Strategy/Revenue' - Section V (p.10-13) analyzes four additional earned-revenue strategies (banking partnership, curriculum module sales, consulting engagements, case studies) and Section VI (p.13-15) recommends fee negotiation and training-mix changes."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": "Medium", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The scenario notes (p.8) state 'As of December 2009, SMS has decided to remove village level trainings from its training mix. While this is consistent with Scenario 4...' - explicit in-document evidence that during the engagement the client took a decision consistent with the team's modeled recommendations, though the report does not claim the decision was caused by the team's work, hence Medium rather than High."}], "rev": {"status": "kept_rebut", "note": "Rebutted: the report records one client decision consistent with the recommendation but no long-term impact — the partial-adoption middle state 'Medium' encodes. Rubric confirmation requested."}}, {"name": "Notes", "header": "Notes", "value": "Third client contact: Smita Bhatnagar (cover, p.1). Engagement timeline: initial discussions August 2009 in Ahmedabad, September 2009 at Yale, LOE signed October 1, 2009, weekly Skype check-ins, and in-person presentation of findings in India in January 2010. SEWA was founded December 1971 and registered as a trade union April 1972; SMS was founded in 2005. The report references the Excel financial model as a separate deliverable not included in this folder. The report mentions 'further development of the SMS website' but gives no URL.", "sources": [{"file": "India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf", "reason": "The cover (p.1) lists Smita Bhatnagar as the third SEWA/SMS cooperation contact, the Executive Summary (p.2) gives the August/September 2009 discussions and October 1, 2009 LOE, the Methodology (p.6) notes 'Weekly check-ins with our SMS client via Skype', and the Other General Recommendations section (p.14) mentions 'further development of the SMS website'."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11 - Appropriate Rural Technology Institute (ARTI)", "org": "Appropriate Rural Technology Institute (ARTI)", "folder": "India 2010", "sheet_row": 17, "parent": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11", "filled": 20, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11 - Appropriate Rural Technology Institute (ARTI)", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement corresponds to the Fall 2010 semester of Yale SOM's Global Social Entrepreneurship (GSE) course, with joint planning meetings in New Haven in September 2010, student field visits to India in October 2010, and final client deliverables dated December 2010 through 21 January 2011. [India 2010/TEIL Marketing Plan Final 011611.docx] The title page reads 'Global Social Entrepreneurship / Fall 2010' and every page footer reads 'TEIL Marketing Plan, December 2010'."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Appendix T is Rohit Makhija's day-by-day travel journal of the team site visit to Kerala and Tamil Nadu on October 17-22, 2010."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The title page is dated '21 January 2011'."}]}, {"name": "Parent Program", "header": "Parent Program*", "value": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement corresponds to the Fall 2010 semester of Yale SOM's Global Social Entrepreneurship (GSE) course, with joint planning meetings in New Haven in September 2010, student field visits to India in October 2010, and final client deliverables dated December 2010 through 21 January 2011. [India 2010/TEIL Marketing Plan Final 011611.docx] The title page reads 'Global Social Entrepreneurship / Fall 2010' and every page footer reads 'TEIL Marketing Plan, December 2010'."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Appendix T is Rohit Makhija's day-by-day travel journal of the team site visit to Kerala and Tamil Nadu on October 17-22, 2010."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The title page is dated '21 January 2011'."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "Appropriate Rural Technology Institute (ARTI)", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The title page reads 'ARTI: Appropriate Rural Technology Institute — Institutional Biogas Business Study'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "Nonprofit — registered public charitable trust operated as a scientific society", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Introduction states 'ARTI is registered as a public charitable trust, but is operated as a scientific society', and the Conclusion refers to ARTI's 'non-profit strategy'."}]}, {"name": "Sector", "header": "Sector", "value": "Rural technology / renewable energy (biogas and cook stoves)", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Introduction states ARTI's technologies fall into two broad categories: 'energy, which includes cook stoves and biogas plants, and agriculture, which includes nursery and agricultural techniques'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "ARTI was founded in 1996 with the mission to develop and disseminate technologies to assist rural development.", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Introduction states verbatim: 'ARTI was founded in 1996 with the mission to develop and disseminate technologies to assist rural development.'"}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "ARTI develops rural technologies in two areas: energy (cook stoves and biogas plants) and agriculture (nursery and agricultural techniques). Its biogas line of business sells and installs biogas plants and also provides repair/maintenance consulting, technical advice, instructional CDs, and brand licensing; its for-profit sister organization Samuchit Enviro-Tech (SET) sells household biogas plants and cook stoves.", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Introduction and Problem Statement describe the energy and agriculture technology categories and the biogas business components (selling/installing plants, ad hoc consulting, technical advice, independent services)."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Recommendations section ('Institutional Biogas Service Suite') lists service contracts, technical advice fees, independent consulting, CD sales, and brand licensing; the 'ARTI/SET Competencies' subsection describes SET selling household biogas plants and cook stoves."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": 35, "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Introduction states 'ARTI has offices in Pune and Phaltan, and a staff of 35 employees.'"}]}, {"name": "People Served", "header": "How many people do you serve?", "value": "37 biogas customers in 2010 (30% individual households, 27% hotels/restaurants/resorts, 19% hostels/industrial canteens); ARTI received 127 email inquiries regarding biogas plants from June through early October 2010.", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "Appendix II Exhibit 1 ('ARTI's 2010 Customers, by Sector') tabulates 37 total customers in 2010 by segment."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Current Customers section states 'From June through early October 2010, ARTI received 127 emails regarding biogas plants.'"}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Dr. Karve", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Website subsection states 'In conversations with Dr. Karve, we learned that many ARTI customers discover ARTI's energy and agricultural offerings through online searches', and the Marketing section notes a customer learned of ARTI 'by attending a speech by Dr. Karve at the local Rotary Club', identifying Dr. Karve as the team's principal ARTI interlocutor."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Dr. Priya Karve", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The 'Existing Arrangement' subsection states 'As Dr. Karve and Dr. Priya Karve explained, ARTI and SET already have an understanding in place for cook stoves and household biogas plants', identifying her as the second named interlocutor (she is associated with sister organization SET)."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Science & Technology, Environmental Quality Protection & Beautification, Community Improvement & Capacity Building", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "Science & Technology: the Introduction describes ARTI as 'operated as a scientific society' whose core competency is 'developing and installing new technologies' (the Conclusion also stresses its 'technological innovation and expertise')."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "Environmental Quality Protection & Beautification (approximate match): the biogas business converts food waste to clean fuel, and the report notes customers seek plants 'to make use of existing food or plant waste and to be eco-friendly' and suggests comparing 'greenhouse gas emissions to existing options such as LPG'."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "Community Improvement & Capacity Building (approximate match for rural development): the mission statement is 'to develop and disseminate technologies to assist rural development'."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Biogas energy from food waste; improved cook stoves; rural agricultural techniques; renewable energy commercialization for rural development", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Introduction lists cook stoves, biogas plants, and nursery/agricultural techniques as ARTI's technology areas, and the whole report concerns institutional biogas plants fed with food waste."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Introduction states ARTI was founded in 1996 (14 years before the study), has offices in Pune and Phaltan and 35 staff, and the report notes it is nationally recognized ('ARTI is regarded as a source of expertise on biogas'), indicating an established organization."}]}, {"name": "Project City", "header": "Project City", "value": "Pune", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Introduction states 'ARTI has offices in Pune and Phaltan', and Pune-based competitors (AUM Consultancy, CH4, Enerxia, Gomukh, Mailhem) are benchmarked in Appendix III."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Maharashtra", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Geographical Challenges section states 'ARTI has identified Maharashtra and Karnataka states as its target geographical areas', and the Recommendations advise ARTI to 'focus its efforts primarily in Maharashtra' (Pune and Phaltan, ARTI's office locations, are in Maharashtra)."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The report states ARTI receives funding primarily from 'the Indian government's Ministry of Science and Technology' and analyzes 'India's biogas plant industry structure', locating the organization and project in India."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale GSE team helped ARTI develop an approach to growing its institutional biogas business to bridge an annual funding gap of Rs. 6 million (~USD 130,000). The team analyzed customers (sizing seven institutional segments in Maharashtra and Karnataka and interviewing existing customers), competitors (13 identified Indian biogas providers), marketing practices, and organizational structure, and built a profit model and customer payback model for different biogas plant sizes. Key recommendations: prioritize factories (then restaurants, colleges, marriage halls) in Maharashtra; compete on transparent pricing; create a biogas-specific brochure, updated website, sales capability and segment-specific marketing; and turn biogas sales over to for-profit sister organization SET with installation contracted back to ARTI under a renegotiated royalty above the current 40%.", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Executive Summary states the team 'collaborated with the Appropriate Rural Technology Institute (ARTI) to develop an approach to growing their institutional biogas business to bridge the organization's annual funding gap of Rs. 6 million', focused on customers, competitors, marketing, and organizational structure."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The Recommendations section details the target segment ranking (factories first), transparent pricing, brochure/website/sales-force marketing steps, and the ARTI-SET royalty recommendation; Appendices IV and V describe the profit analysis and customer payback models."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Business Strategy/Revenue, Marketing, Financial Modeling, Organizational Systems and Behavior, Scaling", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "Business Strategy/Revenue: the project's stated purpose is to grow the institutional biogas business to generate Rs. 6 MM in revenue, including customer segmentation and competitor analysis."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "Marketing: a full 'Marketing' section and 'Sales and Marketing' recommendations (brochure, website, sales capability, word-of-mouth, segment strategies) are core deliverables."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "Financial Modeling: the team built a profit model (Appendix IV, 'the full financial model and critical assumptions') and a customer payback model (Appendix V), including a royalty scenario table."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "ARTI has a for-profit sister organization, Samuchit Enviro-Tech (SET), which pays ARTI a 40% royalty on profits from cook stoves and household biogas plants; the team recommended extending and renegotiating this arrangement for institutional biogas. ARTI also has brand affiliates abroad (ARTI-Uganda active; ARTI-Tanzania defunct) and in October 2010 introduced a Rs. 50,000 annual brand licensing fee and new technical-advice fee structure.", "sources": [{"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The 'Existing Arrangement' subsection describes SET paying ARTI 'a royalty of 40% of the profits'; the 'Brand licensing' subsection describes ARTI-Uganda, ARTI-Tanzania, and the new Rs. 50,000 annual brand fee announced in October 2010."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11 - Drishtee", "org": "Drishtee", "folder": "India 2010", "sheet_row": 18, "parent": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11", "filled": 18, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11 - Drishtee", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement corresponds to the Fall 2010 semes ng/Participating*", "value": "Drishtee", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "The title page reads 'Drishtee: BPO Business Development and Marketing Strategy', and Appendix I is titled 'Background on Drishtee and GSE Project'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "Social enterprise (originally a for-profit software company that took on a social mission in 2000)", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "Appendix I states 'Drishtee is a social enterprise whose goal is to have a positive impact on remote villages' and that it was 'Initially a software company during the dot.com boom' that 'took on a social mission in 2000'."}]}, {"name": "Sector", "header": "Sector", "value": "Rural business process outsourcing (BPO) and rural supply chain / telecenter services", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "The Executive Summary describes Drishtee's BPO center offering 'digitization, outbound calling, and inbound calling services', and Appendix I describes its rural supply chain routes and entrepreneur-run kiosks."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "Drishtee's goal is to have a positive impact on remote villages by creating an 'ecosystem' of micro-enterprises run by local entrepreneurs; its vision is to make marginal communities more efficient, self-sufficient and equitable, including providing economic opportunities to the rural poor and increasing their access to critical products and services.", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "Appendix I states 'Drishtee is a social enterprise whose goal is to have a positive impact on remote villages by creating an ecosystem of micro-enterprises run by local entrepreneurs. Drishtee's vision is to make marginal communities more efficient, self-sufficient and equitable.'"}, {"file": "India 2010/Drishtee Report.docx", "reason": "The Executive Summary opens: 'An important part of Drishtee's mission is to provide economic opportunities to the rural poor and to increase their access to critical products and services.'"}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "Along rural supply chain routes each serving 20-25 villages, Drishtee sets up entrepreneur-run kiosks delivering health, education, banking and microfinance services; runs livelihood services such as rural BPO centers (data entry/digitization, inbound and outbound calling); and provides market access to products such as eyeglasses, mobile phones and agricultural products. It piloted its BPO in 2007 with a hub in Saurath, Bihar, and trains rural youth in IT skills.", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "Appendix I lists the three supply chain route activities (kiosks, BPO livelihood services, market access products) verbatim and states the BPO was 'Piloted in 2007'."}, {"file": "India 2010/Drishtee Report.docx", "reason": "The Statement of the Problem describes the BPO hub in Saurath and Drishtee training 'rural youth in IT skills' and helping entrepreneurs set up kiosks."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": 180, "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "Appendix I states 'Drishtee currently has 50 employees at its head office and 130 employees in field offices' (50 + 130 = 180)."}]}, {"name": "People Served", "header": "How many people do you serve?", "value": "Works with about 14,500 entrepreneurs and approximately 1,200 franchisees across 10 states; its network is described as 'over 14,000 village entrepreneurs'; each supply chain route serves at least 20-25 villages; the BPO itself currently employs only 10 villagers full-time.", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "Appendix I states 'The organization works with about 14,500 entrepreneurs and approximately 1,200 franchisees' and 'Drishtee operates in 10 states', and that 'only 10 villagers [are] currently employed on a fulltime basis' at the BPO."}, {"file": "India 2010/Drishtee Report.docx", "reason": "The proposed value proposition cites 'its network of over 14,000 village entrepreneurs'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": null, "sources": []}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": null, "sources": []}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Employment, Community Improvement & Capacity Building", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "Employment: the BPO's mission is 'to create economic opportunity for villagers in rural India, helping to stop brain drain', addressing 'the lack of employment opportunities for youth in rural villages' (Appendix I and Statement of the Problem)."}, {"file": "India 2010/Drishtee Report.docx", "reason": "Community Improvement & Capacity Building: Drishtee's goal is to strengthen village 'economies and social fabric' by building micro-enterprise ecosystems, kiosks and supply chain infrastructure in remote villages (Appendix I)."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Rural youth employment via IT-enabled services (rural BPO); rural entrepreneurship and telecenter kiosks; rural supply chain and market access; IT skills training", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "The Statement of the Problem and Appendix I describe training rural youth in IT skills, kiosk entrepreneurs, the BPO pilot for local employment, and supply chain routes providing market access."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "Appendix I states Drishtee took on its social mission in 2000 (a decade before the project), operates in 10 states with 180 employees, ~14,500 entrepreneurs and ~1,200 franchisees, and has relationships with the Acumen Fund, IFC, Microsoft, and Google — the scale of an established organization (though the BPO line itself, piloted 2007, is still sub-scale)."}]}, {"name": "Project City", "header": "Project City", "value": "Saurath", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "The Challenge section states 'Drishtee set up a BPO center in Saurath that serves as the main hub for its BPO work', and the project focused on making that hub sustainable (headquarters are in NOIDA per the Pitching Tactics section)."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Bihar", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "The Executive Summary states 'Drishtee set up a Business Process Outsourcing (BPO) center in rural Bihar', and the competitor analysis repeatedly cites 'Bihar - local knowledge and language' as Drishtee's comparative advantage."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "The report throughout concerns rural India (e.g., the value proposition cites 'rural populations' in India and Appendix I says Drishtee's strongest presence is in Assam, Bihar, and Uttar Pradesh)."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale GSE team designed a business development and marketing strategy to make Drishtee's rural BPO operation in Saurath, Bihar sustainable. Through a site visit, partner interviews, a past-customer survey, financial analysis of the three service streams, competitive landscape analysis and a twelve-sector customer industry analysis, the team identified outbound calling as the most profitable and best-fitting service stream (margin >19%), proposed a value proposition built on Drishtee's rural supply chain network, and recommended target sectors of agriculture, consumer goods (FMCG/motorcycles) and pharmaceutical drug delivery. Deliverables included five-year financial projections (revenue CAGR of 100%, ~16% IRR on Rs. 2 million per-BPO investment), marketing recommendations (website, brochures, pitch deck, advertising, conferences, promotional offers) and an implementation timeline beginning January 2011.", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "The Executive Summary states the team 'worked with Drishtee to design a business development and marketing strategy for Drishtee's BPO operations', identified Outbound Calling as the most promising stream, and named the target sectors."}, {"file": "India 2010/Drishtee Report.docx", "reason": "The Key Findings and Appendix III detail the 19% margin, 100% CAGR, Rs. 2 million capex per BPO and 16% IRR; the Marketing Recommendations and Next Steps sections detail the website, materials, conference and timeline recommendations."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Business Strategy/Revenue, Marketing, Financial Modeling, Scaling", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "Business Strategy/Revenue: the project selected the most viable service stream and target market segments to make the BPO profitable and sustainable (Executive Summary and Key Findings)."}, {"file": "India 2010/Drishtee Report.docx", "reason": "Marketing: a full 'Marketing Recommendations' section (value proposition, website structure, brochures, PowerPoint pitch, Google AdWords, print advertising, conferences, promotional offers) is a core deliverable."}, {"file": "India 2010/Drishtee Report.docx", "reason": "Financial Modeling: Appendix III contains projected income statement, cash flow statement, and returns; the Methodology describes building 'a financial model of the operations for an average project in each of Drishtee's key work streams'."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Drishtee's BPO customers to date include Pioneer Seeds, the Indian Government, Empower India, SamaSource, Google and Janta (an education microloan company); it has curriculum/technology partnerships with Microsoft and Telecenter.org and relationships with the Acumen Fund and IFC. The team's survey of five past customers/partners (including Google and Janta) revealed mixed satisfaction, especially with data-entry quality. Headquarters are in NOIDA; strongest presence in Assam, Bihar, and Uttar Pradesh.", "sources": [{"file": "India 2010/Drishtee Report.docx", "reason": "Appendix I lists customers 'Pioneer Seeds, the Indian Government, Empower India, SamaSource, Google and Janta' and partnerships with Microsoft and Telecenter.org; the Promotional Pieces section cites 'existing relationships with the Acumen Fund, IFC'; Appendix IV records the five survey respondents (Linux Bazaar, Catalyst, Liberty Institute, Google, Junta) and their ratings."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11 - RUDI Multi Trading Company Limited", "org": "RUDI Multi Trading Company Limited", "folder": "India 2010", "sheet_row": 19, "parent": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11", "filled": 19, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11 - RUDI Multi Trading Company Limited", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement corresponds to the Fall 2010 semester of Yale SOM's Global Social Entrepreneurship (GSE) course, with joint planning meetings in New Haven in September 2010, student field visits to India in October 2010, and final client deliverables dated December 2010 through 21 January 2011. [India 2010/TEIL Marketing Plan Final 011611.docx] The title page reads 'Global Social Entrepreneurship / Fall 2010' and every page footer reads 'TEIL Marketing Plan, December 2010'."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Appendix T is Rohit Makhija's day-by-day travel journal of the team site visit to Kerala and Tamil Nadu on October 17-22, 2010."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The title page is dated '21 January 2011'."}]}, {"name": "Parent Program", "header": "Parent Program*", "value": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11", "sources": [{"file": null, "reason": "Constructed following the '6)
