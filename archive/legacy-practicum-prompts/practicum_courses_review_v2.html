d pilots'."}]}, {"name": "Sector", "header": "Sector", "value": "Affordable housing / informal-settlement construction", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 2 notes describe a focus on 'the informal construction industry in the settlements' and improving housing conditions for low-income communities; slide 3 lists 'Informal Settlements' as the organization's field."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "\"To apply an interdisciplinary approach to improve housing conditions for low-income communities; to design solutions for smart, resilient and inclusive cities.\"", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 2 ('Client Mission') states verbatim: 'To apply an interdisciplinary approach to improve housing conditions for low-income communities / To design solutions for smart, resilient and inclusive cities'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "mHS works on the informal construction industry in Delhi's settlements through think-tank/policy work and construction-related pilots. Its current product is a digital cost-calculator tool (to be distributed as an app) that gives masons and homeowners access to technical assistance for safe, high-quality self-construction in informal settlements.", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 3 notes describe the activities as 'Think tank, policy, construction-related pilots'."}, {"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 5 states the opportunity: 'Using digital tools, provide access to technical assistance that facilitates safe and high quality self-construction in informal settlements', and slide 6 notes explain 'This cost calculator is being tested in different formats, but will ultimately be distributed as an app'."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": "5 team members", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 3 displays '5 / Team members', and the speaker notes clarify the two founders work out of Italy plus 'a team of 3 in Delhi'."}]}, {"name": "People Served", "header": "How many people do you serve?", "value": null, "sources": []}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Rakhi Mehra", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 3 ('ORGANIZATION') names 'Rakhi Mehra' alongside 'Marco Ferrario'; the speaker notes identify them as the founders ('Rakhi HBS grad (business)')."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": "Co-founder", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 3 speaker notes say 'Founders (show)- Rakhi HBS grad (business), Marco is an architect', identifying Rakhi Mehra as a founder."}]}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Marco Ferrario", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 3 names 'Marco Ferrario' as the second founder shown alongside Rakhi Mehra."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": "Co-founder (architect)", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 3 speaker notes state 'Marco is an architect' and identify him as one of the founders."}]}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Housing & Shelter", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "'Housing & Shelter' directly matches the mission 'to improve housing conditions for low-income communities' (slide 2) and the focus on safe housing/self-construction in informal settlements (slides 5-6), including the notes' citation of an 18-million-unit housing shortage in India (slide 4 notes)."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Safe self-construction in informal settlements; technical assistance and cost estimation for informal masons; digital tools/app for low-income housing construction; smart, resilient and inclusive cities", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 5 describes digital tools for 'safe and high quality self-construction in informal settlements', slide 4 notes describe the mason Raju's inaccurate cost estimates, slide 6 notes describe the cost-calculator app, and slide 2 states the 'smart, resilient and inclusive cities' goal."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "early stage", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 3 shows the organization was founded in 2009 and has only '5' team members (notes: two founders in Italy plus a team of 3 in Delhi)."}, {"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 6 notes say the cost calculator 'is being tested in different formats' (pre-launch pilot), and slide 8 shows mHS still asking 'What business model leads to financial sustainability?' - evidence of an early-stage venture without an established revenue model."}]}, {"name": "Project City", "header": "Project City", "value": "New Delhi", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 2 notes state 'mHS is a social venture in Delhi, India', slide 3 lists 'Office Locations: Italy and new delHi', and slide 4 notes describe the target settlement context in New Delhi (e.g., Mongulpuri)."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Delhi", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 2 notes place the venture and its informal-settlement focus in Delhi, India."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 2 notes state the client is 'in Delhi, India', and slide 9 notes describe the team's India site visit."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale GSE team was engaged to help mHS maximize user adoption of its construction cost-calculator app and achieve financial sustainability. The project ran in three phases: contextual research and customer insights, an India site visit with extensive interviews and ecosystem/stakeholder analysis, and final deliverables. The team recommended three distribution channels for the app - kiosks with the local NGO SEWA, cement dealers, and mobile shops - each with a 12-month rollout roadmap and revenue mechanisms (user fees, commissions, ad revenue from suppliers/dealers). It also built a financial model with a data-tracking tab and dashboard so mHS can project revenues and costs for each strategy and update assumptions with monthly actuals.", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 8 notes state 'mHS approached GSE so that our team could help with two things; 1) maximize user adoption ... and 2) enable them to be financially sustainable'."}, {"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 9 lays out the three phases ('Contextual Research / Customer Insights', 'Ecosystem Analysis', 'Distribution strategies / Financial models'), with notes describing the India visit and interviews."}, {"file": "India 2016/mHS SI Lab Final.pptx", "reason": "Slide 12 presents the distribution strategies for SEWA, dealers, and mobile shops with 0-12 month phases and revenue elements (user fees, commissions, ad revenue, scratch cards), and its notes name the three recommended channels."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue, Marketing, Scaling", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "'Financial Modeling' is explicit: slide 13 is titled 'FINANCIAL MODEL' and the notes describe the projection model, data-tracking tab, and dashboard the team built."}, {"file": "India 2016/mHS SI Lab Final.pptx", "reason": "'Business Strategy/Revenue' fits slide 8's framing question 'What business model leads to financial sustainability?' and the revenue mechanisms (user fees, ad revenue, commissions) in slide 12."}, {"file": "India 2016/mHS SI Lab Final.pptx", "reason": "'Marketing' is an approximate match for the distribution/user-adoption work: slide 8 asks 'How do we get the app into people's hands?' and slide 12 details channel strategies including 'DATA ANALYTICS FOR TARGETED MARKETING'."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Only the SI Lab final presentation is available for this organization/year - no final report, scope of work, or contact sheet - so website, contact details, and beneficiary numbers cannot be filled. The deck identifies the client only as 'mHS' / 'mHS CITY LAB' (slide 1 logo); the expansion 'micro Home Solutions' does not appear anywhere in the file. Yale student team member names are not listed in the deck. Core properties: author 'rafal', last modified 2016-03-09 by Zoe Lloyd, revision 304. Only SI Lab final presentations are available for this year. Engagement assigned to the 2015-16 GSE India year: both decks were finalized March 9, 2016, the same date and editor as the NeuroS final report of the 2015-16 GSE India cohort.", "sources": [{"file": "India 2016/mHS SI Lab Final.pptx", "reason": "The India 2016 folder contains only this 15-slide SI Lab presentation for mHS (plus the BASIX deck); slide 1 is the 'mHS CITY LAB' logo, no slide lists team member or contact details, and core_properties show author 'rafal' and modified 2016-03-09 by 'Zoe Lloyd'."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/15 - 6/30/16 - NeuroSynaptic Communications Pvt. Ltd.", "org": "NeuroSynaptic Communications Pvt. Ltd.", "folder": "Inida 2017", "sheet_row": 39, "parent": "Global Social Entrepreneurship India - 7/1/15 - 6/30/16", "filled": 22, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/15 - 6/30/16 - NeuroSynaptic Communications Pvt. Ltd.", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: The engagement ran from mid-October 2015 to mid-March 2016 (GSE India, academic year 2015-16), with the in-country trip in January 2016 and the final report dated March 9, 2016 — contradicting the folder label '2017'. [Inida 2017/NeuroS Yale GSE - Final Report.pdf] The Executive Summary (p.3) states: 'From mid-October 2015 to mid-March 2016, a team of students from the Yale School of Management (Yale SOM), the Yale School of Public Health (YSPH) and the Indian Institute of Management in Bangalore (IIMB) engaged in a consulting project on behalf of NeuroSynaptic Communications Pvt. Ltd.'"}, {"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The title page (p.1) is dated 'March 9, 2016'."}, {"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The Site Visits and Interviews section (p.11) states 'Site visits were conducted in January 2016 throughout Tamil Nadu.'"}]}, {"name": "Parent Program", "header": "Parent Program*", "value": "Global Social Entrepreneurship India - 7/1/15 - 6/30/16", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: The engagement ran from mid-October 2015 to mid-March 2016 (GSE India, academic year 2015-16), with the in-country trip in January 2016 and the final report dated March 9, 2016 — contradicting the folder label '2017'. [Inida 2017/NeuroS Yale GSE - Final Report.pdf] The Executive Summary (p.3) states: 'From mid-October 2015 to mid-March 2016, a team of students from the Yale School of Management (Yale SOM), the Yale School of Public Health (YSPH) and the Indian Institute of Management in Bangalore (IIMB) engaged in a consulting project on behalf of NeuroSynaptic Communications Pvt. Ltd.'"}, {"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The title page (p.1) is dated 'March 9, 2016'."}, {"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The Site Visits and Interviews section (p.11) states 'Site visits were conducted in January 2016 throughout Tamil Nadu.'"}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "NeuroSynaptic Communications Pvt. Ltd.", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The Executive Summary (p.3) names the client 'NeuroSynaptic Communications Pvt. Ltd. (NeuroS)', and the section heading on p.6 is 'About NeuroSynaptic Communications Pvt. Ltd.'"}, {"file": "Inida 2017/NeuroS Social Impact Recommendation.pdf", "reason": "The document title (p.1) reads 'Neurosynaptic Communications, Private Limited — Proposed Social Impact Metrics and Tracking Procedures'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": "http://www.neurosynaptic.com", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The appendix section 'The Neurosynaptic Communications Pvt. Ltd. Team' (p.22) states the leadership descriptions are taken 'from http://www.neurosynaptic.com/executive-team/'."}]}, {"name": "Org Type", "header": "Org Type", "value": "For-profit social enterprise (private limited company)", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The Executive Summary (p.3) describes the client as 'a Bangalore, India-based social enterprise founded in 2002', and the legal name 'Pvt. Ltd.' (Private Limited) throughout the report indicates a for-profit company structure."}, {"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "Pages 7-8 describe the company selling technology kits for revenue and planning to transition 'to being a Software as a Service (SaaS) company with a usage-based recurring revenue model', evidencing a commercial business model."}]}, {"name": "Sector", "header": "Sector", "value": "Telemedicine / rural healthcare technology", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "Page 6 calls the founders 'pioneers and innovators of telemedicine in India' and p.9 states 'Currently, NeuroS is primarily a technology solutions provider' whose kits 'facilitate remote medical consultations' between rural patients and doctors."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "NeuroS' social impact mission is to enable access to healthcare — anytime, anywhere — using telemedicine technology to bring safe, affordable, quality healthcare to rural and impoverished parts of India.", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "Page 6 states: 'NeuroS' social impact mission is to: Enable access to healthcare. Anytime. Anywhere.' and describes the founders' focus on 'addressing the need for safe, quality healthcare in rural and impoverished parts of India'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "NeuroS develops and sells bundled 'kits' of at least five electronic medical diagnostic devices connected to proprietary software with an electronic medical record, sold to implementation partners (hospitals, NGOs, doctors, entrepreneurs) who run rural telemedicine centers connecting village patients to remote doctors via low-bandwidth video consultation. In 2016 it was rolling out ReMeDi 2.0, a cloud-based, Android-compatible, wireless suite of telemedicine tools intended to shift the company from product sales to a SaaS, usage-based recurring revenue model.", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "Page 8 ('NeuroS' Kits and Technology Development') describes the primary product as 'a bundled \"kit\" of at least five electronic medical diagnostic devices, which are connected to a computer that runs NeuroS' proprietary software' with EMR storage and low-bandwidth video teleconference, and states 'During 2016, NeuroS is rolling out a new suite of technologies, called Remote Medical Diagnostics 2.0 (ReMeDi 2.0)'."}, {"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "Page 9 ('How it Works') explains the kit and software are sold to implementation partners — hospitals, NGOs, individual doctors and community-based entrepreneurs — who set up and manage the telemedicine centers."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": 30, "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "Page 7 states: 'As of early 2016, NeuroS employed roughly 30 people, evenly split across R&D (hardware and software), Field Support & Production, and Selling General & Administrative.'"}]}, {"name": "People Served", "header": "How many people do you serve?", "value": null, "sources": []}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Sameer Sawarkar", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The title page (p.1) lists the 'NeuroSynaptic Team: Sameer Sawarkar and Rajeev Kumar', and the appendix (p.22) lists 'Sameer Sawarkar: CEO' as the first member of the NeuroS team."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": "CEO (co-founder)", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The appendix (p.22) lists 'Sameer Sawarkar: CEO', and p.6 states 'Two engineers, Sameer Sawarkar and Rajeev Kumar, founded NeuroSynaptic Communications Pvt. Ltd. (NeuroS) in 2002.'"}]}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Rajeev Kumar", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The title page (p.1) lists the 'NeuroSynaptic Team: Sameer Sawarkar and Rajeev Kumar', and the appendix (p.22) lists 'Rajeev Kumar Director' on the NeuroS team."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": "Director (co-founder)", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The appendix (p.22) lists 'Rajeev Kumar Director', and p.6 states he co-founded the company with Sameer Sawarkar in 2002."}]}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Health Care, Science & Technology", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "'Health Care' fits because p.6 states the mission is to 'Enable access to healthcare. Anytime. Anywhere.' and the whole report concerns delivering primary healthcare to rural India via telemedicine centers."}, {"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "'Science & Technology' is an approximate secondary fit because p.9 states 'Currently, NeuroS is primarily a technology solutions provider' that performs R&D and develops medical diagnostic hardware and software rather than delivering care directly."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Telemedicine; rural primary healthcare access; medical diagnostic devices and electronic medical records (ReMeDi 2.0); affordability and time/money savings for rural patients; empowerment of women, children and the elderly in healthcare access; diverting patients from unlicensed 'quack' providers to licensed doctors", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "Page 6 details the rural barriers NeuroS targets, including women needing male companions to travel for care and that 'Simply diverting patients from \"quacks\" to licensed medical providers through telemedicine represents a positive social impact', and p.8 describes the ReMeDi 2.0 diagnostic/EMR technology."}, {"file": "Inida 2017/NeuroS Social Impact Recommendation.pdf", "reason": "Page 1 proposes social metrics of 'Women/Children Empowerment', 'Time Savings' and 'Money Savings' from village telemedicine centers."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "Classified as established because p.3 states the company was 'founded in 2002' with '14 years of experience in the telemedicine industry in rural India', p.6 notes 'considerable revenue growth in 2008' through a World Health Partners partnership funded by a $23.35M Gates Foundation grant, and p.7 reports roughly 30 employees and revenue diversification into The Philippines, Myanmar, Nepal, Bangladesh and Kenya as of 2015-16."}]}, {"name": "Project City", "header": "Project City", "value": "Bangalore", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The Executive Summary (p.3) describes NeuroS as 'a Bangalore, India-based social enterprise' and states 'The Yale team met with NeuroS's leadership at their headquarters in Bangalore, India' (site visits then continued in Tamil Nadu per p.11)."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Karnataka", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The headquarters city Bangalore (p.3) is in Karnataka state; the report itself names only the city, while p.11 notes field site visits took place 'throughout Tamil Nadu'."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The Executive Summary (p.3) states the project was part of the course 'Global Social Entrepreneurship: India (GSE India)' for a 'Bangalore, India-based social enterprise', with fieldwork in rural India."}]}, {"name": "Project Description", "header": "Project Description", "value": "From mid-October 2015 to mid-March 2016, a team of Yale SOM, Yale School of Public Health and IIM Bangalore students advised NeuroS on refining the design of a new business model to accompany the rollout of its ReMeDi 2.0 telemedicine suite, including January 2016 site visits to telemedicine providers across Tamil Nadu. The team produced three deliverables: an Excel financial model of unit economics, cash flows and Business Partner IRR (with an accompanying guidebook explaining each worksheet), an operational model of telemedicine center scenarios, and a social impact scorecard with proposed metrics and tracking procedures. Key recommendations were that NeuroS must find the right Business Partners and design revenue-sharing agreements that align incentives, that breakeven requires centers seeing about twenty or more patients per day, and that partnering with underemployed doctors willing to consult at affordable rates is the greatest opportunity.", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The Executive Summary (pp.3-4) describes the five-month engagement, the primary question of 'refining the design of a new business model to accompany the rollout of ReMeDi 2.0', the three deliverables (financial model, operational model, social impact scorecard), and the findings on 20+ patients/day breakeven, Business Partner selection, revenue-sharing incentive alignment, and underemployed doctors."}, {"file": "Inida 2017/NeuroS Financial-Operational Model Guidebook.pdf", "reason": "The guidebook (p.1 title 'NeuroSynaptic Communications — Telemedicine Business Model') documents worksheet-by-worksheet how to use the operations and financial model workbook the team delivered."}, {"file": "Inida 2017/NeuroS Social Impact Recommendation.pdf", "reason": "Page 1 states the document 'outlines proposed social metrics and contains recommendations on how to implement the tracking and reporting of them' (women/children empowerment, time savings, money savings)."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Impact Assessment, Business Strategy/Revenue, Scaling", "sources": [{"file": "Inida 2017/Neurosynaptics Financial Model - Final 031116.xlsx", "reason": "'Financial Modeling' is supported by the delivered workbook of unit-economics, 12-month and 5-year cash flow, sensitivity-analysis and IRR sheets for NeuroS, Business Partners and health centers."}, {"file": "Inida 2017/NeuroS Social Impact Recommendation.pdf", "reason": "'Impact Assessment' is supported by the proposed social impact metrics, question bank and assessment/reporting cadence (p.1-and following) plus the Social Impact Scorecard deliverable described in the final report (pp.18-19)."}, {"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "'Business Strategy/Revenue' is supported by the project's core question of 'refining the design of a new business model' (p.3) including revenue sharing, fee structure, alternative pricing models and SaaS transition (pp.14-18)."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Date finding: despite the folder label 'Inida 2017', every document-internal date places this engagement in academic year 2015-16 — the final report is dated March 9, 2016 and describes work from mid-October 2015 to mid-March 2016 with site visits in January 2016; the xlsx was created 2015-11-20, its Social Impact Scorecard sheet is dated 2/17/2016, and its filename '031116' is most plausibly March 11, 2016 (consistent with the March 9, 2016 report; even read as dd-mm-yy it would be 3 Nov 2016, near the workbook's last-modified stamp of 2016-11-07 by course instructor Tony Sheldon). No document contains any 2017 date, so the folder label contradicts the evidence. Other notes: this was NeuroS' first participation in GSE India; no email addresses or phone numbers for the client appear anywhere in the four files; the xlsx core-properties creator is 'Rishabh Arora', a name not on the report's student roster; the report says WHP bought 'hundreds of kits' but gives no absolute people-served figure (its performance chart is normalized to FY2014-15 levels). Source folder is labeled 'Inida 2017' (typo for India 2017), but every document-internal date places this engagement in the 2015-16 GSE India year (final report dated March 9, 2016; engagement mid-October 2015 to mid-March 2016; site visits January 2016), so it is filed under FY16.", "sources": [{"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "The title page (p.1) is dated March 9, 2016, the Executive Summary (p.3) covers mid-October 2015 to mid-March 2016 and calls this 'the first opportunity for NeuroS to participate in the GSE India program', and p.11 dates site visits to January 2016 — no 2017 date appears anywhere."}, {"file": "Inida 2017/Neurosynaptics Financial Model - Final 031116.xlsx", "reason": "Workbook core properties show created 2015-11-20 by Rishabh Arora and modified 2016-11-07 by Tony Sheldon, and the 'Social Impact Scorecard' sheet cell A3 reads 'Date: 2/17/2016'."}, {"file": "Inida 2017/NeuroS Yale GSE - Final Report.pdf", "reason": "Pages 6-7 note WHP 'bought hundreds of kits' and present kit/revenue/employee metrics only as percentages 'normalized relative to itself with 100% being the FY2014-15 levels', so no absolute people-served count is stated."}]}]}, {"pid": "Spring Global Social Entrepreneurship - 7/1/19 - 6/30/20 - Hello Tractor", "org": "Hello Tractor", "folder": "kenya 2020", "sheet_row": 40, "parent": "Spring Global Social Entrepreneurship - 7/1/19 - 6/30/20", "filled": 15, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Spring Global Social Entrepreneurship - 7/1/19 - 6/30/20 - Hello Tractor", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: The engagement was a Spring 2020 semester project of Yale SOM's Global Social Entrepreneurship course, running roughly two months and concluding with final deliverables dated 8 May 2020. [kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx] The Project Scope section states 'In Spring 2020, Yale University partnered with Hello Tractor through Yale's Global Social Entrepreneurship (GSE) course' and the Executive Summary says the work occurred 'Over the course of two months'."}, {"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The title-page text box reads 'Final Report / Global Social Entrepreneurship: Kenya / 8 May 2020' and the docx core properties show created 2020-05-08."}, {"file": "kenya 2020/tractor_LATE_111162_3877043_Hello Tractor GSE User Guide_Final_8May2020.docx", "reason": "The Introduction states the model was 'prepared by the Yale SOM team in the spring of 2020 as part of a consulting engagement with Hello Tractor, Kenya (HT)', and the title page is dated '8th May 2020'."}]}, {"name": "Parent Program", "header": "Parent Program*", "value": "Spring Global Social Entrepreneurship - 7/1/19 - 6/30/20", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: The engagement was a Spring 2020 semester project of Yale SOM's Global Social Entrepreneurship course, running roughly two months and concluding with final deliverables dated 8 May 2020. [kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx] The Project Scope section states 'In Spring 2020, Yale University partnered with Hello Tractor through Yale's Global Social Entrepreneurship (GSE) course' and the Executive Summary says the work occurred 'Over the course of two months'."}, {"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The title-page text box reads 'Final Report / Global Social Entrepreneurship: Kenya / 8 May 2020' and the docx core properties show created 2020-05-08."}, {"file": "kenya 2020/tractor_LATE_111162_3877043_Hello Tractor GSE User Guide_Final_8May2020.docx", "reason": "The Introduction states the model was 'prepared by the Yale SOM team in the spring of 2020 as part of a consulting engagement with Hello Tractor, Kenya (HT)', and the title page is dated '8th May 2020'."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "Hello Tractor", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The Executive Summary opens 'Hello Tractor is a social enterprise that supports mechanization for smallholder farmers'."}, {"file": "kenya 2020/tractor_LATE_111162_3877043_Hello Tractor GSE User Guide_Final_8May2020.docx", "reason": "The Abbreviations list defines 'HT: Hello Tractor' and the Introduction names the client as 'Hello Tractor, Kenya (HT)'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "Social enterprise (for-profit startup company)", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The Background section calls Hello Tractor 'a small but growing social enterprise headquartered in Nairobi, Kenya' and refers to it as 'the company'; the Project Challenges section says 'Hello Tractor is a startup entering a new space'."}]}, {"name": "Sector", "header": "Sector", "value": "Agriculture / agricultural technology (IoT-enabled tractor services and farm mechanization)", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The Background section describes an 'Internet-of-Things (IoT) device that, when affixed to a tractor, tracks a range of metrics' and a 'marketplace for tractor services, connecting tractor owners and farmers' serving smallholder agriculture."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "Hello Tractor's mission is to provide access to mechanization for smallholder farmers, supporting mechanized tractor services in order to increase crop yield and, in turn, farmer prosperity.", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The Background section states 'With a mission to provide access to mechanization for smallholder farmers, however, Hello Tractor soon expanded their remit to become a marketplace for tractor services', and the Executive Summary says it 'supports mechanization for smallholder farmers in order to increase crop yield and in turn, prosperity'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "Hello Tractor sells proprietary IoT tracking devices that monitor tractor location and use, and operates a marketplace (apps plus on-the-ground booking agents) that connects tractor owners with smallholder farmers needing services, earning commissions on both. Through its Tractor Expansion Program pilot it is launching its own SPV-owned fleet, starting with 25 tractors in Kenya with hired operators and booking agents, with Phase II planned to scale to 200 tractors.", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The Executive Summary states 'Hello Tractor sells proprietary IoT devices' and 'plans to purchase 25 tractors equipped with their IoT devices, hire tractor operators, and build out their network of booking agents to expand tractor service offerings in Kenya'."}, {"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The Business Model section explains it connects 'tractor owners with farmers in need of services, through a combination of their apps, on-the-ground booking agents and the use of their IoT device', makes 'a commission' on both services, and that 'Phase II will begin in 2022, fundraising permitting, expanding to 200 tractors'."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": null, "sources": []}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": null, "sources": []}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": null, "sources": []}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Food Agriculture & Nutrition, Employment", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "'Food Agriculture & Nutrition' is the closest category because the organization exists 'to increase tractor access to smallholder farmers' whose farming provides 'both food and income' in Kenya, where 'most of the food grown in Kenya is grown by smallholder farmers'."}, {"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "'Employment' is an approximate secondary category based on the Business Model section stating the model 'creates additional employment for tractor operators and booking agents' and the program's hiring and training of operators, mechanics, and managers."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Agricultural mechanization access for smallholder farmers; IoT tractor tracking and fleet monitoring; tractor-services marketplace and booking-agent network; rural job creation (tractor operators, booking agents, field mechanics/managers); project-finance-funded tractor fleet expansion (SPV).", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The Background and Business Model sections describe the IoT tracking device, the marketplace connecting tractor owners and farmers via apps and booking agents, employment created for operators and booking agents, and the SPV-owned Tractor Expansion Program."}, {"file": "kenya 2020/tractor_LATE_111162_3877042_HT Project Finance Financial Model Final.xlsx", "reason": "The Legend and Model Summary tab titles the workbook 'Hello Tractor SPV Project Finance Model', confirming the SPV tractor-fleet financing focus."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "early stage", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The report calls Hello Tractor 'a small but growing social enterprise' and 'a startup entering a new space' whose Phase I operations plan 'is still in flux', and the Tractor Expansion Program was only anticipated to launch its 25-tractor pilot in Spring 2020 — evidence of an early-stage organization despite existing partnerships (John Deere, IBM, One Acre Fund)."}]}, {"name": "Project City", "header": "Project City", "value": "Nairobi", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The Background section states Hello Tractor is 'headquartered in Nairobi, Kenya', and Project Challenges notes the lead of finance 'does not work out of the Hello Tractor office in Nairobi'."}, {"file": "kenya 2020/tractor_LATE_111162_3877043_Hello Tractor GSE User Guide_Final_8May2020.docx", "reason": "The Tractor Allocations description says the fleet is distributed 'to the four regions in which Hello Tractor operates — North Rift, Western, Mt. Kenya/Central, and Nyanza'."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": null, "sources": [], "rev": {"status": "cleared", "note": "QA ⚠️ accepted: the four operating regions (North Rift, Western, Mt. Kenya/Central, Nyanza) are not one administrative unit; the text moved to Notes."}}, {"name": "Project Country", "header": "Project Country", "value": "Kenya", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The title page reads 'Global Social Entrepreneurship: Kenya' and the Executive Summary says the program will 'expand tractor service offerings in Kenya'; Nigeria is not mentioned anywhere in the documents."}, {"file": "kenya 2020/tractor_LATE_111162_3877042_HT Project Finance Financial Model Final.xlsx", "reason": "The Legend and Model Summary table of contents describes the Tractor Allocations tab as covering 'specific tasks and regions of the country (Kenya only)'."}]}, {"name": "Project Description", "header": "Project Description", "value": "In Spring 2020, a six-student Yale SOM GSE team consulted pro bono for Hello Tractor to build a sophisticated project-finance financial model for its Tractor Expansion Program, in which an SPV purchases an initial fleet of 25 tractors (Phase I) with planned scaling to 200 tractors (Phase II). Starting from Hello Tractor's basic model, the team interviewed staff over two months, conducted deep dives into revenue and cost assumptions, and delivered a 12-tab dynamic Excel model with scenario and sensitivity analysis, an accompanying user guide, and a final report. The team recommended basing Phase II inputs on realized Phase I data, doubling down on operations and implementation, and continuously tracking key operational, financial, and impact indicators. Strategic recommendations covered building farmer relationships, choosing high-margin services, growing operator productivity, maximizing tractor utilization, empowering booking agents, and leveraging partners.", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "The Project Scope section states 'groups of six students are partnered with an international social enterprise', that 'The GSE team was tasked with creating a sophisticated financial model for Hello Tractor's Tractor Expansion Program', and the Recommendations section lists the tactical and strategic recommendations summarized here."}, {"file": "kenya 2020/tractor_LATE_111162_3877043_Hello Tractor GSE User Guide_Final_8May2020.docx", "reason": "The Introduction describes the accompanying 12-tab 'Hello Tractor Financial Model' Excel file as a forward-looking cash flow projection and planning tool prepared by the Yale SOM team."}, {"file": "kenya 2020/tractor_LATE_111162_3877042_HT Project Finance Financial Model Final.xlsx", "reason": "The workbook contains the delivered model with 15 sheets including Revenue Assumptions (25 tractors purchased, KES/USD toggle, base and downside scenarios), Monthly/Annual Operations, and Key Results with utilization and fuel-cost sensitivity tables."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue, Scaling, Impact Assessment", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877042_HT Project Finance Financial Model Final.xlsx", "reason": "'Financial Modeling' — the primary deliverable is the 'Hello Tractor SPV Project Finance Model' workbook with assumption, cash flow, financial statement, and sensitivity tabs."}, {"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "'Business Strategy/Revenue' — the report analyzes key revenue and cost drivers and gives strategic recommendations on service offerings, pricing, operators, booking agents, and partners."}, {"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "'Scaling' — the model was built to inform the move from the 25-tractor Phase I pilot to a 200-tractor Phase II expansion ('scaling to 200 tractors is a substantive increase')."}, {"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "Appendix IV 'Select Impact Metrics' defines impact metrics for the fleet expansion, supporting the Impact Assessment tag."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "The 'tractor_LATE_111162_38770xx' filename prefixes indicate an LMS (e.g., Canvas) bulk submission export flagged as a late submission. The project was disrupted by COVID-19 and by locust swarms in Kenya. No Hello Tractor staff names, emails, or phone numbers appear in any document; the report only notes the primary contact/lead of finance lives in Johannesburg, not Nairobi. File metadata: report authored by Sarah Thompson (created 8 May 2020), user guide by Ivan Kapkoi, and the workbook created by 'Ripley' on 8 Apr 2020 and last modified by Ivan Kapkoi on 8 May 2020 — matching the six named students (Ripley Carlson, Eun Sun Cho, Daniel Csonth, Sarah Gross, Ivan Kapkoi, Sarah Thompson). The model deliberately does not represent expected actual cash flows because key assumptions were unvalidated; the workbook retains a legacy 'Initial Assumptions' and 'Revenues-old' sheet from Hello Tractor's original basic model. Named partners include One Acre Fund, John Deere, IBM, Agrimech (crop season data), and M-PESA (transaction costs). Project State/Province/District left blank: Hello Tractor operates across four regions — North Rift, Western, Mt. Kenya/Central, and Nyanza [kenya 2020/tractor_LATE_111162_3877043_Hello Tractor GSE User Guide_Final_8May2020.docx, 'Summary of Fleet Distribution by Region'] — which mix geographic labels and are not a single administrative unit.", "sources": [{"file": "kenya 2020/tractor_LATE_111162_3877041_Hello Tractor GSE Report_Final.docx", "reason": "Project Challenges states 'Coronavirus impacted both Hello Tractor operations and the GSE team's ability to meet and collect data' and 'locust swarms in Kenya and regional weather impacted the farming schedule', and that 'the primary contact and the lead of finance lives in Johannesburg'; Appendix I names the six team members; docx metadata lists author 'Thompson, Sarah'."}, {"file": "kenya 2020/tractor_LATE_111162_3877043_Hello Tractor GSE User Guide_Final_8May2020.docx", "reason": "The filename carries the 'tractor_LATE_111162_3877043_' LMS-export prefix, the docx metadata lists author Ivan Kapkoi, and the guide notes crop seasons 'have been pre-populated using data provided by Agrimech' and M-PESA transaction cost inputs."}, {"file": "kenya 2020/tractor_LATE_111162_3877042_HT Project Finance Financial Model Final.xlsx", "reason": "Workbook properties show creator 'Ripley', created 2020-04-08, last modified by Ivan Kapkoi 2020-05-08, and the sheet list includes legacy 'Initial Assumptions' and 'Revenues-old' tabs alongside the 12 documented tabs; the Legend tab states the model 'is not meant to represent actual expected cashflows'."}, {"file": "kenya 2020/tractor_LATE_111162_3877043_Hello Tractor GSE User Guide_Final_8May2020.docx", "reason": "'Summary of Fleet Distribution by Region' names the four operating regions — text moved here from Project State/Province/District in the 2026-08-02 QA revision."}], "rev": {"status": "revised", "note": "Appended in v2: the four operating regions moved here from Project State/Province/District."}}]}], "virtual_folders": {"India 2013": {"target_pid": "Global Social Entrepreneurship India - 7/1/12 - 6/30/13 - Swadhaar", "note": "The \"India 2013\" folder contains only byte-identical copies (and one .docx version) of the Fall 2012 Swadhaar deliverables in \"India 2012\"; it is merged into the Swadhaar row (Global Social Entrepreneurship India - 7/1/12 - 6/30/13) rather than listed as a separate 2013-14 project."}}, "archive_notes": [{"label": "India 2013", "text": "The \"India 2013\" folder contains only byte-identical copies (and one .docx version) of the Fall 2012 Swadhaar deliverables in \"India 2012\"; it is merged into the Swadhaar row (Global Social Entrepreneurship India - 7/1/12 - 6/30/13) rather than listed as a separate 2013-14 project."}, {"label": "Inida 2017", "text": "The \"Inida 2017\" folder (typo for India 2017) is dated by all document-internal evidence to the 2015-16 GSE India year and is filed under Global Social Entrepreneurship India - 7/1/15 - 6/30/16."}, {"label": "India 2016", "text": "The \"India 2016\" folder holds Spring-2016 SI Lab decks finalized 2016-03-09, same date/editor as the NeuroS final report of the 2015-16 GSE India cohort; filed under Global Social Entrepreneurship India - 7/1/15 - 6/30/16."}], "revision_html": "<h2 class=\"sec\">QA review & v2 revision (2026-08-02)</h2><div class=\"revsec\"><div style=\"font-size:12.8px;color:var(--ink-2);line-height:1.55\">This is v2: revised in response to the independent QA review (<span class=\"mono2\">practicum_courses_qa_review_2026-08-01.md</span>, verdict ⚠️ PASS WITH ISSUES). Full changes and justifications are in <span class=\"mono2\">practicum_courses_revision_log_2026-08-02.md</span>; the provenance JSON is updated in sync (775 records). Colored tags on the field rows below mark this cycle’s fixes / revisions / clearings / rebutted keeps.</div><div class=\"revchips\"><span class=\"revchip\">1 ❌ fixed</span><span class=\"revchip\">2 cells revised</span><span class=\"revchip\">3 cells cleared (moved to Notes)</span><span class=\"revchip\">7 rebuttals</span><span class=\"revchip\">6 already as recommended</span><span class=\"revchip\">26 taxonomy mappings retained per review</span><span class=\"revchip\">775 sourced cells (was 777)</span></div><details open><summary class=\"revsum\">Cell changes (6)</summary><table><thead><tr><th>Row</th><th>Folder</th><th>Organization</th><th>Field</th><th>Action</th><th>Change</th></tr></thead><tbody><tr><td class=\"mono2\">29</td><td>India 2012</td><td style=\"font-weight:600\">B-ABLE</td><td>Staff Count</td><td><span class=\"revbadge fixed\">FILLED · QA ❌</span></td><td>blank → “9-member project management team (organization-wide count not stated)”</td></tr><tr><td class=\"mono2\">2</td><td>Brazil 2015</td><td style=\"font-weight:600\">Avante</td><td>Name of Contact 2</td><td><span class=\"revbadge revised\">REVISED · QA ⚠️</span></td><td>“Rui (surname not given in documents)” → “Rui” (caveat moved to Notes)</td></tr><tr><td class=\"mono2\">35</td><td>India 2014</td><td style=\"font-weight:600\">SNEHA</td><td>Staff Count</td><td><span class=\"revbadge revised\">REVISED · QA ⚠️</span></td><td>additive “plus” wording → neutral list (“whether included within the 366 is not stated”)</td></tr><tr><td class=\"mono2\">22</td><td>India 2011</td><td style=\"font-weight:600\">Anudip Foundation</td><td>People Served</td><td><span class=\"revbadge cleared\">CLEARED · QA ⚠️</span></td><td>center-count proxy text → moved to Notes; cell left blank</td></tr><tr><td class=\"mono2\">23</td><td>India 2011</td><td style=\"font-weight:600\">ONergy</td><td>People Served</td><td><span class=\"revbadge cleared\">CLEARED · QA ⚠️</span></td><td>REC/target proxy text → moved to Notes; cell left blank</td></tr><tr><td class=\"mono2\">40</td><td>kenya 2020</td><td style=\"font-weight:600\">Hello Tractor</td><td>Project State/Province/District</td><td><span class=\"revbadge cleared\">CLEARED · QA ⚠️</span></td><td>four operating regions → moved to Notes; cell left blank</td></tr></tbody></table><div class=\"small\" style=\"margin-top:6px\">Notes were additionally appended on 4 rows (2, 22, 23, 40). Rows 37–38 Parent Program / Project ID, the KKPKP organization name, 4 Project Success values, and the dr.consulta city are rebutted keeps — unchanged.</div></details><details><summary class=\"revsum\">7 rebuttals (re-review of these items only is recommended)</summary><ol><li><b>dr.consulta — Project City</b> — kept “Sao Paulo”: the deck documents clinic visits in São Paulo districts</li><li><b>dr.consulta — Project Success</b> — kept “Medium”: partial/planned adoption without measured outcomes</li><li><b>SEWA Managers School — Project Success</b> — kept “Medium”: same reasoning</li><li><b>ZMQ — Project Success</b> — kept “Medium”: same reasoning</li><li><b>B-ABLE — Project Success</b> — kept “Medium”: same reasoning</li><li><b>KKPKP — Organization</b> — kept the acronym: only form in any document; external sources not permitted</li><li><b>Rows 37–38 — Parent Program / Project ID</b> — kept GSE India FY16: NeuroS report p.3 names “GSE India program”; all three deliverables finalized same day by the same editor</li></ol></details><details><summary class=\"revsum\">Unresolved items (8)</summary><ol><li>FY16 program assignment (rows 37–39): kept GSE India on in-corpus evidence; Yale course roster/registrar archive would close it definitively.</li><li>Project Success rubric: four “Medium” cells kept on the reading Medium = partial/planned adoption without measured outcomes; official High/Medium/Low rubric needed.</li><li>KKPKP full/legal name: acronym-only in every document; needs a policy ruling or an externally sourced full name.</li><li>BASIX (India 2016) legal entity and contact surnames (Farah / Nekib): not determinable from the single deck.</li><li>Avante Contact 2 surname (“Rui”, CTO): first-name-only in the itinerary; needs a period staff roster.</li><li>Main Issue Area taxonomy crosswalk: 26 approximate mappings (financial inclusion, energy access, waste, livelihoods) await a taxonomy-owner decision.</li><li>Contact-ownership policy (Peixes da Amazonia): both contacts are Kaeté Investimentos personnel; ruling needed on whether contact fields must hold client-org employees.</li><li>SNEHA staff overlap: whether the 24 management staff are inside the 366 full-time count is not stated in either source.</li></ol></details></div>"};

const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const REVBADGE = {"fixed": "FILLED · QA ❌", "revised": "REVISED · QA ⚠️", "cleared": "CLEARED · QA ⚠️", "kept_rebut": "KEPT · REBUTTED", "kept_ok": "KEPT · AS RECOMMENDED"};
const revHtml = f => f.rev ? `<div><span class="revbadge ${f.rev.status}">${REVBADGE[f.rev.status]||f.rev.status}</span></div><div class="revnote">${esc(f.rev.note)}</div>` : '';


const rowsByFolder = {};
for (const r of DATA.rows) (rowsByFolder[r.folder] = rowsByFolder[r.folder] || []).push(r);
const rowByPid = Object.fromEntries(DATA.rows.map(r => [r.pid, r]));
const ordered = DATA.rows.slice().sort((a,b)=>a.sheet_row-b.sheet_row);

let state = { pid: null, query: '' };

/* ---------- sidebar ---------- */
function rowMatches(r, q){
  if (!q) return true;
  q = q.toLowerCase();
  if (r.org.toLowerCase().includes(q) || r.folder.toLowerCase().includes(q)) return true;
  return r.fields.some(f => f.value && String(f.value).toLowerCase().includes(q));
}
function renderNav(){
  const q = state.query;
  const nav = $('#nav'); nav.innerHTML = '';
  for (const folder of DATA.folder_order){
    const virt = DATA.virtual_folders[folder];
    const rows = (rowsByFolder[folder]||[]).filter(r=>rowMatches(r,q));
    if (q && !rows.length && !(virt && folder.toLowerCase().includes(q.toLowerCase()))) continue;
    const g = document.createElement('div');
    g.className = 'fgroup open';
    let head = `<div class="fhead"><span class="tri">▶</span><span class="fname">${esc(folder)}</span>`;
    if (virt) head += `<span class="fbadge">merged ↦</span>`;
    head += `<span class="fcount">${virt ? '' : rows.length + ' row' + (rows.length===1?'':'s')}</span></div>`;
    let list = '<div class="rowlist">';
    if (virt){
      const t = rowByPid[virt.target_pid];
      list += `<div class="rowitem${state.pid===virt.target_pid?' active':''}" data-pid="${esc(virt.target_pid)}" title="This folder's files are duplicates of the Fall 2012 Swadhaar deliverables — see the row's Notes">
        <span class="rnum">→${t.sheet_row}</span><span class="rorg">see Swadhaar (India 2012)</span></div>`;
    } else {
      for (const r of rows){
        list += `<div class="rowitem${state.pid===r.pid?' active':''}" data-pid="${esc(r.pid)}">
          <span class="rnum">${r.sheet_row}</span><span class="rorg">${esc(r.org)}</span></div>`;
      }
    }
    list += '</div>';
    g.innerHTML = head + list;
    g.querySelector('.fhead').addEventListener('click', ()=>g.classList.toggle('open'));
    for (const el of g.querySelectorAll('.rowitem'))
      el.addEventListener('click', ()=>{ state.pid = el.dataset.pid; render(); });
    nav.appendChild(g);
  }
}

/* ---------- overview ---------- */
function colLetter(i){ // 0-based -> A..AE
  return i < 26 ? String.fromCharCode(65+i) : 'A' + String.fromCharCode(65+i-26);
}
function renderOverview(){
  const m = $('#main');
  const notes = DATA.archive_notes.map(n =>
    `<div class="callout"><b>${esc(n.label)}:</b> ${esc(n.text)}</div>`).join('');
  let tbl = `<table class="ovr"><thead><tr>
    <th>Row</th><th>Folder</th><th>Organization</th><th>Parent Program</th>
    <th>Main Issue Area(s)</th><th>Filled</th></tr></thead><tbody>`;
  for (const r of ordered){
    const ia = (r.fields.find(f=>f.name==='Main Issue Area(s)')||{}).value || '';
    const pills = ia ? ia.split(', ').map(x=>`<span class="pill">${esc(x)}</span>`).join('') : '—';
    tbl += `<tr class="clickable" data-pid="${esc(r.pid)}">
      <td style="font-family:var(--mono);font-size:11px;color:var(--ink-3)">${r.sheet_row}</td>
      <td style="white-space:nowrap">${esc(r.folder)}</td>
      <td style="font-weight:600">${esc(r.org)}</td>
      <td style="font-size:11.5px;color:var(--ink-2)">${esc(r.parent)}</td>
      <td>${pills}</td>
      <td class="fillbar">${r.filled}/31</td></tr>`;
  }
  tbl += '</tbody></table>';
  m.innerHTML = `
    <div class="stats">
      <div class="stat"><div class="v">${DATA.folder_order.length}</div><div class="l">source folders</div></div>
      <div class="stat"><div class="v">${DATA.rows.length}</div><div class="l">rows written (2–40)</div></div>
      <div class="stat"><div class="v">31</div><div class="l">columns per row</div></div>
      <div class="stat"><div class="v">${DATA.total_cells}</div><div class="l">filled &amp; sourced cells</div></div>
    </div>
    ${DATA.revision_html}
    <h2 class="sec">Archive findings</h2>${notes}
    <h2 class="sec">All rows — ${esc(DATA.workbook)} · sheet "${esc(DATA.sheet)}"</h2>${tbl}
    <div class="legend"><details class="leg"><summary>Column name legend (short name → exact sheet header)</summary>
      <table>${ordered[0].fields.map((f,i)=>`<tr><td>${colLetter(i)} · ${esc(f.name)}</td><td>${esc(f.header)}</td></tr>`).join('')}</table>
    </details></div>`;
  for (const tr of m.querySelectorAll('tr.clickable'))
    tr.addEventListener('click', ()=>{ state.pid = tr.dataset.pid; render(); });
}

/* ---------- row detail ---------- */
function hl(text){
  const q = state.query.trim();
  let out = esc(text);
  if (q){
    const re = new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi');
    out = out.replace(re, m=>`<mark>${m}</mark>`);
  }
  return out;
}
function renderRow(r){
  const idx = ordered.findIndex(x=>x.pid===r.pid);
  const prev = ordered[idx-1], next = ordered[idx+1];
  const m = $('#main');
  const filledRows = r.fields.filter(f=>f.value!==null);
  const emptyRows = r.fields.filter(f=>f.value===null);
  const specialNote = Object.entries(DATA.virtual_folders).find(([,v])=>v.target_pid===r.pid);

  function fieldHTML(f){
    const i = r.fields.indexOf(f);
    let valHtml;
    if (f.value === null){
      valHtml = (f.rev && f.rev.status==='cleared')
        ? `<div class="fvalue empty">— cleared in the v2 revision (content moved to Notes)</div>`
        : `<div class="fvalue empty">— left blank (not determinable from the folder's documents)</div>`;
    } else if (f.name==='Project Tags' || f.name==='Main Issue Area(s)'){
      valHtml = `<div class="fvalue">${String(f.value).split(', ').map(x=>`<span class="tagpill">${hl(x)}</span>`).join('')}</div>`;
    } else {
      valHtml = `<div class="fvalue">${hl(String(f.value))}</div>`;
    }
    const srcs = f.sources.length ? `<div class="srcs">${f.sources.map(s=>`
      <div class="srcitem">${s.file?`<span class="srcfile" title="${esc(s.file)}">${esc(s.file)}</span>`:''}
      <span class="srcreason">${hl(s.reason)}</span></div>`).join('')}</div>` : '';
    const q = state.query.trim().toLowerCase();
    const highlight = q && f.value && String(f.value).toLowerCase().includes(q) ? ' highlight' : '';
    return `<div class="fieldrow${highlight}">
      <div class="fname2" title="${esc(f.header)}"><span class="colno">col ${colLetter(i)}</span>${esc(f.name)}</div>
      <div class="fbody">${valHtml}${revHtml(f)}${srcs}</div></div>`;
  }

  m.innerHTML = `
    <div class="crumb"><span class="home">← All rows</span> <span>/</span>
      <span>${esc(r.folder)}</span><span>/</span><span style="color:var(--ink)">${esc(r.org)}</span>
      <span class="navbtns">
        <button id="prevb" ${prev?'':'disabled'}>← row ${prev?prev.sheet_row:''}</button>
        <button id="nextb" ${next?'':'disabled'}>row ${next?next.sheet_row:''} →</button>
      </span></div>
    <div class="rowtitle"><h2>${esc(r.org)}</h2>
      <span class="meta">sheet row ${r.sheet_row} · source folder “${esc(r.folder)}” · ${r.filled}/31 fields filled</span></div>
    <div class="pidbox"><b>Project ID:</b> ${esc(r.pid)}<br><b>Parent Program:</b> ${esc(r.parent)}</div>
    ${specialNote?`<div class="notecall"><b>Merged folder — ${esc(specialNote[0])}:</b> ${esc(specialNote[1].note)}</div>`:''}
    <div class="fieldcard" id="fcard">
      ${filledRows.map(fieldHTML).join('')}
      <div class="hiddenrows">${emptyRows.map(fieldHTML).join('')}</div>
      ${emptyRows.length?`<div class="togglebar" id="tgl">Show ${emptyRows.length} empty field${emptyRows.length===1?'':'s'}</div>`:''}
    </div>`;
  $('.home', m).addEventListener('click', ()=>{ state.pid = null; render(); });
  if (prev) $('#prevb').addEventListener('click', ()=>{ state.pid = prev.pid; render(); });
  if (next) $('#nextb').addEventListener('click', ()=>{ state.pid = next.pid; render(); });
  const tgl = $('#tgl');
  if (tgl) tgl.addEventListener('click', ()=>{
    const card = $('#fcard'); card.classList.toggle('show-empty');
    tgl.textContent = card.classList.contains('show-empty')
      ? `Hide ${emptyRows.length} empty fields`
      : `Show ${emptyRows.length} empty field${emptyRows.length===1?'':'s'}`;
  });
  m.parentElement.parentElement.scrollTop = 0;
}

function render(){
  renderNav();
  const ab = $('#allrows'); if (ab) ab.classList.toggle('active', !(state.pid && rowByPid[state.pid]));
  if (state.pid && rowByPid[state.pid]) renderRow(rowByPid[state.pid]);
  else renderOverview();
}

$('#side-sub').textContent = `${DATA.workbook} · "${DATA.sheet}" · ${DATA.rows.length} rows · ${DATA.total_cells} sourced cells`;
$('#q').addEventListener('input', e => { state.query = e.target.value; render(); });
$('#allrows').addEventListener('click', ()=>{ state.pid = null; render(); });
render();
</script>
</body>
</html>
