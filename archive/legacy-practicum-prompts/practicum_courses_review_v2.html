pany (NBFC/MFI); Swadhaar FinAccess (SFA) is a non-profit registered as a Section-25 company", "sources": [{"file": "India 2012/Swadhaar - Fall+GSE+Initial+Presentation+2012_FINAL.pptx", "reason": "Slide 3 states FinServe was 'Established 2008: Structured as for-profit non-banking finance company' and slide 4 states FinAccess was 'Established 2005: Structured as non-profit organization registered as a Section-25 company.'"}, {"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.5 notes 'SFA functions as a non-profit while SFPL promotes itself as a for-profit financial institution.'"}]}, {"name": "Sector", "header": "Sector", "value": "Microfinance and financial education / financial inclusion", "sources": [{"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.4 states SFPL 'provides financial services to the economically active urban poor' while SFA 'focuses on credit-plus products and services, including financial education, insurance and savings facilitation.'"}, {"file": "India 2012/Swadhaar Final Presentation 1_8_13.pptx", "reason": "Slide 1 subtitle describes 'the for-profit MFI and the financial education NGO.'"}]}, {"name": "Org Mission", "header": "Org Mission", "value": "\"To make available, responsible and efficient financial services to economically vulnerable and underserved urban households, enabling them to attain financial security and meet their aspirations\"; overall, to deliver sustainable financial stability to the urban poor of Mumbai through credit (SFPL) and credit-plus (SFA) channels.", "sources": [{"file": "India 2012/Swadhaar - Fall+GSE+Initial+Presentation+2012_FINAL.pptx", "reason": "Slide 2 quotes Swadhaar's mission statement and FinAccess's mission 'To assist the urban poor, especially women, to enhance their economic capacity by providing financial education and training, and by facilitating access to savings, insurance and loans.'"}, {"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.4 states 'The overall mission of Swadhaar is to deliver sustainable financial stability to the urban poor of Mumbai, utilizing credit (SFPL) and credit-plus (SFA) channels.'"}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "SFPL (FinServe) provides microfinance loans — joint-liability group loans, top-up loans and individual business loans, all with credit-linked life insurance — to the economically active urban poor, mainly women, via 26 branches. SFA (FinAccess) delivers credit-plus services: the Financial Education Program (FEP), the Compulsory Education Program (CEP) for SFPL clients, insurance and savings facilitation for the working poor in urban slums of Mumbai and Baroda. Originally one MFI (SFA, founded 2005), regulation required a separate credit entity, so credit operations were transferred to the newly registered SFPL in 2008 while SFA retained financial-education services.", "sources": [{"file": "India 2012/Swadhaar - Fall+GSE+Initial+Presentation+2012_FINAL.pptx", "reason": "Slide 6 lists the three loan products (JL, Top-up, IBL) all with credit-linked life insurance, and slide 98-area content notes FinAccess 'Serves the working poor, especially women, living in urban slums (Mumbai and Baroda), mostly clients of FinServe.'"}, {"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.4 explains the history: SFA 'founded in 2005, operated as a microfinance institution'; when savings facilitation required 'a separate credit-plus servicing entity,' Swadhaar 'received company registration for FinServe (SFPL)' in 2008 and 'transferred its credit services from SFA to SFPL'; SFA offers FEP and CEP to SFPL clients."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": "450 combined (FinServe 410 employees; FinAccess 40 employees)", "sources": [{"file": "India 2012/Swadhaar - Fall+GSE+Initial+Presentation+2012_FINAL.pptx", "reason": "Slide 3 lists FinServe with '410 employees' and 26 branches; slide 4 lists FinAccess with '40 employees' and 12 branches."}]}, {"name": "People Served", "header": "How many people do you serve?", "value": "FinServe: 80,201 active clients with a gross loan portfolio of Rs. 786 million (March 2012), across 26 branches in 13 cities of Maharashtra and Gujarat; FinAccess: 27,664 active clients.", "sources": [{"file": "India 2012/Swadhaar - Fall+GSE+Initial+Presentation+2012_FINAL.pptx", "reason": "Slide 3 states 'Active clients: 80,201 clients with a gross loan portfolio of Rs. 786 million' (notes: as of March 2012, 26 branches in 13 cities in Gujarat and Maharashtra); slide 4 states FinAccess 'Active clients: 27,664'; slide 7 shows the client growth table (8,234 in March 2009 to 80,201 in March 2012)."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Preeti Telang", "sources": [{"file": "India 2012/Signed LOA - Swadhaar Team.pdf", "reason": "p.5 (OCR) signature block reads 'Preeti Telang, Chief Executive Officer Swadhaar FinAccess,' and p.1 names her as one of the two Swadhaar parties to the agreement."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": "Chief Executive Officer, Swadhaar FinAccess", "sources": [{"file": "India 2012/Signed LOA - Swadhaar Team.pdf", "reason": "p.5 (OCR) signature block reads 'Preeti Telang, Chief Executive Officer Swadhaar FinAccess.'"}, {"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.6 identifies 'Preeti Telang, SFA Chief Executive Officer.'"}]}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Urmee Mankar", "sources": [{"file": "India 2012/Signed LOA - Swadhaar Team.pdf", "reason": "p.5 (OCR) signature block reads 'Urmee Mankar, Product and Strategy Manager Swadhaar FinServe,' and p.4 states 'Urmee and Preeti will be the main points of contact within Swadhaar.'"}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": "Product and Strategy Manager, Swadhaar FinServe (described as SFPL Strategy General Manager in the final report)", "sources": [{"file": "India 2012/Signed LOA - Swadhaar Team.pdf", "reason": "p.5 (OCR) signature block reads 'Urmee Mankar, Product and Strategy Manager Swadhaar FinServe.'"}, {"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.6 identifies 'Urmee Mankar, SFPL Strategy General Manager.'"}]}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Community Improvement & Capacity Building, Education", "sources": [{"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.4 describes microfinance/financial services for the economically active urban poor — an approximate match mapped to Community Improvement & Capacity Building (economic development/financial inclusion), as no microfinance-specific category exists in the list."}, {"file": "India 2012/Swadhaar - Fall+GSE+Initial+Presentation+2012_FINAL.pptx", "reason": "Slide 2 notes FinAccess 'promotes financial literacy through education and training' — an approximate match for the Education category (adult financial education)."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Urban microfinance (group and individual microloans for women and micro-entrepreneurs); financial literacy education; savings facilitation and micro-insurance; nonprofit/for-profit hybrid collaboration", "sources": [{"file": "India 2012/Swadhaar - Fall+GSE+Initial+Presentation+2012_FINAL.pptx", "reason": "Slide 6 details the JL, Top-up and Individual Business Loan products with credit-linked life insurance targeting economically active women and micro-entrepreneurs."}, {"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.4 lists SFA's credit-plus services of 'financial education, insurance and savings facilitation,' and p.5 discusses the structural challenges of the non-profit/for-profit split."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "middle stage", "sources": [{"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.4 dates SFA to 2005 and SFPL to 2008, and p.5 states 'This past fiscal year marked SFPL's first period of profitability, while SFA remains 90% reliant on grants' — a sizeable but not yet financially mature organization."}, {"file": "India 2012/Swadhaar - Fall+GSE+Initial+Presentation+2012_FINAL.pptx", "reason": "Slides 3-4 show substantial but still-growing scale: 450 combined employees, 80,201 active borrowers, 26 branches."}]}, {"name": "Project City", "header": "Project City", "value": "Mumbai", "sources": [{"file": "India 2012/Swadhaar - Fall+GSE+Initial+Presentation+2012_FINAL.pptx", "reason": "Slides 3-4 state both FinServe and FinAccess are 'Headquartered in Mumbai.'"}, {"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.3 notes 'One week of field visits in Mumbai' and p.4 defines the mission around 'the urban poor of Mumbai.'"}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Maharashtra", "sources": [{"file": "India 2012/Swadhaar - Fall+GSE+Initial+Presentation+2012_FINAL.pptx", "reason": "Slide 3 speaker notes place the 26 branches 'in 13 cities in Gujarat and Maharashtra provinces,' with headquarters in Mumbai, Maharashtra."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2012/Swadhaar Final Presentation 1_8_13.pptx", "reason": "Slide 2 frames the context: 'In INDIA, There are 30 MILLION microfinance borrowers... 65% lack financial literacy.'"}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale team investigated how collaboration could be strengthened between Swadhaar FinServe (for-profit MFI) and Swadhaar FinAccess (financial-education nonprofit). They conducted a current-state assessment (450 multi-level surveys with a 24% response rate, 14-15 staff interviews) and best-practices research on 18 organizations across marketing, operations, incentives, collaborative projects, earned-income models and partnerships, plus a week of field visits in Mumbai. Their main recommendation was a human capital strategy centered on coordinated onboarding/continuous training and organizational alignment through a joint theory of change, communication plan and working groups, supplemented by 'quick wins' and 'wish list' ideas with an implementation plan and metrics.", "sources": [{"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.3 Executive Summary details the surveys (450 disseminated, 24% response), 14 interviews, 18 organizations researched, the Mumbai field week, and the human capital strategy recommendation focused on 'coordination of onboarding and continuous training initiatives, and organizational alignment through a joint theory of change, communication plan, and working groups.'"}, {"file": "India 2012/Signed LOA - Swadhaar Team.pdf", "reason": "pp.1-3 (OCR) define the scope: best practices of nonprofit/for-profit collaboration, analysis of current products/organization structure and challenges, and 'new recommendations on collaborative initiatives.'"}, {"file": "India 2012/Swadhaar Best Practice and Current State Findings Final_1.7.13.pptx", "reason": "Slide 2 documents the current-state methodology (4 multi-level surveys of 110 respondents, 15 interviews, weekly calls and a 1-week retreat with the FinAccess CEO and FinServe Product and Strategy GM)."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Organizational Systems and Behavior, Business Strategy/Revenue, Marketing", "sources": [{"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.3 states 'Our main recommendation is a human capital strategy' targeting organizational structure, culture, training coordination and organizational alignment — squarely an Organizational Systems and Behavior project (the best-practices research touched marketing and earned-income models, but the deliverable was organizational)."}, {"file": "India 2013/Swadhaar Final Report.docx", "reason": "'Organizational Systems and Behavior' (primary): the Recommendation section proposes a human capital strategy of training coordination (onboarding, cross-training, buddy system) and organizational alignment (joint theory of change, communication plan, working groups) to change organizational structure and culture."}, {"file": "India 2013/Swadhaar Final Report.docx", "reason": "'Business Strategy/Revenue' (secondary workstream): the Earned Income Business Models section researches revenue models for SFA sustainability and recommends Swadhaar continue exploring 'standardizing its training materials and selling it to other non-profits' modeled on the Salesforce.com Foundation."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Treated as ONE client organization per the LOA and course listing, though it comprises two legal entities with separate boards: Swadhaar FinAccess (SFA, nonprofit Section-25 company, founded 2005 as the original MFI; now financial education, insurance, savings facilitation; 90% grant-reliant) and Swadhaar FinServe (SFPL, for-profit NBFC registered 2008 when regulation required a separate credit entity; first-ever profitable fiscal year at time of engagement). 'Signed LOA - Swadhaar Team.pdf' is a scanned PDF with no extractable text layer; its content here was recovered via OCR (tesseract). The four PDFs 'Swadhaar Management,' 'Swadhaar FinServe - Branch Managers,' 'Swadhaar FinServe - Loan Officer,' and 'Swadhaar FinAccess - FEP Trainers and Mobilizers' are Qualtrics survey-result exports (Nov 2012) from the team's current-state assessment; staff emails appearing in them (e.g., abhaumik@swadhaar.com, rsen@swadhaar.com) are survey respondents, not the engagement's primary contacts. DUPLICATE-FOLDER FINDING: this 'India 2013' folder contains no distinct 2013 engagement. Six of its seven files (both pptx decks and all four survey PDFs) are byte-identical (matching MD5 checksums) to files of the same names in the sibling 'India 2012' folder; the seventh, Swadhaar Final Report.docx, is the Word version of the same January 2013 final report (created/modified 2013-01-21 per its core properties, same 'Increasing Collaboration Between FinServe & FinAccess' title and author Aruna Bhamidipati) that appears as 'Swadhaar Final Report.pdf' in India 2012. The docx contains no date later than the January-June 2013 implementation timeline and January 21, 2013 file date — nothing indicating a Fall 2013 engagement. All content documents the Fall 2012 GSE engagement (scoped September 2012, surveys November 2012, deliverables January 2013). Additional notes: the primary client contacts (Preeti Telang, Urmee Mankar) have no emails/phones stated; the only Swadhaar emails in the folder are survey-respondent emails in the Management and Branch Manager survey PDFs (e.g., AAGRAWAL@SWADHAAR.COM listed for CFO Abhishek Agrawal); no org website or Swadhaar client-count figures appear in any of the seven files, so org_website, people_served, and project_success are null. The separate 'India 2013' source folder contains no distinct 2013 engagement: six of its seven files are byte-identical (MD5) copies of this Fall 2012 Swadhaar engagement's files in the 'India 2012' folder, and the seventh is the .docx version of the same January 2013 final report; it is therefore merged into this row rather than listed as a separate 2013-14 project.", "sources": [{"file": "India 2012/Swadhaar Final Report.pdf", "reason": "p.4-5 describe the two-entity history and structure and note 'SFA and SFPL operate as two separate legal entities and thus have independent organizational structures and boards.'"}, {"file": "India 2012/Signed LOA - Swadhaar Team.pdf", "reason": "pdftotext returns no text (scanned document); OCR of p.1 shows the agreement covers both entities as one client ('AND SWADHAAR FINSERVE & FINACCESS')."}, {"file": "India 2012/Swadhaar Management.pdf", "reason": "p.1 shows a survey-results export ('Last Modified: 11/25/2012' with gender/tenure response tables), and p.14 lists respondent names/emails such as 'Atanu Bhaumik; abhaumik@swadhaar.com' — identifying these PDFs as the current-state assessment surveys."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15 - BASIX Krishi Samruddhi Ltd.", "org": "BASIX Krishi Samruddhi Ltd.", "folder": "India 2014", "sheet_row": 32, "parent": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15", "filled": 24, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15 - BASIX Krishi Samruddhi Ltd.", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement belongs to the Fall 2014 Global Social Entrepreneurship course at Yale SOM (project work October/November 2014 through February 2015), with letters of engagement finalized December 3-10, 2014, an India field trip January 1-9, 2015 culminating in a January 9, 2015 all-teams conference in Bangalore, and final reports delivered February 26-28, 2015. [India 2014/Letter of Engagement 120914.pdf] The BASIX Krishi Letter of Engagement is dated December 9, 2014 and its timeline (p.8) runs from 'October: Preliminary research' through 'January 2-8: In-country work', 'January 9: Presentation at GSE conference', and 'February 28: Final presentations and final reports due (Yale)'."}, {"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The report states (p.2) 'In the Fall of 2014, the GSE team conducted market research... During January of 2015, the Yale GSE team traveled to India', and the title page is dated February 2015."}, {"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The title page (p.1) is dated February 26, 2015, evidencing final deliverables in late February 2015."}]}, {"name": "Parent Program", "header": "Parent Program*", "value": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement belongs to the Fall 2014 Global Social Entrepreneurship course at Yale SOM (project work October/November 2014 through February 2015), with letters of engagement finalized December 3-10, 2014, an India field trip January 1-9, 2015 culminating in a January 9, 2015 all-teams conference in Bangalore, and final reports delivered February 26-28, 2015. [India 2014/Letter of Engagement 120914.pdf] The BASIX Krishi Letter of Engagement is dated December 9, 2014 and its timeline (p.8) runs from 'October: Preliminary research' through 'January 2-8: In-country work', 'January 9: Presentation at GSE conference', and 'February 28: Final presentations and final reports due (Yale)'."}, {"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The report states (p.2) 'In the Fall of 2014, the GSE team conducted market research... During January of 2015, the Yale GSE team traveled to India', and the title page is dated February 2015."}, {"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The title page (p.1) is dated February 26, 2015, evidencing final deliverables in late February 2015."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "BASIX Krishi Samruddhi Ltd.", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The letter is titled 'Yale Global Social Entrepreneurship Team & BASIX Krishi' and names the client 'BASIX Krishi' throughout (p.1)."}, {"file": "India 2014/BASIXKrishi_India_Presentation.pdf", "reason": "A slide (p.8) gives the full legal name 'BASIX Krishi Samruddhi Limited'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "For-profit social enterprise (a subsidiary company of the BASIX group; legal name 'BASIX Krishi Samruddhi Limited')", "sources": [{"file": "India 2014/Yale-GSE_Final_Report_for_BASIX-Krishi_27February2015.pdf", "reason": "The executive summary (p.4) calls BASIX Krishi 'an agricultural social enterprise in India' and a 'subsidiary of the BASIX group'."}, {"file": "India 2014/GSE_SI Lab_Krishi Draft_TS.pptx", "reason": "Slide 8 speaker notes state 'Social enterprise - impact first, but financial sustainability is important', and slide 6 says 'Social Enterprises combine impact and profit motives'."}, {"file": "India 2014/BASIXKrishi_India_Presentation.pdf", "reason": "The slide on p.8 shows the corporate form 'BASIX Krishi Samruddhi Limited'."}]}, {"name": "Sector", "header": "Sector", "value": "Agricultural, livestock and agro-enterprise development services (AGLED) for smallholder farmers", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The Project Background (p.1) states Krishi 'is focused on Agricultural, Livestock and Enterprise Development Services (AGLEDS)'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "To be a best-of-class organization providing Agricultural, Livestock and Agro Enterprise Development (AGLED) Services with sustained innovation, reaching and creating value for one million farmers by 2020; it promotes the livelihoods of small and marginal producers through low-cost inputs (credit, raw materials, skills) and advisory services.", "sources": [{"file": "India 2014/GSE_SI Lab_Krishi Draft_TS.pptx", "reason": "Slide 8 quotes the mission verbatim: 'To be a best of class organization providing Agricultural, Livestock and Agro Enterprise Development (AGLED) Services with sustained innovation, reaching and creating value for one million farmers by 2020.'"}, {"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The background (p.1) states 'Krishi's mission is to promote the livelihoods of a large number of small and marginal producers through the provision of low-cost inputs (including credit, raw materials, skills) and advisory services.'"}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "Krishi offers farmers four primary service lines: agri-input supply (seed, fertilizer, pesticides), output market linkages (logistics, storage, quality control), financial services (insurance, planned credit facilitation), and extension/advisory services (training, demonstrations). It runs pilot programs on Farmer Producer Organization (FPO) and Common Service Center (CSC) models in four Indian states.", "sources": [{"file": "India 2014/BASIXKrishi_India_Presentation.pdf", "reason": "The 'Krishi: Impacting Livelihoods' slide (around p.9) diagrams the four services: Agri-Input Services, Output Market Linkages, Financial Services, and Extension Services."}, {"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The background (p.1) states Krishi 'initiated pilot programs on the Farmer Producer Organization (FPO) and Common Service Centers (CSC) models in four Indian states' and 'plans to offer farmers an array of services, including Credit... Input... Output... and Extension Services'."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": 123, "sources": [{"file": "India 2014/BASIXKrishi_India_Presentation.pdf", "reason": "The organization overview slide (p.8) lists '123 Staff' alongside 'Founded in 2010' and '7 States'."}]}, {"name": "People Served", "header": "How many people do you serve?", "value": "Current customer reach not stated; the stated goal is to reach and create value for one million farmers/customers by 2020, operating across 7 Indian states.", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The background (p.1) states Krishi 'has a goal of becoming a globally renowned organization with sustained innovation that will create value for one million customers by 2020'."}, {"file": "India 2014/BASIXKrishi_India_Presentation.pdf", "reason": "The overview slide (p.8) states the mission of 'reaching and creating value for one million farmers by 2020' and lists operations in '7 States'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Aditi Gupta", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "Section V Communications (p.7-8) states 'Aditi Gupta is the point of contact for BASIX Krishi'."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": "aditi.gupta@connect-india.co.in", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The communications contact table (p.8) lists Aditi with e-mail 'aditi.gupta@connect-india.co.in' under organization 'BASIX Krishi'."}]}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Mihir Sahana", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The letter names 'BASIX Krishi Partners (\"Krishi\"): Mihir Sahana, Tapas Pati, and Aditi Gupta' (p.1) and lists Mihir in the contact table (p.8)."}, {"file": "India 2014/Yale-GSE_Final_Report_for_BASIX-Krishi_27February2015.pdf", "reason": "The acknowledgements (p.2) thank 'Krishi's dedicated staff, especially Mihir Sahana'."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": "mihir@basixindia.com", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The contact table (p.8) lists Mihir's e-mail as 'mihir@basixindia.com'."}]}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": "+91", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The contact table (p.8) lists Mihir's mobile number as '+91 8584060605'."}]}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": "8584060605", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The contact table (p.8) lists Mihir's mobile number as '+91 8584060605'."}]}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Food Agriculture & Nutrition, Community Improvement & Capacity Building", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "Krishi delivers agricultural input, output, credit and extension services to farmers (p.1), which maps directly to 'Food Agriculture & Nutrition'."}, {"file": "India 2014/Yale-GSE_Final_Report_for_BASIX-Krishi_27February2015.pdf", "reason": "The report frames Krishi's work as improving farmer livelihoods and local economic capacity (p.4), an approximate match to 'Community Improvement & Capacity Building'."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Smallholder farmer livelihoods; agricultural extension and advisory services; agri-input supply chains; output market linkages; rural credit and insurance facilitation", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The background (p.1) describes advisory services on 'improved and sustainable production practices, risk mitigation, and market linkages' plus credit, input and output services."}, {"file": "India 2014/BASIXKrishi_India_Presentation.pdf", "reason": "The services slide (around p.9) details agri-input, output market linkage, financial, and extension service lines."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "middle stage", "sources": [{"file": "India 2014/BASIXKrishi_India_Presentation.pdf", "reason": "The overview slide (p.8) shows the organization was founded in 2010 and had grown to 123 staff across 7 states by the 2014 engagement, i.e., roughly four years old with substantial but still-scaling operations."}, {"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The background (p.1) notes Krishi 'has recently undergone a business strategy reengineering process' and is still piloting its FPO and CSC models before scaling, indicating it is past startup but not yet established."}]}, {"name": "Project City", "header": "Project City", "value": "Kolkata", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The Stage II schedule (p.4) shows the team working 'with Krishi in Kolkata area' with site visits outside Kolkata during January 2-7, 2015."}, {"file": "India 2014/Preliminary Itinerary BASIX Krishi team 121014 hand in.xlsx", "reason": "The Overview sheet shows 'Krishi office visit in Kolkata' with field trips to Dinajpur, Birbhum and Deoghar."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "West Bengal", "sources": [{"file": "India 2014/Yale-GSE_Final_Report_for_BASIX-Krishi_27February2015.pdf", "reason": "The executive summary (p.4) states the teams 'conducted field research into livelihood impact, market demand, and Krishi's internal capabilities across the states of Jharkhand and West Bengal'."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The background (p.1) describes BASIX group as promoting 'the livelihoods of poor households in India', and all field work took place in India."}]}, {"name": "Project Description", "header": "Project Description", "value": "A five-student Yale GSE team was engaged to recommend how Krishi should deliver and price its farmer services. Stage I benchmarked best practices of comparable agricultural social enterprises; Stage II was field research in West Bengal and Jharkhand (Jan 2-8, 2015) into livelihood impact, market demand, and Krishi's capabilities; Stage III produced final recommendations. The February 27, 2015 final report recommends Krishi 'Focus' its business model on a product-oriented, end-to-end value chain approach, 'Validate' market entry through pilots, and 'Scale', and it delivered an accompanying Excel Pilot Program Outcomes Tracker tool with quantitative success benchmarks.", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The Scope of Work (p.1-2) defines the three-stage engagement (best practices analysis, field work Jan 2-7 2015, operational plans and success metrics)."}, {"file": "India 2014/Yale-GSE_Final_Report_for_BASIX-Krishi_27February2015.pdf", "reason": "The executive summary (p.4) describes the focused product-oriented, end-to-end-value-chain recommendation and 'An Excel tool accompanies the report'; the table of contents (p.3) lists 'Recommendation I: Focus', 'Recommendation II: Validate', 'Recommendation III: Scale'."}, {"file": "India 2014/Appendix_V_Plan_Pilot_Evaluate SAMPLE.xlsx", "reason": "The 'Prepare (Data Entry)' sheet is headed 'BASIX Krishi Pilot Program Outcomes Tracker', showing the delivered Excel tool."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Business Strategy/Revenue, Impact Assessment, Scaling", "sources": [{"file": "India 2014/Yale-GSE_Final_Report_for_BASIX-Krishi_27February2015.pdf", "reason": "The report's core deliverable is a business model refocusing strategy ('Focus, Validate, Scale', p.3 and p.14+), supporting 'Business Strategy/Revenue' and 'Scaling'."}, {"file": "India 2014/Appendix_V_Plan_Pilot_Evaluate SAMPLE.xlsx", "reason": "The Pilot Program Outcomes Tracker measures predicted vs. actual impact factors such as 'Average increase in farmer income during pilot (in rupees)', supporting the 'Impact Assessment' tag."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Shared/ambiguous files attributed to this org: 'Letter of Engagement 120914.pdf' (its header reads 'Yale GSE Team & BASIX Krishi'), 'GSE_SI Lab_Krishi Draft_TS.pptx' (slide 8 introduces BASIX Krishi), and both 'Appendix_V_Plan_Pilot_Evaluate BLANK/SAMPLE.xlsx' (sheets headed 'BASIX Krishi Pilot Program Outcomes Tracker', matching Appendix V of the final report). The Gantt chart workbook contains a leftover sample sheet from a prior-year 'Room to Read' GSE project. The LOE contact table also lists Tapas Pati (tapaspati@basixindia.com, +91 9437394999) as a third org contact and an IIM Bangalore student (Vikram Kadam) on the team.", "sources": [{"file": "India 2014/Letter of Engagement 120914.pdf", "reason": "The document names BASIX Krishi as the client on p.1 and lists Tapas Pati's email and phone in the contact table (p.8)."}, {"file": "India 2014/Appendix_V_Plan_Pilot_Evaluate BLANK.xlsx", "reason": "The 'Prepare (Data Entry)' sheet is titled 'BASIX Krishi Pilot Program Outcomes Tracker' and marked 'BASIX Krishi CONFIDENTIAL'."}, {"file": "India 2014/BASIX Krishi - Yale Project Gantt Chart_V1.xlsx", "reason": "The workbook's 'Orignal Sample' sheet is headed 'Room to Read Gantt Chart (Nov 2014 - Feb 2015)', a template from another project."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15 - Britti Prosikshan", "org": "Britti Prosikshan", "folder": "India 2014", "sheet_row": 33, "parent": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15", "filled": 20, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15 - Britti Prosikshan", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement belongs to the Fall 2014 Global Social Entrepreneurship course at Yale SOM (project work October/November 2014 through February 2015), with letters of engagement finalized December 3-10, 2014, an India field trip January 1-9, 2015 culminating in a January 9, Final.pdf", "reason": "The report states (p.2) 'In the Fall of 2014, the GSE team conducted market research... During January of 2015, the Yale GSE team traveled to India', and the title page is dated February 2015."}, {"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The title page (p.1) is dated February 26, 2015, evidencing final deliverables in late February 2015."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "Britti Prosikshan", "sources": [{"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The background (p.1) names the client 'Britti Prosikshan, a Technable group company'."}, {"file": "India 2014/Britti Final Report.pdf", "reason": "The background (p.4) uses 'Britti Prosikshan (Britti)' as the organization name."}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "For-profit social enterprise (a Technable group company)", "sources": [{"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The background (p.1) states Britti 'is a for-profit social enterprise that aims to reduce unemployment in India'."}, {"file": "India 2014/Britti Final Report.pdf", "reason": "The executive summary (p.4) repeats that Britti is 'a for-profit social enterprise... a Technable group company'."}]}, {"name": "Sector", "header": "Sector", "value": "Vocational skill development and youth employment (franchise training centers)", "sources": [{"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The background (p.1) describes Britti 'providing underprivileged youth with skill development and employment linkage' via a franchisee model of training centers."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "\"Enabling People, Empowering Business, Enriching Society\" - Britti aims to reduce unemployment in India by providing underprivileged youth with skill development and employment linkage.", "sources": [{"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The background (p.1) opens with the quoted mission '\"Enabling People, Empowering Business, Enriching Society.\" - Mission, Britti Prosikshan' and states its aim to reduce unemployment through skill development and employment linkage."}, {"file": "India 2014/Britti Final Report.pdf", "reason": "The background (p.4) states \"Britti's mission is to 'enable people, empower business, enrich society.'\""}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "As one of ~500 training partners of the National Skill Development Corporation (NSDC), Britti operates a franchise model in which local training partners (LTPs), overseen by regional training partners (RTPs), open and run centers that recruit youth, deliver vocational training, and provide job placement support; most students are funded by the government STAR scheme.", "sources": [{"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The background (p.1) describes 'a franchisee model in which local entrepreneurs open and operate centers where they recruit youth, deliver training, and provide placement support' in partnership with NSDC."}, {"file": "India 2014/Britti Final Report.pdf", "reason": "The executive summary (p.4) explains the LTP/RTP franchise structure and that with the government STAR program 'approximately 100% of students are government subsidized'."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": "37,120 students trained to date across 350 centers in 10 states (as of January 2015); the LOE states more than 30,000 youth trained and placed into jobs, with a mandate to train and place 100,000 youth in ten years.", "sources": [{"file": "India 2014/Britti Bangalore Presentation 01092015 vFinal.pptx", "reason": "Slide 9 lists current status: '350 centers, 10 states, 37,120 students trained to date'."}, {"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The background (p.1) states Britti 'has trained and placed more than 30,000 youth into jobs' with 'a goal of increasing the number of youth trained and placed to 100,000 in 10 years'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Santanu (Sunny) Bhattacharjee", "sources": [{"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The Ongoing Communications section (p.5) states 'Liz Bullock and Sunny Bhattacharjee will each serve as the primary point of contact for their respective teams', and he appears first in the Britti signature block (p.5)."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": "Founder (referred to as CEO in the toolkit)", "sources": [{"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The background (p.1) states Britti was 'founded by Santanu (Sunny) Bhattacharjee in 2010'."}, {"file": "India 2014/Britti Bangalore Presentation 01092015 vFinal.pptx", "reason": "Slide 6 speaker notes read 'Pictured is founder Sunny Bhattacharjee'."}, {"file": "India 2014/Britti Final Marketing Toolkit.pdf", "reason": "The introduction (p.3) says 'we shared it with the Britti CEO' as the team's counterpart."}]}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Sony Singh", "sources": [{"file": "India 2014/Britti Final Report.pdf", "reason": "The team section (p.11) states the team 'partnered most closely with two of the organization's key leaders' and names 'SANTANU (SUNNY) BHATTACHARJEE' and 'SONY SINGH'."}, {"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The signature block (p.5) includes 'Sony (Britti)'."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Employment, Youth Development", "sources": [{"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "Britti's core work is reducing unemployment via 'skill development and employment linkage' (p.1), matching 'Employment'."}, {"file": "India 2014/Britti Final Report.pdf", "reason": "The beneficiaries are 'underprivileged youth' facing youth unemployment (p.4 and the Background section p.12), so 'Youth Development' is an approximate secondary match."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Youth unemployment; vocational/skills training; job placement; franchise-based training center operations; government skill development schemes (NSDC, STAR)", "sources": [{"file": "India 2014/Britti Final Report.pdf", "reason": "The Background section (p.12) covers 'Youth Unemployment In India' and 'Government Skill Development Initiatives', and the executive summary (p.4) covers the NSDC mandate and STAR subsidy scheme."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "middle stage", "sources": [{"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "Britti was founded in 2010 (p.1), making it about four years old at engagement."}, {"file": "India 2014/Britti Final Report.pdf", "reason": "The executive summary (p.4) notes Britti 'has expanded at an impressive rate over the last four years' from 40 to 350+ centers but still faces profitability, cash-flow, and government-dependence challenges, indicating rapid growth beyond startup but not yet established stability."}]}, {"name": "Project City", "header": "Project City", "value": "Kolkata", "sources": [{"file": "India 2014/Britti Itinerary.xlsx", "reason": "The Itinerary sheet for Jan 1-7, 2015 begins 'Arrive in Kolkata, check-in to hotel' with visits to Britti's central office and urban/suburban/rural centers before 'Travel to Bangalore'."}, {"file": "India 2014/Presentation Britti FV.pdf", "reason": "The image-based slides (OCR of p.2) show a Britti address on 'Jessore Road' (a Kolkata address) in the org's materials."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "West Bengal", "sources": [{"file": "India 2014/Britti Itinerary.xlsx", "reason": "The field visit was based in Kolkata (West Bengal) per the January 2015 itinerary sheet."}, {"file": "India 2014/Britti Bangalore Presentation 01092015 vFinal.pptx", "reason": "Slide 9's state map lists 'W. Bengal: 43' among Britti's largest center concentrations."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The background (p.1) describes Britti's work reducing unemployment 'in India' with 350 franchisees across the country."}]}, {"name": "Project Description", "header": "Project Description", "value": "A four-student Yale GSE team built two deliverables for Britti: (1) an Excel financial model that local and regional training partners can use to project and monitor revenues, costs, profit/breakeven, and 5-year cash flows under high/medium/low cost scenarios with sensitivity analysis, and (2) a marketing toolkit to help franchisees attract more government-sponsored students and develop self-paid revenue streams. The team visited Kolkata-area urban, suburban and rural centers in January 2015 and delivered final recommendations covering cost benchmarks, breakeven analysis, cash flow forecasting, competitive positioning, branding/messaging, and mobilisation channels.", "sources": [{"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The Objectives section (p.1) commits to a 'Financial Model' and a 'Marketing Best Practices Guide' plus final report and presentation (Key Deliverables table, p.4)."}, {"file": "India 2014/Britti Final Report.pdf", "reason": "The Project Objectives & Deliverables section (p.5) lists the financial model and marketing toolkit deliverables, and the table of contents shows recommendation sections on cost benchmarks, profit & breakeven, cash flow forecast, branding & messaging, and mobilisation channels."}, {"file": "India 2014/Britti Final Financial Model.xlsx", "reason": "The Menu sheet is titled 'Britti LPT Financial Model' with sheets for Revenue Projection, Expense, Profit and Breakeven, three Cash Flow scenarios, Variance and Sensitivity Analysis."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Marketing, Business Strategy/Revenue", "sources": [{"file": "India 2014/Britti Final Financial Model.xlsx", "reason": "The delivered Excel workbook (Revenue Projection, Cash Flow, Sensitivity Analysis sheets) evidences 'Financial Modeling'."}, {"file": "India 2014/Britti Final Marketing Toolkit.pdf", "reason": "The delivered marketing toolkit (competitive analysis, branding, mobilisation channels) evidences 'Marketing'."}, {"file": "India 2014/Britti Final Report.pdf", "reason": "Objective 2 (p.5), 'Build a possible roadmap for how Britti could reduce its reliance on the government and capture more self-paid revenue', evidences 'Business Strategy/Revenue'."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "'Presentation Britti FV.pdf' is an image-based (scanned) PDF with almost no extractable text; OCR of its early pages shows Britti Prosikshan context slides (youth unemployment charts, 'Seekho Aur Kamao' scheme), confirming it is the Britti team's final presentation. The Britti LOE defines an ex-ante success metric: a financial model adopted by at least ten entrepreneurs within three months of rollout with 60% satisfaction, but no document reports actual adoption. The LOE signature block also lists a third Britti staffer, 'Tiasha'.", "sources": [{"file": "India 2014/Presentation Britti FV.pdf", "reason": "pdftotext extraction yields only page numbers (~306 bytes), and OCR of p.2-3 shows 'Britti Prosikshan' context content including youth unemployment rate charts."}, {"file": "India 2014/Britti Letter of Engagement v8a.pdf", "reason": "The Metrics to Track Success section (p.4-5) defines the ten-entrepreneur adoption target, and the signature block (p.5) lists 'Tiasha (Britti)'."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15 - TARAoorja", "org": "TARAoorja", "folder": "India 2014", "sheet_row": 34, "parent": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15", "filled": 19, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15 - TARAoorja", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engageme 4 and its timeline (p.8) runs from 'October: Preliminary research' through 'January 2-8: In-country work', 'January 9: Presentation at GSE conference', and 'February 28: Final presentations and final reports due (Yale)'."}, {"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The report states (p.2) 'In the Fall of 2014, the GSE team conducted market research... During January of 2015, the Yale GSE team traveled to India', and the title page is dated February 2015."}, {"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The title page (p.1) is dated February 26, 2015, evidencing final deliverables in late February 2015."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "TARAoorja", "sources": [{"file": "India 2014/DraftLetterofAgreementTARAoojaGSE_12-10-2014_clean.docx", "reason": "The letter is titled 'LETTER OF ENGAGEMENT BETWEEN GSE STUDENT TEAM & TARAOORJA'."}, {"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The title page (p.1) reads 'TARAoorja: Achieving a Sustainable Business Model'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "For-profit social enterprise start-up (a business affiliate incubated by TARA, the not-for-profit incubation arm of the Development Alternatives Group)", "sources": [{"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "Section 2.1 (p.5) states 'TARAoorja is a start-up part of the Society for Technology & Action for Rural Advancement (TARA), the incubation engine of the Development Alternatives Group' and calls it 'the latest social enterprise being tested'."}, {"file": "India 2014/IIMB - TARAoorja Presentation - 07-Jan-15 v3.pdf", "reason": "The Group Structure slide (p.4-5) places TARAoorja under the '\"Pvt. Ltd.\" Business Affiliates' implementation arm of the Development Alternatives Group."}]}, {"name": "Sector", "header": "Sector", "value": "Solar energy - rural electricity distribution via micro-grids", "sources": [{"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The executive summary (p.3) states 'TARAoorja seeks to bring reliable electricity to rural India using solar-powered photovoltaic micro-grids'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "To provide utility-grade electricity through micro-grids to rural customers across India currently without access - 'Ensure last mile reliable electricity to village households, shops, small enterprises and farmers.'", "sources": [{"file": "India 2014/DraftLetterofAgreementTARAoojaGSE_12-10-2014_clean.docx", "reason": "The Project Background states 'TARAoorja's mission is to provide utility grade electricity through micro-grids to rural customers across India currently without access.'"}, {"file": "India 2014/Final Presentation TARA Class v3.0.pptx", "reason": "Slide 4 quotes TARAoorja's mission: 'Ensure last mile reliable electricity to village households, shops, small enterprises and farmers'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "TARAoorja sets up and operates rural solar micro-grids as a pure electricity distributor: it buys power under Power Purchase Agreements from renewable-energy generating companies that own the plants, then manages local demand, load development, distribution infrastructure and revenue collection for village households, shops, entrepreneurs and farmers.", "sources": [{"file": "India 2014/DraftLetterofAgreementTARAoojaGSE_12-10-2014_clean.docx", "reason": "The background describes TARAoorja as 'an electricity distribution company that sets up and runs micro-grids in rural areas' buying power via PPAs from Renewable Energy Services Companies."}, {"file": "India 2014/IIMB - TARAoorja Presentation - 07-Jan-15 v3.pdf", "reason": "Slide content (p.2 onward) describes TARAoorja handling 'Demand Side Management, Load Development, Revenue Collection' after securing a power provider."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": "Early-stage reach: at the January 2015 field visit only the Fakirtoli micro-grid (Bihar) was up and running, with several more launched in the following weeks; the company's stated goal was 300 micro-grids by 2015 in a market of 409 million Indians without electricity access.", "sources": [{"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The conclusion (p.35) states 'When we visited India in the first week in January, only the Fakirtoli grid was up and running. Several others have been launched in the intervening weeks and dozens more are queued up'."}, {"file": "India 2014/DraftLetterofAgreementTARAoojaGSE_12-10-2014_clean.docx", "reason": "The background states 'TARAoorja hopes to meet its goal of building 300 micro-grids by 2015' and cites 'An estimated 409 million people in India... without access to electricity'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Arjun Dhawan", "sources": [{"file": "India 2014/DraftLetterofAgreementTARAoojaGSE_12-10-2014_clean.docx", "reason": "The Communications section states 'Main points of contact: ... TARAoorja: Arjun Dhawan'."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Shrashtant Patara (Pat)", "sources": [{"file": "India 2014/DraftLetterofAgreementTARAoojaGSE_12-10-2014_clean.docx", "reason": "The letter names 'SE Partner TARAoorja: Shrashtant Patara, Sharad Tiwari, Arjun Dhawan'."}, {"file": "India 2014/IIMB - TARAoorja Presentation - 07-Jan-15 v3.pdf", "reason": "The title page (p.1) lists 'TARA Team: Shrashtant Patara (Pat), Sharad Tiwari, Arjun Dhawan'."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Community Improvement & Capacity Building, Environmental Quality Protection & Beautification", "sources": [{"file": "India 2014/DraftLetterofAgreementTARAoojaGSE_12-10-2014_clean.docx", "reason": "The background frames electrification as 'critical for India's continued development... improving people's lives and livelihoods' and the metrics track new businesses started and increased business income - an approximate match to 'Community Improvement & Capacity Building' since the list has no energy/utilities category."}, {"file": "India 2014/DraftLetterofAgreementTARAoojaGSE_12-10-2014_clean.docx", "reason": "The social impact metrics include 'Reduction of carbon emissions due to renewable energy', an approximate match to 'Environmental Quality Protection & Beautification'."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Rural electrification; solar photovoltaic micro-grids; energy access for bottom-of-pyramid households and rural businesses; renewable energy and carbon reduction", "sources": [{"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The executive summary (p.3) covers solar micro-grid electrification of rural India, and the LOA metrics cover renewable-energy carbon reduction and first-time electricity access."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "early stage", "sources": [{"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "Section 2.1 (p.5) explicitly calls TARAoorja 'a start-up' and 'the latest social enterprise being tested' by TARA, and the conclusion (p.35) notes only one grid (Fakirtoli) was operational at the January 2015 visit."}]}, {"name": "Project City", "header": "Project City", "value": "Fakirtoli", "sources": [{"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "Section 3.2 'Field Work - Fakirtoli' (p.7-9) describes the team's on-site customer interviews and survey at the Fakirtoli micro-grid site."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Bihar", "sources": [{"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The interviews section (p.9) describes partner BlueEarth Energy 'operating in the province of Bihar where TARAoorja currently has its micro-grids'."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2014/DraftLetterofAgreementTARAoojaGSE_12-10-2014_clean.docx", "reason": "The mission is to serve 'rural customers across India currently without access' to electricity."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale GSE team (with an IIM Bangalore member) investigated whether TARAoorja can distribute rural electricity in a financially sustainable way, working in three phases: market research on comparable micro-grid business models, analysis of TARAoorja's cost structure, and analysis of its revenue structure. Deliverables included an Excel cost model comparing buy vs. lease vs. pay-per-kWh structures, a pricing model, an 11-question customer survey fielded to 60 respondents, and a final report/presentation. Key recommendations: offer more flexible service packages, focus on the higher-need business customer segment, and purchase power through a leasing structure rather than the current PPA.", "sources": [{"file": "India 2014/DraftLetterofAgreementTARAoojaGSE_12-10-2014_clean.docx", "reason": "The Scope of Work defines the overarching question ('can TARAoorja provide electricity to rural Indian villages in a financially sustainable manner?') and the three phases with cost-model, survey and revenue-model deliverables."}, {"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The executive summary (p.3) lists the three recommendations: flexible packages, focusing on the business segment, and purchasing power through a leasing structure."}, {"file": "India 2014/TARAoorja Cost Model - 18-Feb-15.xlsx", "reason": "The workbook contains '1. Buy', '2. Lease', 'Lease vs Buy vs kWh' and 'Fakirtoli Revenue' sheets - the delivered cost model."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue", "sources": [{"file": "India 2014/TARAoorja Cost Model - 18-Feb-15.xlsx", "reason": "The delivered lease-vs-buy cost model and [India 2014/TARAoorja Pricing Model_MG.xlsx] pricing workbook evidence 'Financial Modeling'."}, {"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The recommendations on customer segment focus, service package design and power purchase structure (p.3, sections 6.1-6.2) evidence 'Business Strategy/Revenue'."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "The shared file 'Field Survey Results_FULL_CLEAN.xlsx' belongs to this org: its sheets (Conjoint Analysis Responses, Package Comparisons, Connection Fee vs. Monthly fee, Businesses/Homes Monthly Diesel Spend) match the Fakirtoli-area electricity survey documented in section 9.3 of the TARAoorja final report. The LOA in the folder is a draft dated 12-10-2014 (not signed). TARAoorja participates in the Rockefeller Foundation-backed SPEED (Smart Power for Environmentally-sound Economic Development) program, which subsidizes its growth. The team included IIM Bangalore student Tushar Bhargava.", "sources": [{"file": "India 2014/Field Survey Results_FULL_CLEAN.xlsx", "reason": "Sheet names such as 'Conjoint Analysis Responses', 'Connection Fee vs. Monthly fee' and 'Businesses Monthly Diesel Spend' correspond to the electricity-package survey analyses in the TARAoorja report."}, {"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "Section 2 (p.5-6) states 'TARAoorja is a participant in the Smart Power for Environmentally-sound Economic Development (SPEED) program, a Rockefeller Foundation backed venture'."}, {"file": "India 2014/DraftLetterofAgreementTARAoojaGSE_12-10-2014_clean.docx", "reason": "The GSE Student Team list includes 'IIM(B): Tushar Bhargava', and the filename marks it as a 12-10-2014 draft."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15 - SNEHA (Society for Nutrition, Education and Health Action)", "org": "SNEHA (Society for Nutrition, Education and Health Action)", "folder": "India 2014", "sheet_row": 35, "parent": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15", "filled": 22, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15 - SNEHA (Society for Nutrition, Education and Health Action)", "sources": [{"file": null, "reason": "Constructed followi al Presentation.pdf", "reason": "The mission slide (p.1-2) describes 'a non-profit organization that seeks to improve the health and well-being of women and children in underprivileged communities of Mumbai'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "To improve the health and well-being of women and children in underprivileged communities of Mumbai, targeting four areas: maternal and neonatal health, child health and nutrition, sexual and reproductive health, and prevention of violence against women and children.", "sources": [{"file": "India 2014/SNEHA Final Presentation.pdf", "reason": "The Mission Statement slide (p.2) states this mission and the four major target areas."}, {"file": "India 2014/GSE White Paper - SNEHA.pdf", "reason": "Section 2 (p.4) states 'The mission of SNEHA is to provide health services and education to marginalized families living in informal settlements in the greater Mumbai metropolitan area' with the four target issues."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "SNEHA runs grassroots community health programs in Mumbai's informal settlements through trained frontline workers (Program Officers, Community Organizers, Peer Educators, Sanginis), educating and empowering slum women while partnering with existing public healthcare systems and providers to improve maternal/newborn health, child nutrition, reproductive health, and prevention of violence against women and children.", "sources": [{"file": "India 2014/GSE White Paper - SNEHA.pdf", "reason": "Section 2 (p.4-6) describes the two-pronged community/public-system approach and the frontline worker roles (Program Officer, Community Organizer, Peer Educators, Sanginis)."}, {"file": "India 2014/SNEHA & Yale GSE - Signed LOA.pdf", "reason": "The OCR'd background (p.1) states SNEHA 'supports existing governmental and health systems for improving quality of services, but also directly works with slum communities'."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": "366 full-time staff (FY2014-15, not yet complete); 24 management staff (whether included within the 366 is not stated); over 300 are frontline workers", "sources": [{"file": "India 2014/SNEHA Bangalore Presentation.pdf", "reason": "The Institution & Context slide (p.4) lists 'Team strength: 24 management staff, 366 full time staff'."}, {"file": "India 2014/SNEHA & Yale GSE - Signed LOA.pdf", "reason": "The OCR'd background (p.1) credits 'the training and deployment of over 300 front line workers'."}, {"file": "India 2014/SI Lab Presentation.pptx", "reason": "Slide 6 shows staff growth to '366*' with the note 'Fiscal year 2014-2015 is not yet complete'."}, {"file": "India 2014/SNEHA Bangalore Presentation.pdf", "reason": "Revision 2026-08-02: p.4 lists '24 management staff' and '366 full time staff' as separate bullets without stating their relationship; the additive 'plus' wording was replaced with a neutral list ('whether included within the 366 is not stated')."}], "rev": {"status": "revised", "note": "QA ⚠️ accepted: the additive 'plus' (which could double-count) replaced with a neutral list — the source lists '24 management staff' and '366 full time staff' as separate bullets without stating their relationship."}}, {"name": "People Served", "header": "How many people do you serve?", "value": "As of 2014, SNEHA estimates it has directly impacted 55,000 individuals and indirectly impacted another 75,000.", "sources": [{"file": "India 2014/SNEHA & Yale GSE - Signed LOA.pdf", "reason": "The OCR'd background (p.1) states 'As of 2014, SNEHA estimates that the organization has been able to directly impact 55,000 individuals and indirectly impact another 75,000 individuals.'"}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Anuja Jayaraman", "sources": [{"file": "India 2014/SNEHA & Yale GSE - Signed LOA.pdf", "reason": "The OCR'd signature block o fecting positive change in the provisioning of health care to women and children' (p.3), a direct match to 'Health Care'."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Maternal and neonatal health; child health and nutrition; sexual and reproductive health; prevention of violence against women and children; urban slum community health; frontline health worker management", "sources": [{"file": "India 2014/GSE White Paper - SNEHA.pdf", "reason": "The executive summary (p.3) lists the four program targets, and the project itself focused on frontline worker HR practices."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2014/SNEHA Bangalore Presentation.pdf", "reason": "The Institution & Context slide (p.4) shows the organization was founded in 1999 (15 years old at engagement) with 366 full-time staff and a $1.7 million budget (2013-14)."}, {"file": "India 2014/GSE White Paper - SNEHA.pdf", "reason": "The executive summary (p.3) describes 'a period of significant growth' with a three-fold increase in frontline workers, indicating a mature, scaled organization."}]}, {"name": "Project City", "header": "Project City", "value": "Mumbai", "sources": [{"file": "India 2014/Team SNEHA - Mumbai Itinerary.xlsx", "reason": "The itinerary is titled 'Team SNEHA - Mumbai Itinerary' with arrival into Mumbai January 1, 2015 and site visits through January 8."}, {"file": "India 2014/SI Lab Presentation.pptx", "reason": "Slide 11 is captioned 'Site visit to SNEHA Centre in Dharavi, Mumbai'."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Maharashtra", "sources": [{"file": "India 2014/GSE White Paper - SNEHA.pdf", "reason": "Section 2 (p.4-5) states 'Mumbai is the capital city of the state of Maharashtra', the location of SNEHA's greater-Mumbai operations."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2014/GSE White Paper - SNEHA.pdf", "reason": "The mission section (p.3-4) situates SNEHA's work among slum communities in Mumbai, India."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale GSE team conducted a semester-long examination of SNEHA's human resource practices for its frontline workers (especially Community Organizers), covering management practices, recruitment and retention/attrition, and employee appraisal. The team combined internal interviews and field visits in Mumbai (Jan 2-8, 2015) with benchmarking against peer organizations, HR literature, and expert interviews. The final white paper recommends adopting effective peer practices, normalizing management practices across programs, active retention activities, best-practice recruitment, formal exit surveys/interviews, and a consistent objective appraisal system, with proposed KPIs and an importance-vs-ease implementation prioritization.", "sources": [{"file": "India 2014/SNEHA & Yale GSE - Signed LOA.pdf", "reason": "The OCR'd scope (p.1-2) defines the key project question on improving 'frontline worker management model through its assessment metrics and tools, retention efforts, and integration of best practices', with deliverables of a findings report and executive presentation."}, {"file": "India 2014/GSE White Paper - SNEHA.pdf", "reason": "The executive summary (p.3) outlines the three research streams, and the Next Steps section (final pages, ~p.28-29) presents the recommendations and importance/ease prioritization graph."}, {"file": "India 2014/SI Lab Presentation.pptx", "reason": "Slide 14 lists the six recommendations (adopt peer practices, normalize management practices, retention activities, recruitment best practices, exit surveys, objective appraisal system)."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Organizational Systems and Behavior", "sources": [{"file": "India 2014/GSE White Paper - SNEHA.pdf", "reason": "The deliverables focus entirely on HR/organizational management - management practices, retention & recruiting, and employee appraisal (table of contents, p.3) - matching 'Organizational Systems and Behavior'."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "The shared file 'SI Lab Presentation.pptx' belongs to this org: its title slide reads 'Society for Nutrition, Education, and Health Action' with the SNEHA team names. 'SNEHA & Yale GSE - Signed LOA.pdf' is a scanned PDF (no extractable text layer); values from it were obtained via OCR. The Mumbai itinerary also lists further org leadership the team met: Vanessa D'Souza (CEO), Dr. Shanti Pantvaidya (Executive Director), and Sushma Shinde (Director of Maternal and Newborn Health). The SNEHA team included five students (Muthuraman Al, David Gonzalez, Sterling Grey, Tiffany Morris, Chocku Radhakrishnan), with Tiffany Morris as the primary GSE email contact.", "sources": [{"file": "India 2014/SI Lab Presentation.pptx", "reason": "Slide 1 is titled 'Society for Nutrition, Education, and Health Action' and lists the SNEHA GSE team members."}, {"file": "India 2014/SNEHA & Yale GSE - Signed LOA.pdf", "reason": "pdftotext returns no text (scanned document); the communications section obtained via OCR (p.5) states 'The primary GSE email contact for SNEHA will be Tiffany Morris'."}, {"file": "India 2014/Team SNEHA - Mumbai Itinerary.xlsx", "reason": "Sheet1 lists meetings with Vanessa D'Souza (CEO), Dr. Shanti Pantvaidya (Executive Director), and Sushma Shinde (Director of Maternal and Newborn Health)."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15 - SURE (Sakhi Unique Rural Enterprise Pvt. Ltd.)", "org": "SURE (Sakhi Unique Rural Enterprise Pvt. Ltd.)", "folder": "India 2014", "sheet_row": 36, "parent": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15", "filled": 20, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/14 - 6/30/15 - SURE (Sakhi Unique Rural Enterprise Pvt. Ltd.)", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement belongs to the Fall 2014 Global Social Entrepreneurship course at Yale SOM (project work October/November 2014 through February 2015), with letters of engagement finalized December 3-10, 2014, an India field trip January 1-9, 2015 culminating in a January 9, 2015 all-teams conference in Bangalore, and final reports delivered February 26-28, 2015. [India 2014/Letter of Engagement 120914.pdf] The BASIX Krishi Letter of Engagement is dated December 9, 2014 and its timeline (p.8) runs from 'October: Preliminary research' through 'January 2-8: In-country work', 'January 9: Presentation at GSE conference', and 'February 28: Final presentations and final reports due (Yale)'."}, {"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The report states (p.2) 'In the Fall of 2014, the GSE team conducted market research... During January of 2015, the Yale GSE team traveled to India', and the title page is dated February 2015."}, {"file": "India 2014/TARAoorja GSE Final Report Feb 27 2015.pdf", "reason": "The title page (p.1) is dated February 26, 2015, evidencing final deliverables in late February 2015."}]}, {"name": "Parent Program", "header": "Parent Program*", "value": "Global Social Entrepreneurshi
