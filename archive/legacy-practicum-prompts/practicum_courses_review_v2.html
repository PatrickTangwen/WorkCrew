ction schedule, use an electronic loan tracking system, enforce collection policies more strictly, and develop a financial monitoring and budgeting process.", "sources": [{"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.4 (Executive Summary) describes the shift from an expansion question to operational analysis, the Rs 6.6 million financing need before March 2015, and lists the four recommendations."}, {"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.23 (Exhibit 2) details the construction of the 36-month financial and operational scenario model built with the accountant, branch manager, board members, and founder Dr. Pradip Sarmah."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Organizational Systems and Behavior, Business Strategy/Revenue", "sources": [{"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.23 describes 'the construction and analysis of a forward looking financial and operational model' over a 36-month horizon as 'an important value added contribution of this project' — Financial Modeling."}, {"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "pp.18-20 recommendations focus on operational processes (weekly collection schedule, electronic loan tracking, collection-policy enforcement, monitoring and budgeting process) — Organizational Systems and Behavior."}, {"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.4 assesses financial viability of the business model and the funding needed to grow and approach banks — Business Strategy/Revenue."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Not t management. Using founder interviews and three-week founder time-tracking, an employee survey (about half of staff responded), interviews with roughly ten technology/design firms (e.g., TinyCo, Foursquare, Google, Frog), and academic research (Jim Barron's Employee Blueprint model), the team recommended: (1) organizational restructuring with clearly separated founder roles (Hilmi as Social Initiatives Director, Subhi as Technology Director) and a new Project Manager middle-management layer; (2) employee retention measures; and (3) improved operational and project management efficiency, laid out on 3-month, 1-year, and 2-year implementation horizons with monitoring guidance.", "sources": [{"file": "India 2011/ZMQ FINAL REPORT.pdf", "reason": "pp.4-5 (Project Methodology) describe the founder discussions, founder time-tracking, employee survey, ~10 company interviews, and academic research approach."}, {"file": "India 2011/ZMQ FINAL REPORT.pdf", "reason": "pp.7-9 diagnose the critical problem as 'Founderitis', and pp.15-21 present Recommendations #1-#3 (restructuring/delegation with Project Manager roles, employee retention, operational/project management efficiency)."}, {"file": "India 2011/ZMQ FINAL REPORT.pdf", "reason": "pp.22-23 (Implementation and Monitoring) lay out the 3-month/1-year/2-year timeline."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Organizational Systems and Behavior, Scaling", "sources": [{"file": "India 2011/ZMQ FINAL REPORT.pdf", "reason": "pp.15-21 deliver recommendations on organizational restructuring, delegation, middle management, employee retention, and product-development processes (Exhibit 5) — Organizational Systems and Behavior."}, {"file": "India 2011/ZMQ FINAL REPORT.pdf", "reason": "p.4 frames the engagement around 'a central issue that was inhibiting ZMQ's efforts to scale', making the restructuring a scaling enabler — Scaling."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": "Medium", "sources": [{"file": "India 2011/ZMQ FINAL REPORT.pdf", "reason": "p.22 states 'In fact, during the course of our engagement, many of the 3-month horizon items have already been implemented' — explicit evidence of partial early adoption of the recommendations, though longer-horizon outcomes are unknown."}], "rev": {"status": "kept_rebut", "note": "Rebutted: the report supports partial early implementation without complete or lasting outcomes — the middle state 'Medium' encodes. Rubric confirmation requested."}}, {"name": "Notes", "header": "Notes", "value": "The report title is 'Hands Off, Minds On'. Exhibit 4 (ZMQ Staff Survey) is marked 'Results Confidential'. The report notes special implementation challenges: the deep behavior change required of founders and 'Intricacies of a Family Business in India'. No website, email, or phone contact details appear in the document.", "sources": [{"file": "India 2011/ZMQ FINAL REPORT.pdf", "reason": "The cover page (p.1) carries the title 'Hands Off, Minds On', and the Table of Contents (p.2) lists 'Exhibit 4: ZMQ Staff Survey (Results Confidential)'."}, {"file": "India 2011/ZMQ FINAL REPORT.pdf", "reason": "pp.22-23 (Additional Challenges) discuss founder behavior change and 'Intricacies of a Family Business in India'."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/12 - 6/30/13 - TARA Machines and Tech Services Pvt. Ltd.", "org": "TARA Machines and Tech Services Pvt. Ltd.", "folder": "India 2012", "sheet_row": 27, "parent": "Global Social Entrepreneurship India - 7/1/12 - 6/30/13", "filled": 21, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/12 - 6/30/13 - TARA Machines : "India 2012/Fall GSE Initial Presentation - TARA.pptx", "reason": "Slide 4 ('Introducing TARA: Mission') lists 'Develop high quality, green building materials; Create rural enterprises and jobs; Enhance access to affordable housing; Recycle waste, Conserve energy, Reduce carbon emissions.'"}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "TARA manufactures and sells machines that produce green building materials — clay and fly-ash brick machines (BrickMek, EcoKiln, MechRam, Balram) and concrete machines for micro-concrete roofing tiles and pavers — selling B2B to micro/SME brick makers and small building contractors, with technical service support and in-house R&D. It works predominantly across India with one-off export projects in Afghanistan, Bangladesh, Bhutan, Cameroon, Indonesia and Sri Lanka.", "sources": [{"file": "India 2012/TARA Final Presentation, Final GBF 01.21.13 FINAL.pptx", "reason": "Slide 6 shows '3 machines types, differentiated by product' (clay machines BrickMek/EcoKiln, fly ash & concrete machines MechRam/Balram, concrete machines for tiles and pavers) with price ranges."}, {"file": "India 2012/Fall GSE Initial Presentation - TARA.pptx", "reason": "Slide 8 identifies customers as 'Direct B2B: Micro, SMEs (Brick Makers); Small Building Contractors (Concrete Product Manufacturers)' plus NGO/corporate partners."}, {"file": "India 2012/2013.01.21 TARA Summary Final.pdf", "reason": "p.1 notes the group 'has predominantly worked across India with one-off projects abroad in Afghanistan, Bangladesh, Bhutan, Cameroon, Indonesia, and Sri Lanka.'"}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": 14, "sources": [{"file": "India 2012/Fall GSE Initial Presentation - TARA.pptx", "reason": "Slide 5 table 'TARA's Current State & Growth Strategy' lists Employees: 14 current (23 in growth plan)."}]}, {"name": "People Served", "header": "How many people do you serve , "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Housing & Shelter, Environmental Quality Protection & Beautification, Employment", "sources": [{"file": "India 2012/Fall GSE Initial Presentation - TARA.pptx", "reason": "Slide 4 mission points 'Enhance access to affordable housing' (Housing & Shelter), 'Recycle waste, Conserve energy, Reduce carbon emissions' (Environmental Quality Protection & Beautification), and 'Create rural enterprises and jobs' (Employment — an approximate match since TARA creates jobs via SME enterprise creation rather than direct employment services)."}, {"file": "India 2012/TARA Final Presentation, Final GBF 01.21.13 FINAL.pptx", "reason": "Slide 5 frames TARA's opportunity as producing 'affordable, quality, green building materials,' enhancing 'access to housing,' and 'Driving local enterprises & jobs.'"}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Green/affordable building materials; rural SME and enterprise development; low-carbon construction technology; export of appropriate technology to developing markets", "sources": [{"file": "India 2012/TARA Machines LofA 9.20.2012B.pdf", "reason": "p.1 describes the focus on 'high quality, affordable, green building materials for small and medium enterprises' and the desire 'to better understand export opportunities.'"}, {"file": "India 2012/Fall GSE Initial Presentation - TARA.pptx", "reason": "Slide 10 summarizes impact as 'homes, jobs, \"waste to wealth\".'"}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "middle stage", "sources": [{"file": "India 2012/2013.01.21 TARA Summary Final.pdf", "reason": "p.1 states TARA 'was established in March 2008' (about 4.5 years old at engagement) with 'proven market success in the Indian market' (Conclusion, p.35)."}, {"file": "India 2012/Fall GSE Initial Presentation - TARA.pptx", "reason": "Slide 5 shows a small but proven business — 14 employees, ~$700K sales (2010), self-classified 'Growth Stage: Stage III (Success)' moving toward 'Stage IV (Take-off)' — consistent with a middle-stage rather than early or fully established organization."}]}, {"name": "Project City", "header": "Project City", "value": "New Delhi", "sources": [{"file": "India 2012/TARA Final Presentation, Final GBF 01.21.13 FINAL.pptx", "reason": "Slide 4 states 'TARA Machines est. in 2008, HQ in New Delhi.'"}, {"file": "India 2012/TARA Machines LofA 9.20.2012B.pdf", "reason": "p.5 timeline includes 'SOM team visit to TARA LTD in New Delhi' (January 2-7, 2013)."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Delhi", "sources": [{"file": "India 2012/TARA Final Presentation, Final GBF 01.21.13 FINAL.pptx", "reason": "Slide 4 places TARA's headquarters in New Delhi (National Capital Territory of Delhi)."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2012/2013.01.21 TARA Summary Final.pdf", "reason": "p.1 describes Development Alternatives as 'headquartered in New Delhi, India' and TARA as working 'predominantly ... across India'; the project itself evaluated export markets in Southeast Asia and Africa, ultimately Indonesia and Sri Lanka."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale team evaluated export opportunities for TARA's brick- and concrete-product machines through a three-tier process: a Tier 1 country scan of 31+ Southeast Asian and African economies, a Tier 2 deep-dive analysis of six shortlisted countries (Botswana, Ghana, Indonesia, Sri Lanka, Thailand, Vietnam), and a Tier 3 export strategy. Deliverables included the country-scan spreadsheet, a written recommendation, a roadmap presentation, and a flexible financial model. The team recommended Indonesia and Sri Lanka as the top export markets (with proposed hubs in Jakarta and Colombo), estimated break-even of roughly 23 machines over about 3 years for building a presence in both countries, and additionally recommended investing in a CRM tool and internal professional development.", "sources": [{"file": "India 2012/TARA Machines LofA 9.20.2012B.pdf", "reason": "pp.1-3 define the three-tier scope (country scan, target country evaluation, target strategy design) and p.3 lists deliverables: country analysis spreadsheet, written recommendation & rationale, and a 2-3 year roadmap presentation."}, {"file": "India 2012/2013.01.21 TARA Summary Final.pdf", "reason": "p.1 summarizes the Tier 1/2/3 process and the identification of 'Indonesia and Sri Lanka as the top export markets,' and the Conclusion (p.35) gives 'a break-even of roughly 23 machines and 3.0 years' plus the recommendation to invest in 'a Customer Relationship Management (CRM) tool and associated internal professional development.'"}, {"file": "India 2012/TARA Final Presentation, Final GBF 01.21.13 FINAL.pptx", "reason": "Slide 11 ('Results & Recommendation') states the team 'Identified Indonesia & Sri Lanka as top markets,' with recommended HQs Jakarta (slide 25) and Colombo (slide 27)."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Business Strategy/Revenue, Financial Modeling, Scaling, Marketing", "sources": [{"file": "India 2012/TARA Machines LofA 9.20.2012B.pdf", "reason": "p.3 lists the Tier 3 strategy components as 'Entrance Strategy & High-Level Operational Considerations,' 'Marketing Strategy, identifying entrance points, product focus, and potential branding,' and 'Financial Model, incorporating costs and top considerations' — supporting Business Strategy/Revenue, Marketing and Financial Modeling tags."}, {"file": "India 2012/(20130110)Financials_final_v1.xlsx", "reason": "The breakeven/P&L model for Indonesia and Sri Lanka evidences the Financial Modeling tag."}, {"file": "India 2012/2013.01.21 TARA Summary Final.pdf", "reason": "p.1 frames the project as designing an export expansion strategy into new foreign markets, an approximate match for the Scaling tag (geographic growth of the business)."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "TARA is part of the Development Alternatives Group (founded 1983). The Grassroots Business Fund (GBF) is an investor/advisor — the LOA lists 'Approval of TARA LTD's export strategy by the TARA LTD Board and Grassroots Business Fund (GBF) advisors' as a success metric, and the final deck filename references GBF. Two versions of the Indonesia/Sri Lanka financial model exist in the folder ('Financials-TARA_AV.xlsx' and '(20130110)Financials_final_v1.xlsx'); both were attributed to TARA by their Indonesia/Sri Lanka costing and P&L content. The final report cover is dated January 21 but internal page headers misprint 'January 21, 2012.'", "sources": [{"file": "India 2012/TARA Machines LofA 9.20.2012B.pdf", "reason": "p.4 lists 'Approval of TARA LTD's export strategy by the TARA LTD Board and Grassroots Business Fund (GBF) advisors' among success metrics."}, {"file": "India 2012/(20130110)Financials_final_v1.xlsx", "reason": "Sheets are named 'Assumptions Indonesia,' 'Assumptions Sri Lanka,' 'P&L Indonesia,' 'P&L Sri Lanka' — matching the TARA export strategy countries."}, {"file": "India 2012/2013.01.21 TARA Summary Final.pdf", "reason": "Page headers read 'January 21, 2012' although the report describes work through January 2013."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/12 - 6/30/13 - Agastya International Foundation", "org": "Agastya International Foundation", "folder": "India 2012", "sheet_row": 28, "parent": "Global Social Entrepreneurship India - 7/1/12 - 6/30/13", "filled": 22, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/12 - 6/30/13 - Agastya International Foundation", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement ran during the Fall 2012 semester of Yale SOM's Global Social Entrepreneurship course (taught September 2012 through January 2013): Letters of Agreement were signed September 21, 2012, the student teams traveled to India January 1-10, 2013 (client site visits roughly January 2-7 and a New Delhi conference hosted by the Rai Foundation's business school January 8-10, 2013), and final deliverables were due January 25, 2013. [India 2012/Agastya LOA_vF.pdf] p.1 states the project was completed during Yale School of Management's 'Global Social Entrepreneurship' course 'taught September through January 2013,' and p.8 records signing 'this date of Friday, September 21, 2012.'"}, {"file": "India 2012/TARA Machines LofA 9.20.2012B.pdf", "reason": "The LOA header is dated September 21, 2012 and the Proposed Timeline (p.5) schedules the SOM team visit to TARA in New Delhi for January 2-7, 2013, the Rai Foundation business school conference for January 8-10, 2013, and final report revision by January 25, 2013."}, {"file": "India 2012/Detailed Visit Plan- Yale Team.pdf", "reason": "p.1 schedules the Yale team's field visit to Agastya for January nds-on science education to children in government schools in rural India through four main programs: Mobile Labs ('science on wheels'), Science Centers, the Young Instructor Leaders peer-teaching program, and Lab-in-a-Box teacher empowerment, plus training of government school teachers. Its largest campus and R&D center is in Kuppam on the Karnataka/Andhra Pradesh border.", "sources": [{"file": "India 2012/Agastya Final Report v8.pdf", "reason": "p.5 describes the four main programs — Mobile Labs, Science Centers, Young Instructor Leaders and Lab-in-a-Box — and the Kuppam campus/R&D center."}, {"file": "India 2012/Agastya LOA_vF.pdf", "reason": "p.1 lists 'campus programs, science centers, mobile labs, \"Lab in a Box\"' as the vehicles for the mission."}, {"file": "India 2012/Detailed Visit Plan- Yale Team.pdf", "reason": "p.1 schedules visits to the Bangalore office, Kuppam Campus, and the Hoskote, Bangalore and Ramanagaram Science Centres."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": "Over 450 staff (377 per the September 2012 introductory presentation)", "sources": [{"file": "India 2012/Agastya Final Report v8.pdf", "reason": "p.5 states Agastya is 'a large nonprofit with over 450 staff.'"}, {"file": "India 2012/Agastya Introductory Presentation_vF.pptx", "reason": "Slide 3 lists 'Number of staff: 377.'"}]}, {"name": "People Served", "header": "How many people do you serve?", "value": "Reaches four million students and empowers over 100,000 teachers (introductory presentation: programs implemented for over 4 million children, 50% girls, and 150,000 teachers; ~1.5 million exposures annually via ~60 mobile labs and 28 science centers); goal of 50 million children and 1 million teachers by 2020/2021.", "sources": [{"file": "India 2012/Agastya Final Report v8.pdf", "reason": "p.5 states 'Agastya currently reaches four million students and empowers over 100,000 teachers in government schools. By 2021, it plans to reach over fifty million students and one million teachers.'"}, {"file": "India 2012/Agastya Introductory Presentation_vF.pptx", "reason": "Slide 11 states Agastya 'has implemented programs for over 4 million children (50% have been girls) and 150,000 teachers' and 'provides annually over 1.5 million exposures.'"}, {"file": "India 2012/Agastya LOA_vF.pdf", "reason": "p.1 cites the 'stated goal of reaching 50 million children and 1 million teachers by 2020.'"}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "K. Thiagarajan ('Thiagu')", "sources": [{"file": "India 2012/Agastya LOA_vF.pdf", "reason": "p.1 lists 'K. Thiagarajan (\"Thiagu\")' as the first Agastya-side party, and p.8 shows his signature block for Agastya."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": "COO", "sources": [{"file": "India 2012/Detailed Visit Plan- Yale Team.pdf", "reason": "p.1 Day 1 schedule reads 'Breakfast with Mr. K Thiagarajan, COO.'"}]}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Nitin Desai", "sources": [{"file": "India 2012/Agastya LOA_vF.pdf", "reason": "p.1 lists 'Nitin Desai' as the second Agastya-side party and p.8 shows his signature block for Agastya."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Education, Youth Development", "sources": [{"file": "India 2012/Agastya Final Report v8.pdf", "reason": "p.5 describes Agastya as a hands-on science education nonprofit working with students in rural government schools (Education)."}, {"file": "India 2012/Agastya Introductory Presentation_vF.pptx", "reason": "Slide 6 identifies the target audience as 'Disadvantaged children – Ages 6 to 18' and slide 4 describes the Young Instructors peer-teaching model, supporting the Youth Development category."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Hands-on/experiential STEM and science education; rural education; teacher training; peer instruction; creativity development in children", "sources": [{"file": "India 2012/Agastya Final Report v8.pdf", "reason": "pp.4-5 emphasize 'hands-on STEM learning provided in rural villages,' interactive teaching via science experiments, and teacher empowerment through Lab-in-a-Box."}, {"file": "India 2012/Agastya Introductory Presentation_vF.pptx", "reason": "Slide 4 covers teacher training, training dropouts to become instructors, and young instructors."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2012/Agastya Final Report v8.pdf", "reason": "p.5 states Agastya was 'Founded in 1999' (13 years old at engagement), is 'a large nonprofit with over 450 staff and an annual operating budget of $4 million,' operates in over thirty districts and six states, and reaches four million students — evidence of an established organization."}]}, {"name": "Project City", "header": "Project City", "value": "Bangalore", "sources": [{"file": "India 2012/Agastya Final Report v8.pdf", "reason": "p.5 states Agastya is 'Headquartered in Bangalore.'"}, {"file": "India 2012/Detailed Visit Plan- Yale Team.pdf", "reason": "p.1 centers the Yale team's visit on the Agastya Bangalore Office, with field trips to Kuppam Campus and area science centres."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Karnataka", "sources": [{"file": "India 2012/Agastya Final Report v8.pdf", "reason": "p.5 places headquarters in Bangalore (Karnataka) and notes the largest science center is 'located in Kuppam at the border of Karnataka and Andra Pradesh.'"}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2012/Agastya LOA_vF.pdf", "reason": "p.1 frames Agastya's vision as 'enabling a creative India,' and p.7 schedules the January in-person work in Bangalore and Kuppam, India."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale team developed a Talent Management Strategy for Agastya focused on the instructor workforce that delivers over 90% of its programs, to support Agastya's plan to grow reach roughly 10x by 2020/2021. After interviews, surveys and benchmarking, the team identified high instructor attrition as the biggest obstacle to scaling and recommended standardized recruitment practices, a cohort-based Fellowship Model with agreed instructor tenure, low-cost retention strategies, and an Ambassador Program, along with hiring a central HR manager and instituting manager training. Deliverables included the strategy report with an implementation toolkit, timelines, and assessment exhibits.", "sources": [{"file": "India 2012/Agastya LOA_vF.pdf", "reason": "p.3 defines the anticipated final deliverable as 'a Talent Management Strategy (\"TMS\") document for Agastya' containing 'a set of recommendations and a tool kit for implementation' across the human capital chain (recruitment, on-boarding, training, evaluation, compensation, retention)."}, {"file": "India 2012/Agastya Final Report v8.pdf", "reason": "p.4 Executive Summary states the team 'identified instructor talent management practices as the core of the project,' found 'high attrition rate as the biggest challenge,' and recommended standardized recruitment, a Fellowship Model with cohorts, low-cost retention strategies, and an Ambassador Program, plus hiring a central HR manager and a manager training program."}, {"file": "India 2012/Detailed Visit Plan- Yale Team.pdf", "reason": "p.1 shows the on-the-ground research plan, including a 'Focus Group Interaction with 5 current and 5 former Instructors' at Kuppam Campus and interviews with senior managers."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Organizational Systems and Behavior, Scaling", "sources": [{"file": "India 2012/Agastya Final Report v8.pdf", "reason": "p.4 shows the deliverable was a human-capital/talent-management strategy (recruitment, retention, fellowship, HR management) — a direct match for Organizational Systems and Behavior."}, {"file": "India 2012/Agastya LOA_vF.pdf", "reason": "p.1 states the project addresses human capital management as a challenge 'in achieving this objective of scaling up' to 50 million children, supporting the Scaling tag."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "'Detailed Visit Plan- Yale Team.pdf' was attributed to Agastya because every scheduled meeting is with Agastya staff at the Bangalore office, Kuppam Campus and Agastya science centres. The LOA defines success metrics as speed/breadth of Agastya's implementation of the recommendations, but no outcome evidence appears in the folder.", "sources": [{"file": "India 2012/Detailed Visit Plan- Yale Team.pdf", "reason": "p : [{"file": "India 2012/Final GSE Report draft - 1-21-13.pdf", "reason": "p.6 quotes the mission statement 'Skilling people, enhancing livelihoods, transforming lives' and the Vision 2020 statement about reaching 1 million learners."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "B-ABLE delivers vocational skills training through three models: 'traditional' semi-urban training centers with classrooms and labs for unemployed/under-employed youth aged 18-30; rural computer-equipped 'kiosk'/Common Service centers teaching basic literacy, IT and English to those aged 15-18; and short 'upskilling' courses for workers already in the workforce. It operates in more than 17 Indian states with 60+ training centers and thousands of rural kiosks, training in technical skills (e.g., mobile phone repair, auto repair, domestic work, industrial skills) plus life and language skills.", "sources": [{"file": "India 2012/B-ABLE SOM Letter of Agreement - FINAL DRAFT.pdf", "reason": "p.1 describes the three delivery models (traditional centers, rural kiosks, upskilling)."}, {"file": "India 2012/Final GSE Report draft - 1-21-13.pdf", "reason": "p.6 states 'B-ABLE currently operates in more than 17 Indian states with 60+ training centers and more than 4,000 rural kiosks' and lists technical, life and language skills training."}, {"file": "India 2012/BABLE Presentation 9 5 2012.pptx", "reason": "Slide 5 lists the eight economic sectors B-ABLE focuses on (domestic house assistance, construction, health care, tourism/hospitality, food processing, banking/insurance/finance, rural trades, automobile)."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": "9-member project management team (organization-wide count not stated)", "sources": [{"file": "India 2012/BABLE Presentation 9 5 2012.pptx", "reason": "Slide 3 ('Institution & Context') states verbatim '9-member project management team'; no organiza e stage, established)", "value": "middle stage", "sources": [{"file": "India 2012/B-ABLE SOM Letter of Agreement - FINAL DRAFT.pdf", "reason": "p.1 states B-ABLE 'was started in 2009' — only ~3 years old at engagement."}, {"file": "India 2012/Final GSE Report draft - 1-21-13.pdf", "reason": "p.6 shows it had nonetheless already scaled to 'more than 17 Indian states with 60+ training centers and more than 4,000 rural kiosks,' with backing from BASIX and NSDC — young but rapidly grown, consistent with middle stage."}]}, {"name": "Project City", "header": "Project City", "value": "New Delhi", "sources": [{"file": "India 2012/Final GSE Report draft - 1-21-13.pdf", "reason": "p.3 describes B-ABLE as 'a New Delhi-based social enterprise'; pp.8-9 describe the January field visits around New Delhi (Bhiwadi training center, Noida mobilization, Khan Market/Kashmiri Gate/Transport Nagar auto-mechanic markets)."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Delhi", "sources": [{"file": "India 2012/Final GSE Report draft - 1-21-13.pdf", "reason": "p.3 places B-ABLE in New Delhi (National Capital Territory of Delhi); field research also extended to Bhiwadi, Rajasthan ('just over the board from New Delhi in Rajasthan,' p.9)."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2012/B-ABLE SOM Letter of Agreement - FINAL DRAFT.pdf", "reason": "p.1 frames the project around vocational training in India and the timeline (p.7) includes '1/1-1/10 – Travel to India.'"}]}, {"name": "Project Description", "header": "Project Description", "value": "'Project UpSkill': the Yale team scanned five vocational sectors (auto mechanics, carpenters, electricians, plumbers, domestic workers), narrowed to auto mechanics and plumbing, and conducted secondary and primary research (interviews/surveys with trainers, practitioners and employers in the US, UK and China) on how upskilling markets ft - 1-21-13.pdf", "reason": "The title page names B-ABLE and the same five authors listed as the 'GSE Student Team' in the B-ABLE LOA; p.7 lists the five Fall 2012 GSE social enterprises including 'Kaushalya Foundation: An organization working with rural farmers to simplify the supply to capture more value for farmers.'"}, {"file": "India 2012/B-ABLE SOM Letter of Agreement - FINAL DRAFT.pdf", "reason": "p.1 lists the GSE Student Team as 'Jonas Barre, Anna Grotberg, Michael Lazar, Bob Zager, Judy Zhu,' matching the report authors."}, {"file": "India 2012/Kaushalya Draft4.pptx", "reason": "Slide 1 is titled 'KAUSHALYA Foundation and the Samriddhii Initiative,' establishing it belongs to the Samriddhii engagement, not B-ABLE."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/12 - 6/30/13 - Samriddhii", "org": "Samriddhii", "folder": "India 2012", "sheet_row": 30, "parent": "Global Social Entrepreneurship India - 7/1/12 - 6/30/13", "filled": 20, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/12 - 6/30/13 - Samriddhii", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement ran during the Fall 2012 semester of Yale SOM's Global Social Entrepreneurship course (taught September 2012 through January 2013): Letters of Agreement were signed September 21, 2012, the student teams traveled to India January 1-10, 2013 (client site visits roughly January 2-7 and a New Delhi conference hosted by the Rai Foundation's business school January 8-10, 2013), and final deliverables were due January 25, 2013. [India 2012/Agastya LOA_vF.pdf] p.1 states the project was completed during Yale School of Management's 'Global Social Entrepreneurship' course 'taught September through J 13."}, {"file": "India 2012/Detailed Visit Plan- Yale Team.pdf", "reason": "p.1 schedules the Yale team's field visit to Agastya for January 2-7, 2013."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "Samriddhii", "sources": [{"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "p.1 is titled 'LETTER OF AGREEMENT BETWEEN GSE STUDENT TEAM AND SAMRIDDHII' and quotes: 'Samriddhii is a social initiative aimed at achieving the economic independence of the marginalized vegetable and fruit-growing farmers in Bihar.'"}, {"file": "India 2012/Kaushalya Draft4.pptx", "reason": "Slide 1 is titled 'KAUSHALYA Foundation and the Samriddhii Initiative,' and slide 6 notes state 'Samriddhii is a joint venture between Kaushalya Foundation and Knids Green PVT.'"}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "Hybrid social enterprise: joint venture/brand of the nonprofit Kaushalya Foundation (social service organization) and the for-profit Knids Green Pvt. Ltd. (commercial arm)", "sources": [{"file": "India 2012/Kaushalya Draft4.pptx", "reason": "Slide 6 speaker notes explain 'Kaushalya Foundation is a nonprofit' handling 'Supply chain management and technical assistance to farmers,' while 'Knids Green Pvt. Ltd. is the commercial arm of the project' handling 'Transportation, distribution, sales, pricing,' with Samriddhii as the joint venture and vegetable brand label."}, {"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "p.1 characterizes Samriddhii as 'a social initiative organizing informal sector farmers and vendors.'"}]}, {"name": "Sector", "header": "Sector", "value": "Agriculture / fresh-vegetable supply chain and distribution", "sources": [{"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "p.1 describes 're-engineering the (vegetable and fruit) supply chain by directly connecting the market place and the producers.'"}, {"file": "India 2012/Samriddhii Final Report DRAFT 1.22.13.pdf", "reason": "p.1 frames the work within 'The Indian Agricultural Sector' and describes the farm-to-table integrated vegetable supply chain."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "To achieve the economic independence of marginalized vegetable- and fruit-growing farmers in Bihar by re-engineering the supply chain to directly connect producers with the marketplace; more broadly, increasing income and generating employment at the grassroots level and professionalizing the informal fresh-vegetable trade to create dignified self-employment.", "sources": [{"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "p.1 quotes: 'Samriddhii is a social initiative aimed at achieving the economic independence of the marginalized vegetable and fruit-growing farmers in Bihar. The purpose of Samriddhii is accomplished by re-engineering the (vegetable and fruit) supply chain by directly connecting the market place and the producers.'"}, {"file": "India 2012/Kaushalya Draft4.pptx", "reason": "Slide 3 gives the mission '(a) Increasing income and generating employment at the grass root level and (b) equitable and holistic development' and the vision of 'Professionalizing the informal trade channel of fresh vegetables and creating gainful, dignified self-employment.'"}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "Samriddhii organizes SMAL (small, marginalized, landless) farmers and street vendors into an integrated fresh-vegetable supply chain: produce is collected at village collection centers, sorted/graded/packaged under the Samriddhii brand at a processing center, and distributed via refrigerated pushcarts, home delivery, institutional buyers and the 'Bihar Fresh' retail outlet, with unsold produce bought back. It also provides agriculture training, crop protection services, pushcart rental, and loan facilitation for farmer groups.", "sources": [{"file": "India 2012/Kaushalya Draft4.pptx", "reason": "Slides 7-9 describe the product flow (600 farmers, 7 village collection centers, 1 processing center, 3,000 vendors), sales channels including home delivery and refrigerated pushcarts, and services including agriculture training, crop protection, and pushcart rental; slide 14 mentions the 'BIHAR FRESH' AC vegetable retail outlet in Patna."}, {"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "pp.1-2 describe the hub-and-spoke model in which produce is sorted and packaged at a processing center, delivered to depots, distributed to cart vendors, and unsold produce is bought back and resold."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": "52 staff (as of 2011)", "sources": [{"file": "India 2012/Kaushalya Draft4.pptx", "reason": "Slide 4 states 'Kaushalya Foundation's Samriddhi brand is managed by 6 team leaders who manage between 5-10 staff. As of 2011, they emplyed 52 staff members.'"}]}, {"name": "People Served", "header": "How many people do you serve?", "value": "A network of 600 farmers and 3,000 vendors; about 200,000 vegetables sold per day; farmer incomes up 25-150%; grew to a 65-cart operation across Patna.", "sources": [{"file": "India 2012/Kaushalya Draft4.pptx", "reason": "Slide 12 ('Impact') states 'Network of 600 farmers and 3,000 vendors,' 'Average selling price up 15-20%,' and 'Farmer's income up 25-150%'; slide 11 states KNIDS Green 'Sells about 200,000 vegetables/day.'"}, {"file": "India 2012/Samriddhii Final Report DRAFT 1.22.13.pdf", "reason": "p.1 states 'Samriddhii grew to a 65 cart operation spread all over Patna, the capital of Bihar.'"}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Kaushlendra", "sources": [{"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "p.1 lists 'Samriddhii team: Kaushlendra, Rekha Kumari,' and p.7 names 'Anuj and Kaushlendra' as primary additional staff contacts for the weekly calls."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Rekha Kumari", "sources": [{"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "p.1 lists 'Samriddhii team: Kaushlendra, Rekha Kumari,' and p.7 designates 'Rekha as the key point of contact' for the weekly Skype calls."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Food Agriculture & Nutrition, Employment, Community Improvement & Capacity Building", "sources": [{"file": "India 2012/Samriddhii Final Report DRAFT 1.22.13.pdf", "reason": "p.1 describes integrating the agricultural supply chain for fresh vegetables in Bihar (Food Agriculture & Nutrition)."}, {"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "p.2 lists goals of 'Generating livelihood opportunities' and 'Economic empowerment of street vendors and vegetable growers' — approximate matches for Employment (livelihood/self-employment creation) and Community Improvement & Capacity Building (organizing and professionalizing farmers and vendors)."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Agricultural supply-chain integration; farmer cooperatives; livelihoods of small, marginalized and landless (SMAL) farmers and street vendors; rural poverty in Bihar; food distribution, cold chain and wastage reduction", "sources": [{"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "p.1 describes empowering 'SMAL (small, marginalized, landless) farmers and vendors in Bihar by increasing their access to markets and increasing their profits.'"}, {"file": "India 2012/Samriddhii Final Report DRAFT 1.22.13.pdf", "reason": "pp.5-11 analyze wastage, cold storage chambers and transportation across the value chain."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "early stage", "sources": [{"file": "India 2012/Kaushalya Draft4.pptx", "reason": "Slide 4 states Kaushalya Foundation was 'Founded in 2007' with 52 staff (2011), revenue of Rs. 4 crore and profit of only 'Rs. 1-2 Lakh.'"}, {"file": "India 2012/Samriddhii Final Report DRAFT 1.22.13.pdf", "reason": "p.1-2 describe a young operation at 'a key turning point' whose 65-cart 'grassroots business model ... was no longer sustainable' and which had temporarily shut down operations while a new processing plant was built (p.3) — indicative of an early-stage enterprise still pivoting its model."}]}, {"name": "Project City", "header": "Project City", "value": "Patna", "sources": [{"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "p.2 states 'Samriddhii seeks to expand its operations within Patna,' and the timeline (p.5) reads 'Jan.2 — Yale goes to Patna!'"}, {"file": "India 2012/Samriddhii Final Report DRAFT 1.22.13.pdf", "reason": "p.1 describes 'a 65 cart operation spread all over Patna, the capital of Bihar.'"}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Bihar", "sources": [{"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "p.1 targets 'marginalized vegetable and fruit-growing farmers in Bihar.'"}, {"file": "India 2012/Kaushalya Draft4.pptx", "reason": "Slide 4 notes the supply chain network operates in four districts of Bihar (and seven districts of Uttar Pradesh)."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2012/Samriddhii Final Report DRAFT 1.22.13.pdf", "reason": "The title is 'Samriddhii: Preparing for Growth In The Indian Agricultural Sector' and all operations described are in Bihar, India."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale team analyzed Samriddhii's operations and finances to support growth via a franchised 'Distribution Point' (DP) hub-and-spoke model in Patna. Work included a breakeven analysis (finding at least 64 franchised carts needed to break even) and cost-driver analysis delivered as an Excel model, a value-chain investigation covering processing-center automation, cold-storage chambers to arbitrage seasonal price swings, and transportation scheduling by perishability (25% transport cost savings), plus recommendations on DP economics, mobile payments via IMPS, and mobile marketing. Earlier-phase deliverables per the LOA included comparative case-study research, a current-state process map and a current-state financial model.", "sources": [{"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "pp.2-6 define the three phases (comparative analysis, current-state operations research with process map and financial model, growth model development) with final deliverables of a written summary, Excel financial model, and PowerPoint for the Delhi conference."}, {"file": "India 2012/Samriddhii Final Report DRAFT 1.22.13.pdf", "reason": "pp.2-4 describe the franchise/breakeven analysis ('the minimum number of carts franchised in order for Samriddhii to break even is at least 64') and cost-driver analysis; pp.7-12 cover sorting/grading automation, cold storage chambers, transportation savings of '21,720 Rs per month,' DP economics, IMPS mobile payment, and mobile marketing recommendations."}, {"file": "India 2012/Breakeven Analyses.xlsx", "reason": "The workbook's Overview/Inputs/Break-Even Analysis/Cold Chambers/Product Mix sheets (e.g., '# Carts: 64,' 'Carts per new DP: 5,' 'Max # Institutional clients in Patna yr 1') are the breakeven model that accompanies the Samriddhii report."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue, Scaling", "sources": [{"file": "India 2012/Breakeven Analyses.xlsx", "reason": "The multi-sheet breakeven and cost model built for the franchise decision evidences Financial Modeling."}, {"file": "India 2012/Samriddhii Final Report DRAFT 1.22.13.pdf", "reason": "p.2 frames the engagement as evaluating 'the strategy of the organization moving forward' via franchise analysis and value-chain investigation (Business Strategy/Revenue), explicitly to support expansion/growth of the cart network in Patna (Scaling)."}, {"file": "India 2012/Letter of Agreement Outline_revised_10.3.12_for Tony.pdf", "reason": "p.2 states the Yale team would 'make recommendations on an appropriate growth plan via a \"hub-and-spoke\" distribution model in Patna.'"}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Treated as one client organization ('Samriddhii') per the LOA, though structurally it is a joint venture: nonprofit Kaushalya Foundation (farmer/vendor organizing, supply-chain management) + for-profit Knids Green Pvt. Ltd. (KGPL — purchasing, sales, logistics), with 'Samriddhii' the shared brand. 'Letter of Agreement Outline_revised_10.3.12_for Tony.pdf' was attributed here because its title page reads 'LETTER OF AGREEMENT BETWEEN GSE STUDENT TEAM AND SAMRIDDHII'; 'Kaushalya Draft4.pptx' was attributed here (not to B-ABLE) because it presents the Kaushalya Foundation/Samriddhii initiative and lists the Samriddhii student team in its speaker notes. 'Breakeven Analyses.xlsx' matches the breakeven model described in the Samriddhii report. Two near-identical copies of the final report exist; the '_TS' copy carries Tony Sheldon's margin comments (both extracts contain 'Commented [TS#]' annotations). The report also notes operations were temporarily shut down while a new processing plant was built.", "sources": [{"file": "India 2012/Kaushalya Draft4.pptx", "reason": "Slide 6 speaker notes describe Kaushalya Foundation as the nonprofit, Knids Green Pvt Ltd as 'the commercial wing,' and Samriddhii as 'the joint venture of both, and also the label name of the vegetables'; slide notes name team members (e.g., 'LIBBY,' 'PREETHA') matching the Samriddhii LOA team."}, {"file": "India 2012/Samriddhii Final Report DRAFT 1.22.13_TS.pdf", "reason": "This copy contains reviewer annotations such as 'Commented [TS1]' and 'Commented [TS3]: This seems rather different from your LoA,' consistent with instructor (Tony Sheldon) feedback on the same 1.22.13 draft."}, {"file": "India 2012/Samriddhii Final Report DRAFT 1.22.13.pdf", "reason": "p.3 explains assumptions referencing 'temporary shut-down of operations while the new processing plant was being built.'"}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/12 - 6/30/13
