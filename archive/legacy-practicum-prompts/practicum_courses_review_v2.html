<html lang="en">
<head>
<meta charset="UTF-8">

<title>GSE Practicum Courses — Data Review · v2</title>
<style>
  :root{
    --bg:#f6f7f9; --surface:#ffffff; --border:#e3e6ea; --border-strong:#cdd3da;
    --ink:#1a202c; --ink-2:#4a5568; --ink-3:#8a94a3;
    --accent:#2563eb; --accent-soft:#eff4ff; --accent-border:#c7d7fb;
    --amber-bg:#fff8e8; --amber-border:#f0dca8; --amber-ink:#7a5b12;
    --green-bg:#eefaf1; --green-ink:#1c7a3d;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg)}
  a{color:var(--accent);text-decoration:none}
  .app{display:flex;height:100vh;overflow:hidden}

  /* ---------- sidebar ---------- */
  .side{width:295px;min-width:295px;background:var(--surface);border-right:1px solid var(--border);
        display:flex;flex-direction:column}
  .side-head{padding:14px 16px 10px;border-bottom:1px solid var(--border)}
  .side-head h1{font-size:15px;margin:0 0 2px;font-weight:650}
  .side-head .sub{font-size:11.5px;color:var(--ink-3)}
  .search{padding:10px 12px;border-bottom:1px solid var(--border)}
  .search input{width:100%;padding:7px 10px;border:1px solid var(--border-strong);border-radius:7px;
                font-size:13px;outline:none;background:#fbfcfd}
  .search input:focus{border-color:var(--accent)}
  .nav{overflow-y:auto;flex:1;padding:6px 0 20px}
  .fgroup{margin:2px 0}
  .fhead{display:flex;align-items:center;gap:6px;padding:7px 14px 5px;cursor:pointer;user-select:none}
  .fhead:hover{background:#f2f5f8}
  .fhead .tri{font-size:9px;color:var(--ink-3);width:10px;transition:transform .12s}
  .fgroup.open .tri{transform:rotate(90deg)}
  .fhead .fname{font-weight:650;font-size:13px}
  .fhead .fcount{margin-left:auto;font-size:11px;color:var(--ink-3)}
  .fbadge{font-size:9.5px;padding:1px 6px;border-radius:8px;background:var(--amber-bg);
          color:var(--amber-ink);border:1px solid var(--amber-border);font-weight:600}
  .rowlist{display:none}
  .fgroup.open .rowlist{display:block}
  .rowitem{padding:5px 14px 5px 30px;cursor:pointer;font-size:12.8px;color:var(--ink-2);
           display:flex;gap:8px;align-items:baseline;border-left:2px solid transparent}
  .rowitem:hover{background:#f2f5f8}
  .rowitem.active{background:var(--accent-soft);border-left-color:var(--accent);color:var(--ink)}
  .rowitem .rnum{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);min-width:24px}
  .rowitem.active .rnum{color:var(--accent)}
  .rowitem .rorg{flex:1}
  .side-foot{padding:9px 14px;border-top:1px solid var(--border);font-size:11px;color:var(--ink-3)}

  /* ---------- main ---------- */
  .main{flex:1;overflow-y:auto;padding:22px 30px 60px}
  .wrap{max-width:1060px;margin:0 auto}

  /* overview */
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin:2px 0 18px}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:10px 16px;min-width:110px}
  .stat .v{font-size:21px;font-weight:650}
  .stat .l{font-size:11px;color:var(--ink-3);margin-top:1px}
  .callout{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:9px;
           padding:11px 14px;margin:0 0 10px;font-size:12.8px;color:var(--amber-ink)}
  .callout b{color:inherit}
  h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
         font-weight:650;margin:26px 0 8px}
  table.ovr{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--border);
            border-radius:9px;overflow:hidden;font-size:12.8px}
  table.ovr th{background:#fafbfc;text-align:left;padding:7px 10px;font-size:11px;color:var(--ink-3);
               text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--border)}
  table.ovr td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:top}
  table.ovr tr:last-child td{border-bottom:none}
  table.ovr tr.clickable{cursor:pointer}
  table.ovr tr.clickable:hover{background:var(--accent-soft)}
  .pill{display:inline-block;padding:1px 7px;border-radius:9px;background:#f0f2f5;font-size:11px;
        color:var(--ink-2);margin:1px 3px 1px 0;white-space:nowrap}
  .fillbar{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}

  /* row detail */
  .crumb{font-size:12px;color:var(--ink-3);margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .crumb .home{cursor:pointer;color:var(--accent)}
  .rowtitle{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin:0 0 4px}
  .rowtitle h2{font-size:20px;margin:0;font-weight:680}
  .rowtitle .meta{font-size:12px;color:var(--ink-3)}
  .pidbox{font-family:var(--mono);font-size:11.5px;background:var(--surface);border:1px solid var(--border);
          border-radius:7px;padding:7px 10px;margin:8px 0 4px;color:var(--ink-2);word-break:break-word}
  .pidbox b{color:var(--ink);font-weight:600}
  .navbtns{margin-left:auto;display:flex;gap:6px}
  .navbtns button{border:1px solid var(--border-strong);background:var(--surface);border-radius:7px;
                  padding:4px 11px;font-size:12px;cursor:pointer;color:var(--ink-2)}
  .navbtns button:hover{border-color:var(--accent);color:var(--accent)}
  .navbtns button:disabled{opacity:.4;cursor:default}

  .fieldcard{background:var(--surface);border:1px solid var(--border);border-radius:10px;
             margin:14px 0;overflow:hidden}
  .fieldrow{display:grid;grid-template-columns:215px 1fr;border-bottom:1px solid var(--border)}
  .fieldrow:last-child{border-bottom:none}
  .fieldrow.highlight{background:#fffdf2}
  .fname2{padding:11px 14px;font-size:12.3px;font-weight:600;color:var(--ink-2);
          border-right:1px solid var(--border);background:#fafbfc;cursor:help}
  .fname2 .colno{font-family:var(--mono);font-size:10px;color:var(--ink-3);display:block;font-weight:500}
  .fbody{padding:10px 16px 11px;min-width:0}
  .fvalue{white-space:pre-wrap;word-break:break-word;font-size:13.3px}
  .fvalue.empty{color:var(--ink-3);font-style:italic;font-size:12.5px}
  .fvalue .tagpill{display:inline-block;padding:1px 8px;border-radius:9px;background:var(--accent-soft);
        border:1px solid var(--accent-border);font-size:11.5px;color:#1d4ed8;margin:1px 4px 1px 0}
  .srcs{margin-top:7px;border-top:1px dashed var(--border);padding-top:7px}
  .srcitem{display:flex;gap:8px;margin:4px 0;align-items:baseline}
  .srcfile{font-family:var(--mono);font-size:10.6px;background:#f0f4f9;border:1px solid #dee6ef;
           color:#33507a;border-radius:5px;padding:1px 6px;white-space:nowrap;max-width:340px;
           overflow:hidden;text-overflow:ellipsis;flex-shrink:0;cursor:default}
  .srcreason{font-size:12.2px;color:var(--ink-2);min-width:0}
  .togglebar{padding:9px 14px;font-size:12.3px;color:var(--accent);cursor:pointer;background:#fafbfc;
             border-top:1px solid var(--border);user-select:none}
  .togglebar:hover{background:var(--accent-soft)}
  .hiddenrows{display:none}
  .fieldcard.show-empty .hiddenrows{display:block}
  .notecall{background:var(--amber-bg);border:1px solid var(--amber-border);border-radius:9px;
            padding:10px 14px;margin:10px 0 2px;font-size:12.6px;color:var(--amber-ink)}
  mark{background:#ffe9a8;padding:0 1px;border-radius:2px}
  .legend{font-size:12px;color:var(--ink-3);margin-top:26px}
  .legend table{border-collapse:collapse;margin-top:6px;background:var(--surface);
                border:1px solid var(--border);border-radius:8px;overflow:hidden}
  .legend td{padding:4px 10px;border-bottom:1px solid var(--border);font-size:11.5px}
  .legend tr:last-child td{border-bottom:none}
  .legend td:first-child{font-weight:600;color:var(--ink-2);white-space:nowrap}
  details.leg summary{cursor:pointer;color:var(--accent);font-size:12.5px}
  @media (max-width:860px){
    .app{flex-direction:column;height:auto;overflow:visible}
    .side{width:100%;min-width:0;max-height:45vh}
    .fieldrow{grid-template-columns:1fr}
    .fname2{border-right:none;border-bottom:1px solid var(--border)}
  }

  .vtag{font-size:10px;vertical-align:2px;background:var(--accent-soft);border:1px solid var(--accent-border);
    color:#1d4ed8;padding:1px 7px;border-radius:9px;font-weight:700;margin-left:6px;letter-spacing:.03em}
  .mono2{font-family:var(--mono);font-size:11px}
  .revbadge{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:8px;font-weight:700;
    letter-spacing:.02em;border:1px solid;white-space:nowrap}
  .fbody .revbadge{margin:0 0 4px}
  .revbadge.fixed{background:var(--green-bg);color:var(--green-ink);border-color:#bfe8cc}
  .revbadge.revised{background:var(--amber-bg);color:var(--amber-ink);border-color:var(--amber-border)}
  .revbadge.cleared{background:#f0f2f5;color:var(--ink-2);border-color:var(--border-strong)}
  .revbadge.kept_rebut{background:var(--accent-soft);color:#1d4ed8;border-color:var(--accent-border)}
  .revbadge.kept_ok{background:var(--surface);color:var(--ink-3);border-color:var(--border)}
  .revnote{font-size:11.8px;color:var(--ink-2);background:var(--surface);border-left:3px solid var(--accent-border);
    padding:6px 10px;margin:3px 0 7px;border-radius:0 6px 6px 0;line-height:1.5}
  .revsec{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:14px 16px;margin:0 0 4px}
  .revsec table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
  .revsec th{text-align:left;color:var(--ink-3);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;
    padding:4px 8px;border-bottom:1px solid var(--border-strong)}
  .revsec td{padding:5px 8px;border-bottom:1px solid var(--border);vertical-align:top}
  .revchips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
  .revchip{font-size:11px;padding:2px 9px;border-radius:9px;border:1px solid var(--border-strong);
    background:#f0f2f5;color:var(--ink-2)}
  .revsec ol{margin:6px 0 2px 18px;padding:0;font-size:12.3px;color:var(--ink-2)}
  .revsec ol li{margin:4px 0;line-height:1.5}
  .revsec .small{font-size:11.5px;color:var(--ink-3);line-height:1.5}
  .revsum{cursor:pointer;font-size:12.5px;font-weight:650;color:var(--ink-2);margin-top:10px}
  .revsec details{margin-top:8px}


  .allrows{margin:10px 12px 0;padding:7px 12px;display:flex;align-items:center;gap:7px;
    background:var(--surface);border:1px solid var(--border-strong);border-radius:9px;
    font-size:12.5px;font-weight:650;color:var(--ink-2);cursor:pointer;user-select:none}
  .allrows:hover{border-color:var(--accent-border);color:#1d4ed8;background:var(--accent-soft)}
  .allrows.active{background:var(--accent-soft);border-color:var(--accent-border);color:#1d4ed8}
  .allrows .ico{font-size:13px;line-height:1}

  </style>
</head>

05_2015.pdf", "reason": "Introduction (p.4): 'The fish complex located in Acre, Brazil was designed to produce three species of native Amazonian fish while boosting the local economy and reducing deforestation.'"}]}, {"name": "Org Mission", "header": "Org Mission", "value": "To produce native Amazonian fish at scale while boosting the local economy of Acre and reducing deforestation, integrating local farmers into the value chain.", "sources": [{"file": "Brazil 2015/FINALGSEPeixesReport05_2015.pdf", "reason": "Introduction (p.4) states the complex 'was designed to produce three species of native Amazonian fish while boosting the local economy and reducing deforestation'."}, {"file": "Brazil 2015/Peixes GSE-Class Presentation-Post Trip.pptx", "reason": "Slide 5 'Theory of Change' pairs 'Environment' and 'Economic' impacts for Acre farmers."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "Provides native juvenile Amazon fish (pirarucu, pintado, tambaqui), feed, training and growth specifications to local farmers in Acre, finances them via Kaete, then buys back mature fish and processes them for market at its fish complex - described as the largest fish-processing plant in Brazil. Its primary market has been local Acre; it was evaluating US export for 2016.", "sources": [{"file": "Brazil 2015/DRAFT1.6LetterofEngagement02.08.2015.pdf", "reason": "Project Background and Objectives (p.1) describe the juvenile-fish/feed/buy-back model with local farmers, the local Acre market since the 2011 launch, and the goal of entering the US market in 2016."}, {"file": "Brazil 2015/Peixes GSE-Class Presentation-Post Trip.pptx", "reason": "Slide 4 'Business Model' diagrams flows among Peixes da Amazonia, Acre Farmers, commercial banks, distributors, wholesalers, retailers and food service."}, {"file": "Brazil 2015/GSE Presentation--Kaete Final Presentation-FINAL.pdf", "reason": "The scope slide identifies the three species: pirar launched in 2011, the primary market... has been the local market in the State of Acre' - a four-year-old business still seeking economies of scale."}, {"file": "Brazil 2015/FINALGSEPeixesReport05_2015.pdf", "reason": "Executive Summary (p.3) concludes 'Peixes will likely need to make some significant investments in its own processes' before entering the US market, indicating still-maturing operations."}]}, {"name": "Project City", "header": "Project City", "value": null, "sources": []}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Acre", "sources": [{"file": "Brazil 2015/DRAFT1.6LetterofEngagement02.08.2015.pdf", "reason": "Project Background (p.1): 'Peixes de Amazonia is an aquaculture business based in the state of Acre', while 'Kaete Investimentos is an independent asset management company based in Sao Paulo'."}, {"file": "Brazil 2015/FINALGSEPeixesReport05_2015.pdf", "reason": "Introduction (p.4): 'The fish complex located in Acre, Brazil'."}]}, {"name": "Project Country", "header": "Project Country", "value": "Brazil", "sources": [{"file": "Brazil 2015/FINALGSEPeixesReport05_2015.pdf", "reason": "Introduction (p.4) locates the fish complex in 'Acre, Brazil'."}]}, {"name": "Project Description", "header": "Project Description", "value": "Engaged by Kaete Investimentos, the Yale GSE team assessed a US market-entry strategy for Peixes da Amazonia's three native Amazonian fish species, focusing on California. The team interviewed experts from 22 organizations, reviewed the US seafood market, regulations and sustainability certifications, and spent the March 2015 week in Sao Paulo meeting the Kaete team, a fish distributor (Grupo 5), and export role models (Sambazon). The final report (May 6, 2015) and presentation recommend partnering first with a distributor experienced in introducing new species, developing a chef 'evangelist', documenting nutrition and operational processes, and building the impact story, while flagging capacity, compliance, farmer, and timing risks.", "sources": [{"file": "Brazil 2015/DRAFT1.6LetterofEngagement02.08.2015.pdf", "reason": "Objectives (p.1) define the goal 'to assess and develop recommendations for a strategy for Peixes to enter the US market', with a final document due May 5, 2015."}, {"file": "Brazil 2015/FINALGSEPeixesReport05_2015.pdf", "reason": "Title 'Selling Seafood in California' (May 6, 2015); Methods (p.4) notes interviews with experts from 22 organizations; Reflections and Recommendations (pp.20-23) contain the distributor-first and chef-advocate recommendations and the risk list."}, {"file": "Brazil 2015/In-country Itinerary.pdf", "reason": "The in-country week includes visits to Grupo 5 Business Solutions (fish distribution), Instituto Semeia, a call with Sambazon's COO, and wrap-up sessions with Kaete."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Business Strategy/Revenue, Marketing, Scaling", "sources": [{"file": "Brazil 2015/FINALGSEPeixesReport05_2015.pdf", "reason": "The deliverable is a market-entry strategy report covering distribution channels, pricing, partnerships and risks ('Business Strategy/Revenue')."}, {"file": "Brazil 2015/FINALGSEPeixesReport05_2015.pdf", "reason": "The Positioning section (pp.12-16) analyzes consumer positioning, naming, impact-story marketing and sustainability branding ('Marketing')."}, {"file": "Brazil 2015/DRAFT1.6LetterofEngagement02.08.2015.pdf", "reason": "The engagement exists because Peixes must 'increase production and reach economies of scale' via new markets (p.1), an expansion/growth objective ('Scaling', approximate match)."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Determination on 'Kaete': Kaete Investimentos is NOT a separate student-team client - it is the Sao Paulo-based sustainable-investment asset manager that is Peixes da Amazonia's majority investor/largest shareholder and formally engaged the GSE team on Peixes' behalf; the 'Kaete' presentation files are this same Peixes team's deliverables (identical team roster: Batra, Dhakhwa, Ling, McGrath, Souza Lima, Webb). Third Kaete team member in the LOE: Luis Fernando Laranja da Fonseca. The LOE is a draft (unsigned signature lines). Org name is spelled both 'Peixes de Amazonia' (LOE) and 'Peixes da Amazonia' (final report/presentations). The report's Appendix D contacts (APEX Brasil, CleanFish, etc.) are external interviewees, not client contacts. The team could not visit Acre; in-country work was with Kaete in Sao Paulo (InCountryTimeIdeas.pdf notes an Acre site visit was 'Unlikely, given the long trip').", "sources": [{"file": "Brazil 2015/DRAFT1.6LetterofEngagement02.08.2015.pdf", "reason": "p.1 defines Kaete Investimentos as the Sao Paulo asset manager providing the majority of Peixes' financing, and p.6 lists the Kaete Team (Mario Netto, Otavio Maffra Ottoni, Luis Fernando Laranja da Fonseca) opposite the GSE team, with blank signature lines."}, {"file": "Brazil 2015/GSE Presentation--Kaete Final Presentation-FINAL.pdf", "reason": "Despite 'Kaete' in the filename, the title slide reads 'PEIXES DA AMAZONIA' with the same six-person student team as the Peixes report."}, {"file": "Brazil 2015/InCountryTimeIdeas.pdf", "reason": "Idea 1 'Tour of Peixes facility' is marked 'Unlikely, given the long trip to Acre. Would be open to a video/Skype tour.'"}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/08 - 6/30/09 - Centre for Environment Education (CEE)", "org": "Centre for Environment Education (CEE)", "folder": "India 2008", "sheet_row": 7, "parent": "Global Social Entrepreneursh "reason": "p.1 states the RPG 'has been working in the area of sustainable rural Development since last twenty years' and covers 'education, health and sanitation, food security, poverty alleviation, organic farming' issues; the parent body is named the Centre for Environment Education."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "The RPG works for sustainable rural development so that villagers 'should not become beneficiaries through our projects, but should become entrepreneurs', building environmental awareness, extension services and economic support.", "sources": [{"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.1 states 'our aim is that the villagers should not become ‘beneficiaries’ through our projects, but should become entrepreneurs', and describes the Gramnidhi model as 'based on environmental awareness, extension services and economic support.'"}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "The RPG works in 100 villages of Gujarat across three ecosystems on education, health and sanitation, food security, poverty alleviation and organic farming. Its Gramnidhi pilot uses existing self-help savings groups in ten villages to lend working capital for small eco-enterprises in agriculture, animal husbandry and agro-processing, focused mainly on women.", "sources": [{"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.1 states RPG 'is working in 100 villages of Gujarat state in three different ecosystems' and 'has looked at variety of issues like education, health and sanitation, food security, poverty alleviation, organic farming'."}, {"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.1 describes Gramnidhi as a pilot in ten villages where saving groups 'were used as a base to provide loans to start ecologically sustainable enterprises', with enterprises 'in three main areas – agriculture, animal husbandry and agro processing' and a focus on women (p.2)."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": "35 (Rural Programme Group only; org-wide count not stated)", "sources": [{"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.1 states the RPG 'even today remains the largest group of the Centre, with its strength of 35 members' (this is the Rural Programme Group only, not all of CEE)."}], "rev": {"status": "kept_ok", "note": "No change needed: the explicit scope qualifier the reviewer asked to retain is already in the cell."}}, {"name": "People Served", "header": "How many people do you serve?", "value": "100 villages in Gujarat; the Gramnidhi pilot covers 10 villages with about 180 self-help group members, with planned scale-up to about 100 saving groups.", "sources": [{"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.1 states RPG 'is working in 100 villages of Gujarat state', and p.2 says data will be provided on the 'Profile of the self help group members (about 180)'."}, {"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.2 states the scale-up target: 'we are talking about some 100 saving groups and about half a million rupees.'"}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": null, "sources": []}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": null, "sources": []}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Environmental Quality Protection & Beautification, Community Improvement & Capacity Building", "sources": [{"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.1 supports the environment category via the parent body's name (Centre for Environment Education) and the focus on 'ecologically sustainable enterprises' and organic farming; the match is approximate since the org works on environment through rural development rather than beautification."}, {"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.1-2 support Community Improvement & Capacity Building via 'Capacities were sought to be built by creating entrepreneurial mindset among the participants' and the plan to federate village saving groups at district level; the SHG micro-lending focus makes this the closest available category since no microfinance category exists in the list."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Sustainable rural development; SHG-based micro-lending for eco-enterprises (Gramnidhi); women's economic empowerment; environmental education and extension services.", "sources": [{"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.1 describes loans from self-help group corpuses for eco-enterprises, and states 'The project was mainly focused on women; it was found that they were truly recognized as decision makers in the community' (continuing on p.2)."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.1 states the RPG 'has been working in the area of sustainable rural Development since last twenty years', is 'the largest group of the Centre', and has an annual budget of Rs. 30 million, indicating an established organization."}]}, {"name": "Project City", "header": "Project City", "value": null, "sources": []}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Gujarat", "sources": [{"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.1 states RPG 'is working in 100 villages of Gujarat state in three different ecosystems'; no city is named for the org's office."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.1 places the work in 'Gujarat state' and refers to 'the society... in our nation' in the Indian NGO-sector context, and p.2 quantifies funds in rupees."}]}, {"name": "Project Description", "header": "Project Description", "value": "The proposed project asks the Yale SOM student team to 'define some business strategies' for scaling the Gramnidhi micro-lending pilot from ten villages to a district-level federation of about 100 savings groups managing roughly half a million rupees. Deliverables were to include a financial plan for the federation (reserve ratios, interest rates, loan sizing, portfolio/investment management and financial instruments) and a business management plan for the funded eco-enterprises (loan-worthiness parameters, federation services, viability rules of thumb, and production and marketing strategies). Only this problem statement exists; no final report is in the folder.", "sources": [{"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.2 states 'we would like to scale up our program to this level soon... We wanted the SoM students to define some business strategies for such upscaling.'"}, {"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.2 lists the tasks 'Preparation of Financial plan for such a Federation' ('how much reserve ratio to be maintained to how much interest to be charged... basically a broader portfolio management') and 'Business management plan for the proposed eco-entreprises' including loan-worthiness parameters and 'Designing production and marketing strategies'."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue, Scaling", "sources": [{"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.2 supports Financial Modeling via the deliverable 'Preparation of Financial plan for such a Federation... like a financial plan for any financing institute or a small bank', including reserve ratios, interest rates and an investment plan."}, {"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.2 supports Business Strategy/Revenue via the deliverable 'Business management plan for the proposed eco-entreprises' covering loan-worthiness parameters, services, viability criteria, and production and marketing strategies."}, {"file": "India 2008/CEE - Problem Statement 1 - Gram Nidhi Prose.pdf", "reason": "p.2 supports Scaling via 'we would like to scale up our program to this level soon, and expand it even further with time', which frames the whole assignment as upscaling strategy."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": zation in 2008."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "Development Support Centre (DSC)", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 states 'Development Support Centre (DSC), Ahmedabad was established in 1994 as a response to the need of knowledge based support required by facilitating agencies of Participatory Natural Resource Management.'"}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "NGO", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 states 'DSC is probably the largest NGO involved in field implementation of PIM in collaboration with the government', and p.3 refers to 'NGOs such as Development Support Centre'."}]}, {"name": "Sector", "header": "Sector", "value": "Natural resource management / participatory irrigation and watershed management", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 describes DSC's focus on 'Participatory Irrigation Management (PIM), Watershed Management, Joint Forest Management and Agriculture Enhancement' and its 'package of DSC`s services for supporting NRM'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "DSC provides knowledge-based support to agencies facilitating participatory natural resource management, with a mandate 'to serve rural communities' guided by 'equity, efficiency and sustainability'.", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 states DSC was established 'as a response to the need of knowledge based support required by facilitating agencies of Participatory Natural Resource Management', and p.3 describes 'DSC whose mandate is to serve rural communities and which believes in equity, efficiency and sustainability'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "DSC does action research on NRM programs, capacity building for government, NGO and community-based organization functionaries, policy research and advocacy, communication materials (including a popular radio program), and networking. It has promoted more than 180 Water Users Associations and four canal-level federations covering about 43,000 hectares, run 400+ capacity-building programs, and obtained 35+ state policy orders including the 2007 PIM Act.", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 lists DSC's service package: 'Action research... Capacity building (Government, CBOs and NGO)... Research... Dissemination of research findings... Networking... Influence changes in policy/ procedures... Monitoring'."}, {"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 states 'Till year 2008, the organization has promoted more than 180 Water Users Associations (WUAs) and four federations... covering approximately 43,000 hectare command area'."}, {"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.2 states 'DSC has obtained more than 35 policy related orders... including the Enactment of PIM Act in 2007', 'organized more than 400 programmes for capacity building', and 'produces a very popular radio programme on agriculture productivity enhancement'."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": 45, "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 states 'DSC has 45 experienced professionals’ staff from various backgrounds such as rural management, civil/ argil. engineering, social science, agriculture and finance.'"}]}, {"name": "People Served", "header": "How many people do you serve?", "value": "About 40,000 households directly benefited through 180+ Water Users Associations covering approximately 43,000 hectares of irrigation command area.", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 states 'About 40,000 households are directly benefited through these interventions' after describing the 180+ WUAs and 43,000 hectare command area."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Vijay Mahajan", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 states 'The present Chairman is Shri Vijay Mahajan who is also the Founder Chairman of PRADAN and BASIX'; he is the only current named leader, though the document does not explicitly designate him as the project contact."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": "Chairman", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 identifies him as 'The present Chairman' of DSC."}]}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": null, "sources": []}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Food Agriculture & Nutrition, Environmental Quality Protection & Beautification, Community Improvement & Capacity Building", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1-2 support Food Agriculture & Nutrition via the focus on irrigation management, 'Agriculture Enhancement', 'agriculture input services to the farmers, crop demonstrations, processing marketing of major crops' and the radio program on agriculture productivity."}, {"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 supports the environmental category (approximate match) via DSC's core work in 'Participatory Natural Resource Management', 'Watershed Management' and 'Joint Forest Management'."}, {"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 supports Community Improvement & Capacity Building via DSC's stated role of providing 'capacity building inputs to key-functionaries in Government and NGOs' and promoting community institutions (WUAs and federations) for 'community empowerment'."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Participatory irrigation management; watershed management; joint forest management; agricultural productivity enhancement; NRM policy advocacy; NGO financial sustainability and talent retention.", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 lists PIM, Watershed Management, Joint Forest Management and Agriculture Enhancement as DSC's focus areas, and p.3 frames the engagement around revenue generation and 'non-financial incentives that an organization can provide to attract and retain professionals'."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 states DSC 'was established in 1994' and has worked 'Over the last 14 years' with 45 professional staff, 180+ WUAs promoted and 35+ policy orders obtained, indicating an established organization."}]}, {"name": "Project City", "header": "Project City", "value": "Ahmedabad", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 identifies the organization as 'Development Support Centre (DSC), Ahmedabad'."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Gujarat", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.2 frames the challenge as 'The challenges for Non-Government Organisations (NGOs) in Gujarat State, India', and DSC's field work is described across Gujarat irrigation schemes (with a new initiative planned in Madhya Pradesh, p.4)."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.2 heading reads 'The challenges for Non-Government Organisations (NGOs) in Gujarat State, India', and p.1 references national bodies such as the Planning Commission, Government of India."}]}, {"name": "Project Description", "header": "Project Description", "value": "The proposed project addresses DSC's financial sustainability as grant funding dwindles: the student team was to review DSC's business plan and historical income/expenditure, interview staff, trustees, funders and prospective grantors to test the hypothesis that DSC must become less grant-dependent, and complete a SWOT analysis. The core deliverable was a detailed business plan for DSC's new Madhya Pradesh start-up (rollout fall 2008), including revenue mix assumptions, cost analysis, projected income statement, IRR analysis, sensitivity analysis, and organizational/talent recommendations, plus a PowerPoint for DSC trustees, grantors and partners. Only this problem statement exists; no final report is in the folder.", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.4 states DSC 'seeks to develop the framework for altering its funding base to include self-generating revenue products or services' and lists tasks including a 'detailed review of the current DSC business plan', funder interviews to 'test the DSC hypothesis that they must become less dependent upon grants', and 'a detailed SWOT... Analysis'."}, {"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.4 specifies 'A detailed business plan, including revenue mix assumptions, cost analysis and human resource requirements for the MP start-up' with income statement, 'IRR returns analysis' and 'Sensitivity analysis on major assumptions employed'."}, {"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.5 lists task 7, 'Development of a Power Point presentation suitable for presentation to DSC Trustees, grantors, and other potential “partners”'."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue, Organizational Systems and Behavior, Scaling", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.4 supports Financial Modeling via required deliverables of an income statement projection, 'Summary of capital funding required and IRR returns analysis based on forecast results' and 'Sensitivity analysis on major assumptions employed'."}, {"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.4 supports Business Strategy/Revenue via the goal of 'altering its funding base to include self-generating revenue products or services' and the required 'revenue mix assumptions' and SWOT analysis."}, {"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.4 supports Organizational Systems and Behavior via task 6: 'the plan must take into consideration the right organizational structure and the human resources (“talent”) issues... Financial incentives and other means of recruiting or retaining this talent must be addressed.'"}, {"file": "India 2008/Dev Support Centre - project.pdf", "reason": "The problem statement's stated approach is to 'demonstrate and thereafter scale up interventions', supporting the Scaling tag."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Only a client-written problem statement/project proposal is available; no student final report or outcome evidence. The founder chairman, Shri Anil C Shah, is named on p.1 but in the past tense ('was the Founder Chairman'), so he is not recorded as a contact; the current Chairman Vijay Mahajan is named but no email/phone appears. The document contains a typo dating the projected income statement 'as projected through 2001' (p.4), which in context should read 2011 since funding is in place through 2011. PDF metadata CreationDate (18 Oct 2016) reflects a later conversion of the 2008 document.", "sources": [{"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.1 states 'Shri Anil C Shah a retired bureaucrat and was the Founder Chairman of the organization', past tense."}, {"file": "India 2008/Dev Support Centre - project.pdf", "reason": "p.4 reads 'Income statement (as projected through 2001)' immediately after stating on the same page that 'DSC has funding in place through 2011', indicating a typo."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/08 - 6/30/09 - KKPKP", "org": "KKPKP", "folder": "India 2008", "sheet_row": 9, "parent": "Global Social Entrepreneurship India - 7/1/08 - 6/30/09", "filled": 13, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/08 - 6/30/09 - KKPKP", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This eng distributor channels."}, {"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.10 describes the story-card product innovation, 'simple, colorful four-page reading material for early readers', priced at 4 cents per card and used by state governments in public schools."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": "Over 3 million books and 4.5 million story cards shipped in the first 51 months (through March 31, 2008); story cards sent to over 8 states; the total addressable population is described as 375 million children aged 3-14 in India.", "sources": [{"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.3 states 'Pratham Books shipped over 3 million books' and 'printed and shipped 4.5 million story cards' during its first 51 months, and p.10 adds the cards went 'to over 8 states'."}, {"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.12 states 'With a population of 375 million children in the age group of 3 to 14 years, the objective of 50,000 copies per title is miniscule.'"}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": null, "sources": []}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": null, "sources": []}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Education", "sources": [{"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.3 supports Education: the org exists to enable 'reading among children in the 3 to 14 year age group' and to fill a gap in affordable children's books, and p.10 notes its story cards 'are being used widely by State governments to promote reading in public schools'."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Children's literacy and reading promotion; affordable multilingual children's book publishing; low-cost distribution channels for books.", "sources": [{"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.3 describes the goal of 'enabling reading among children in the 3 to 14 year age group whom the existing market was not catering to' via reasonably priced books 'in a variety of Indian languages', and p.12-13 focus on new distribution channels to reach children."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "middle stage", "sources": [{"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.3 states the trust 'was set up in 2004' and had completed only 51 months of operation as of March 31, 2008, yet p.10 claims its 12,500-copy average print runs 'easily makes us the largest children’s book publisher in India' — a young (4-year-old) organization that has already reached significant scale, fitting 'middle stage'."}]}, {"name": "Project City", "header": "Project City", "value": null, "sources": []}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": null, "sources": []}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.3 states Pratham Books 'publishes children’s books in India', and the market analysis covers Indian states and cities throughout; no city or state for the organization's office is stated in either document."}]}, {"name": "Project Description", "header": "Project Description", "value": "The folder holds no explicit student problem statement or final report for this client; it contains Pratham Books' own confidential business plan and a market size analysis, both created 3 September 2008. The business plan sets three-year objectives (150 titles/year in up to ten languages, 7-10 million books shipped per year, new distribution channels) and a 'Way Forward' of new initiatives: a content portal, retailing through 'untied' agents, direct selling to schools, institutional sales, and internet sales, backed by a projected annual income statement. The market size analysis segments the Indian market by literacy, state income levels and town size, concluding with a target of roughly 10.5 million urban households and a phase-one scenario of 0.5 million new buyers (about 4 million books, Rs 100 million in sales). The engagement materials thus center on market sizing and distribution/growth strategy toward 'A book in every child's hand'.", "sources": [{"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.9 lists three-year objectives including 'Generate about 150 titles per year', 'shipping between 7-10 million books per year in the third year', and 'Establish newer and non-traditional channels of distribution', and p.12-13 detail the five 'Way Forward' initiatives (content portal, untied agents, schools, institutions, internet sales)."}, {"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.14 presents the projected 12-month income and expenditure statement (total revenue Rs 43,860,000 and net loss Rs 5,138,500 with break-even 'in about a three-year timeframe' per p.14 text)."}, {"file": "India 2008/Pratham Market Size Analysis.pdf", "reason": "p.1 frames the analysis: 'While the goal of the company is to see ‘A book in every child’s hand”, accurate selection of markets will make the task more efficient', with parameters of literacy, income distribution and town size."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Business Strategy/Revenue, Marketing, Financial Modeling, Scaling", "sources": [{"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.12-13 support Business Strategy/Revenue via the 'Way Forward' distribution-channel strategy (content portal, untied agents, schools, institutions, internet) intended to make the enterprise viable."}, {"file": "India 2008/Pratham Market Size Analysis.pdf", "reason": "p.1-6 support Marketing via the full market segmentation and target-audience selection analysis (literacy, income states, town size), as does the 'Marketing Mix' section (product, pricing, production, distribution) on pp.9-12 of the business plan."}, {"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.14 supports Financial Modeling via the projected income and expenditure statement with unit prices, quantities, costs and net profit/(loss)."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Unlike the other clients in this folder, the two Pratham documents are not framed as a 'problem statement for SOM students' — they are the client's confidential business plan and a market size analysis (both PDF-created 3 Sep 2008 by author 'kanwal' per metadata), so whether they were client-provided background or engagement outputs cannot be determined from the documents. The website URL appears parenthetically after 'Pratham' (the parent network) rather than 'Pratham Books'. The business plan index contains typos (e.g. '3.2 Key Players', 'unties agents') and its internal page numbering (to p.19) differs slightly from the 16-page PDF; page citations here use PDF pages. Sales data in Appendix 2 (p.16) shows total book sales declining 42% in 2007-2008 versus the prior year.", "sources": [{"file": "India 2008/Pratham Books Business plan.pdf", "reason": "The document is labeled 'CONFIDENTIAL' on every page and is written in the client's first person ('We anticipate...', p.13), with no mention of Yale, SOM, or student tasks anywhere."}, {"file": "India 2008/Pratham Books Business plan.pdf", "reason": "p.16 Appendix 2 sales table shows 2007-2008 total book sales of 8,918,503 with '[42%]' decline versus 2006-2007 sales of 15,462,599."}, {"file": "India 2008/Pratham Market Size Analysis.pdf", "reason": "PDF metadata records author 'kanwal' and CreationDate 3 September 2008, matching the business plan."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/08 - 6/30/09 - Seva Mandir", "org": "Seva Mandir", "folder": "India 2008", "sheet_row": 11, "parent": "Global Social Entrepreneurship India - 7/1/08 - 6/30/09", "filled": 17, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/08 - 6/30/09 - Seva Mandir", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement belongs to the fall 2008 semester (2008-09 academic year, the first GSE year): the client-side documents were prepared between March and September 2008, with the Pratham B ctivities and Services", "value": "Works in 626 villages and 56 urban settlements of Udaipur and Rajsamand districts on afforestation and pastureland development, watershed development, water harvesting and irrigation structures, agricultural extension, and 542 women's self-help groups linked to banks. It also runs 172 non-formal education centers, 165 balwadis (childcare centers), 2 referral hospitals and village health worker networks, and builds village institutions including 552 Gram Vikas Kosh (village development funds).", "sources": [{"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.1-2 detail afforestation on 10,345 ha of private and 2,755 ha of common lands, watershed work on 11,402 ha, 75 anicuts, 51 lift irrigation systems, agricultural extension (1,175 mini orchards, 2,359 vermi-compost units) and '542 women’s self help groups (SHG’s) with membership of more than 9,900 women'."}, {"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.2 states 'Seva Mandir runs 172 Non Formal Education Centers reaching out to 4581 children, 165 Balwadis with enrolment of 3,803 children and 2 referral hospitals' with 349 traditional birth attendants and 235 village health workers."}, {"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.3 describes the Village Institutions programme with 'about Rs. 30,000,000 (US $750,000) spread over 552 GVKs', 437 of them managed by elected committees."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": "626 villages and 56 urban settlements in two districts; more than 9,900 women in 542 SHGs; 4,581 children in non-formal education centers and 3,803 in balwadis; 552 village development funds.", "sources": [{"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.1 states the work area of '626 villages and 56 Urban Settlements in the Udaipur and Rajsamand districts'; p.2 gives the SHG membership ('more than 9,900 women') and education enrolment figures (4,581 and 3,803 children); p.3 counts 552 GVKs."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": null, "sources": []}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": null, "sources": []}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Community Improvement & Capacity Building, Education, Health Care, Environmental Quality Protection & Beautification", "sources": [{"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.1 and p.3 support Community Improvement & Capacity Building via the strategy 'To create and strengthen institutions for development' and the Village Institutions programme (Samuh, GVK village funds, elected village committees) that is the subject of the student project."}, {"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.2 supports Education via the 172 Non Formal Education Centers, 165 balwadis and the Education Programme working 'on increasing children’s reach to quality education'."}, {"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.2 supports Health Care via work on 'strengthening the systems for maternal and child health, supporting improved health education and primary health care', 2 referral hospitals, 349 traditional birth attendants and 235 village health workers."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Village institutions and community development funds (GVKs); natural resource development (afforestation, watershed, water harvesting); women's empowerment and SHG microfinance; tribal community development; rural health and education services.", "sources": [{"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.1-3 describe these program areas, including that the rural population served is 'primarily of tribal (68%) and other disadvantaged communities' (p.1) and that SHGs are 'linked to the formal banking channel to arrange finance for various income generating activities' (p.2)."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.2 states 'For more than two decades, Seva Mandir has been working towards the reordering of gender relations', and the organization's scale (626 villages, 552 village funds totaling about Rs 30 million, p.1 and p.3) indicates an established organization."}]}, {"name": "Project City", "header": "Project City", "value": "Udaipur", "sources": [{"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.1 locates the work in 'the Udaipur and Rajsamand districts of Rajasthan state in India'; Udaipur is the first-named district of the two."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Rajasthan", "sources": [{"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.1 states the organization works in 'the Udaipur and Rajsamand districts of Rajasthan state in India'."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.1 states the work area is in 'Rajasthan state in India'."}]}, {"name": "Project Description", "header": "Project Description", "value": "The proposed project asks the Yale/Seva Mandir student team to present options to the Seva Mandir trusteeship for increasing the financial capabilities of the 550+ village development funds (GVKs), which hold about Rs 30 million mostly in bank fixed deposits. Deliverables include a review of historical GVK amounts, uses and returns; five-year projections; a review of community-fund models elsewhere (e.g. the US community foundation sector); hypothesis-based analysis of alternative investment structures and asset allocation; a Monte Carlo sensitivity analysis of return environments; recommendations on account administration, governance processes and integration into Seva Mandir's management structure; and a PowerPoint for trustees. Options must respect villages' autonomy and low entrepreneurial skill levels. Only this problem statement exists; no final report is in the folder.", "sources": [{"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.3 frames the challenge: over 550 GVKs with close to Rs 30,000,000 whose 'economic dimension... is underdeveloped and has immense untapped potential', and p.4 states 'The Yale/Seva Mandir team will consider this problem and present options to the Seva Mandir trusteeship on means and mechanisms of increasing the financial capabilities of these GVKs.'"}, {"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.4 lists the tasks, including 'a hypothesis based analysis of alternative investment structures or programs, including appropriate asset allocation strategies', 'a sensitivity analysis (Monte Carlo Simulation) on various return environments', governance questions ('What political and group processes will be created to manage these funds'), integration into Seva Mandir's management structure, and (task 9, pp.4-5) a PowerPoint for trustees."}, {"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.5 footnote cautions that 'villagers do not have very high entrepreneurial skills', that most money 'is today held in bank fixed deposits', and that federating GVKs risks 'the individual village losing autonomy'."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Investing/Endowment, Financial Modeling, Organizational Systems and Behavior", "sources": [{"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.4 supports Investing/Endowment via the required 'analysis of alternative investment structures or programs, including appropriate asset allocation strategies' for the community funds and the comparison to 'the community foundation sector in the United States'."}, {"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.4 supports Financial Modeling via the required 'detailed projection, based on historical averages, of the gross and net amounts (including interest earned) expected to be collected over the next five year period' and the Monte Carlo sensitivity analysis."}, {"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.4 supports Organizational Systems and Behavior via tasks 7-8 on group decision-making processes for the funds and 'How can the operations of this new investment initiative best be integrated into the management structure of Seva Mandir? Will they need to new kinds of staff?'"}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Only a client-written problem statement is available (despite the filename suffix '_final', the document is a project brief, not a final report); no student deliverable or outcome evidence exists in the folder. Some figures are internally close but not identical (p.3 says 552 GVKs with 437 elected committees; p.3's challenge section rounds these to 'over 550' and 'about 400'). The document text is undated; PDF metadata CreationDate (18 Oct 2016) reflects a later conversion. Village survey data cited are from a 2002-03 MIT survey (p.1 footnote).", "sources": [{"file": "India 2008/Seva Mandir project_final.pdf", "reason": "The document contains only an NGO overview and the 'Challenge for the Yale School of Management Social Entrepreneurs Program' (p.3) with prospective tasks phrased in the future tense ('the student team members will be responsible for', p.4)."}, {"file": "India 2008/Seva Mandir project_final.pdf", "reason": "p.1 footnote 1 attributes literacy figures to 'A survey Conducted by Massachusetts Institute of Technology in 2002-03'."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/09 - 6/30/10 - ACCESS Development Services", "org": "ACCESS Development Services", "folder": "India 2009", "sheet_row": 12, "parent": "Global Social Entrepreneurship India - 7/1/09 - 6/30/10", "filled": 19, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/09 - 6/30/10 - ACCESS Development Services", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This was the Fall 2009 semester (fall 2009-10 academic year) of Yale SOM's Global Social Entrepreneurship course, with client scoping visits to Yale in September 2009, fieldwork interviews in October-November 2009, a field trip to India in early January 2010 where findings were presented to clients in person, and final reports dated January 14-15, 2010. [India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf] The Executive Summary (p.2) states the team 'presented our findings to SMS in person in January 2010, as the culminating event of the Yale School of Management (SOM) fall 2009-10 Global Social Entrepreneurship course,' after 'initial discussions in August in Ahmedabad and in September at Yale' and a Letter of Engagement dated October 1, 2009; every page footer reads '15 January 2010'."}, {"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The Scope of Work section (p.5) says 'The Yale SOM and ACCESS Teams met in September 2009 to formulate the project's scope of work,' Appendix 2 (p.33) lists interviews dated October 19 - November 3, 2009, and footnote 14 (p.20) cites a 'Meeting between Yale SOM GSE Team and ACCESS January 4 2010, ACCESS Headquarter Office in New Delhi'."}, {"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The cover page is dated January 15, 2010, the Project Approach section (p.22) says the Udyogini team came to Yale 'in late September' after summer 2009 scoping, and the Analysis section (p.22) says 'The outputs of the financial model were analyzed along with the Udyogini team in January 2010 in India'."}]}, {"name": "Parent Program", "header": "Parent Program*", "value": "Global Social Entrepreneurship India - 7/1/09 - 6/30/10", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This was the Fall 2009 semester (fall 2009-10 academic year) of Yale SOM's Global Social Entrepreneurship course, with client scoping visits to Yale in September 2009, fieldwork interviews in October-November 2009, a field trip to India in early January 2010 where findings were presented to clients in person, and final reports dated January 14-15, 2010. [India 2009/SEWA_SMS_Final_Report_2010.1.14.pdf] The Executive Summary (p.2) states the team 'presented our findings to SMS in person in January 2010, as the culminating event of the Yale School of Management (SOM) fall 2009-10 Global Social Entrepreneurship course,' after 'initial discussions in August in Ahmedabad and in September at Yale' and a Letter of Engagement dated October 1, 2009; every page footer reads '15 January 2010'."}, {"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The Scope of Work section (p.5) says 'The Yale SOM and ACCESS Teams met in September 2009 to formulate the project's scope of work,' Appendix 2 (p.33) lists interviews dated October 19 - November 3, 2009, and footnote 14 (p.20) cites a 'Meeting between Yale SOM GSE Team and ACCESS January 4 2010, ACCESS Headquarter Office in New Delhi'."}, {"file": "India 2009/GSE Udyogini Final Report 2010-01-15.pdf", "reason": "The cover page is dated January 15, 2010, the Project Approach section (p.22) says the Udyogini team came to Yale 'in late September' after summer 2009 scoping, and the Analysis section (p.22) says 'The outputs of the financial model were analyzed along with the Udyogini team in January 2010 in India'."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "ACCESS Development Services", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The 'About ACCESS' section (p.4) states 'ACCESS Development Services is registered as Not-for-Profit Section 25 company with its headquarters office in New Delhi', and the cover page titles the report 'ACCESS Development Services Yale SOM GSE Project'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "Nonprofit (Not-for-Profit Section 25 company)", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The 'About ACCESS' section (p.4) states the organization 'is registered as Not-for-Profit Section 25 company'."}]}, {"name": "Sector", "header": "Sector", "value": "Microfinance and livelihoods (technical services to microfinance institutions)", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The 'About ACCESS' section (p.4) states 'ACCESS focuses on providing fee-based technical services in the microfinance and livelihood sectors'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "ACCESS provides fee-based technical services in the microfinance and livelihood sectors, concentrating on the institutional strengthening of small (Tier II and Tier III) microfinance institutions so they can grow and access capital.", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The 'About ACCESS' section (p.4) states 'ACCESS focuses on providing fee-based technical services in the microfinance and livelihood sectors' and 'has concentrated largely on the institutional strengthening of Tier II and Tier III Microfinance Institutions'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "Provides technical assistance and capacity building to small MFIs from its New Delhi headquarters and branch offices in West Bengal, Rajasthan, Madhya Pradesh, Orissa and Andhra Pradesh. Through the ACCESS Microfinance Alliance (AmFA, established October 2007, 90 member MFIs) it delivers need-based technical services, builds relations with capital providers, and develops linkages between funders and MFIs, including an I-CAT institutional capacity assessment tool and a strategic on-lending agreement with SIDBI. It also sponsors the Microfinance India Conference.", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The 'About ACCESS' and 'About AmFA' sections (p.4-5) describe branch offices in five states and state that AmFA 'was established by ACCESS in October 2007', 'adopts a three-pronged strategy of providing need-based technical services to its members; building operational and strategic relations with major providers of capital; and developing linkages between funders and MFIs' and 'currently has 90 members'."}, {"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The Key Findings section (p.7) discusses 'Access Development's I-CAT tool', the SIDBI-ACCESS Relationship section (p.17) describes the agreement for SIDBI to provide up to Rs. 100 Crores of on-lending to AmFA members with ACCESS providing capacity building, and the Background section (p.3) notes the 'Microfinance India Conference, sponsored by ACCESS'."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": "90 member microfinance institutions in the AmFA network (Tier II/III MFIs, which collectively represent 98% of Indian MFI organizations serving 30% of clients)", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The 'About AmFA' section (p.5) states 'AmFA currently has 90 members', and the Introduction (p.4) notes 'Tier 2 & 3: 98% of organizations; 30% of clients'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Vipin Sharma", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The cover page (p.1) lists the 'Access Team' as 'Vipin Sharma, Suryamani Roul, Sudipto Saha', with Vipin Sharma listed first."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Suryamani Roul", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The cover page (p.1) lists 'Suryamani Roul' as the second member of the 'Access Team'."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Community Improvement & Capacity Building", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "Chosen as the closest category (the match is approximate since no category covers microfinance directly) because the 'About ACCESS' section (p.4) describes the organization's core work as 'institutional strengthening' and capacity building of small microfinance institutions serving the poor."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Microfinance sector development; technical assistance and capacity building for Tier II/III MFIs; access to debt capital and bank linkages for small MFIs; MFI network building (AmFA)", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The Problem Statement (p.5) frames the work around 'How can more debt capital be attracted to AmFA's Tier II/III MFIs?', and the About sections (p.4-5) describe technical services, capacity building and the AmFA network."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "middle stage", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The Revolving Loan Fund section (p.17) shows the organization is only a few years old (ACCESS 'grew out of' a DFID/CARE program and the Indian government's international funding restrictions on companies 'in the first years of incorporation' will only be over in 2010), yet the 'About ACCESS' and 'About AmFA' sections (p.4-5) show it already operates a national footprint with a headquarters, five state branch offices and a 90-member alliance - beyond early stage but not a long-established institution."}]}, {"name": "Project City", "header": "Project City", "value": "New Delhi", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The 'About ACCESS' section (p.4) states the headquarters office is in New Delhi, and footnote 14 (p.20) records the joint prioritization meeting at the 'ACCESS Headquarter Office in New Delhi'."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Delhi", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The headquarters and January 2010 project meetings are placed in New Delhi ('About ACCESS' p.4; footnote 14, p.20), i.e., the Delhi National Capital Territory."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The report throughout concerns the Indian microfinance sector and the headquarters in New Delhi, India (p.4; footnote 2, p.3 refers to 'the ACCESS office in New Delhi, India')."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale team addressed the question of how more bank debt capital can be attracted to the small Tier II/III MFIs in ACCESS's AmFA network. Using an online survey of funders, sixteen interviews with lenders, MFIs and industry experts, primary data analysis and secondary research, the team tested risk-reduction levers (ratings, financial instruments, operational capacity, network aggregation). The final paper delivers nine recommendations, jointly prioritized with ACCESS in New Delhi in January 2010 into four priority actions: align bank engagements with the Priority Sector Lending schedule, map the I-CAT tool and technical assistance against bank needs, use the Revolving Loan Fund to provide partial guarantees, and expand SIDBI-bank partnerships.", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The Executive Summary (p.2) states the team 'sought to address the question: How can more debt capital be attracted to small MFIs?' and lists the four highest-priority recommendations."}, {"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The Methodology section (p.6) describes the online survey, sixteen interviews, primary data analysis and secondary research, and the Priority Recommendations section (p.20-21) describes mapping the nine recommendations with the ACCESS team on January 4, 2010 into an impact/effort matrix yielding the four priority activities."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Business Strategy/Revenue", "sources": [{"file": "India 2009/Access Development - Paper FINAL.pdf", "reason": "The deliverable is a strategy paper of nine prioritized recommendations for increasing the flow of bank debt funding to AmFA member MFIs (Executive Summary p.2 and Priority Recommendations and Action Plan p.20-21), i.e., organizational/funding strategy rather than a financial model or marketing deliverable."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "
