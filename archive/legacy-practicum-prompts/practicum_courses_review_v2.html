2007", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The Executive Summary calls RUDI 'a social enterprise based in Gujarat, India', and the Introduction states 'In 2007, The RUDI Multi Trading Company was established as a separate organization' after growing from a SEWA pilot project."}]}, {"name": "Sector", "header": "Sector", "value": "Rural retail — processing and distribution of rural agricultural products", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The Executive Summary states RUDI 'focuses on the processing and distribution of rural agricultural products', and Appendix A describes its Rural Distribution Network selling agricultural and daily household products."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "'The idea of setting up the Rural Distribution Network is to internally rotate the scarce funds of the rural producers in a way that fetches maximum benefit and brings about positive changes in their lives and to provide multi-user facilities, reduce incidental expenses and build-up an integrated value chain in order to enhance the efficiency of agricultural activities, to reduce the hardships of the producers, processors and to create multiple employment opportunities and an efficient supply of agro-products to rural members.' A significant goal is enhancing rural women's quality of life through full employment.", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "Appendix A quotes the mission statement verbatim under the heading 'MISSION'."}, {"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The Executive Summary states 'A significant goal of RUDI is to enhance the quality of life for rural women by building opportunities for full employment', following the Gandhian philosophy of 'Gram Swaraj' or village self-reliance."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "RUDI brands, markets and sells agricultural and household products produced by SEWA member farmers: SEWA District Associations buy produce from farmers at market rates, clean and package it under the RUDI name in processing centers, and RUDI sells through four channels — door-to-door sales by rural saleswomen ('RUDIbens', 83% of 2010 sales), rural institutional sales, urban distributors, and urban supermarkets (e.g., Star Bazaar, Reliance Fresh).", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "Appendix A ('IMPACTING THE ENTIRE SUPPLY CHAIN') details the four-step supply chain from SEWA farmers through processing centers to RUDI-branded sales."}, {"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The Introduction to RUDI section contains a table of the four distribution channels with their 2010 sales shares (RUDIben 83%, rural institutional 5%, urban distributors 9%, urban institutional 4%)."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": "1,200 RUDIbens (saleswomen) earning average monthly incomes of Rs. 1,500-3,000, across 1,600 villages, with 2,500 farmers covered; parent SEWA has over 1.5 million members.", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "Appendix A ('IMPACT') lists 'Number of RUDIbens - 1200', 'Number of villages (current and over time) - 1600', 'Total number of farmers covered - 2500', and 'Average monthly income of Rudibens - Rs.1500-3000'."}, {"file": "India 2010/RUDI_final_report - 21.docx", "reason": "Appendix A ('HISTORY AND THE SEWA NETWORK') states 'SEWA has over 1.5 million members'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Reema Nanavaty", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The title page lists the 'RUDI team: Reema Nanavaty, Uma Swaminathan and Sandeep Patankar' as the client-side counterparts."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Uma Swaminathan", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The title page lists the 'RUDI team: Reema Nanavaty, Uma Swaminathan and Sandeep Patankar' as the client-side counterparts."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Employment, Food Agriculture & Nutrition", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "Employment: RUDI's stated goal is 'to create a future for women in rural areas of Gujarat by providing them ample opportunity for earning their livelihood' and full employment for RUDIbens (Introduction to RUDI and Executive Summary)."}, {"file": "India 2010/RUDI_final_report - 21.docx", "reason": "Food Agriculture & Nutrition: the enterprise processes and distributes agricultural products, aims 'to replace agricultural middlemen and offer better payment to farmers through fair dealings', and builds 'an integrated value chain and efficient supply of agro-products to rural members'."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Rural women's livelihoods and empowerment; agricultural value-chain development (processing, branding, distribution); fair payment to smallholder farmers; village self-reliance (Gram Swaraj)", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The Executive Summary and Introduction describe employment for rural women, replacing agricultural middlemen, the Gandhian 'Gram Swaraj' philosophy, and the survey findings on RUDIbens' increased confidence, household status, and children's education."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "middle stage", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The Core Challenges section notes RUDI is 'After six years of growth' (pilot started December 8, 2004; incorporated 2007) and Appendix A's vision still targets 'Achieve profitability in the first year and achieve a sales turnover of Rupees 15 crores within the first five years' and establishing RUDI 'as a national brand over a period of next 10 years' — a growing but not yet mature/profitable organization."}]}, {"name": "Project City", "header": "Project City", "value": null, "sources": []}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Gujarat", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The Executive Summary states 'RUDI is a social enterprise based in Gujarat, India', and Appendix A states RUDI will ultimately expand 'into all 11 districts of Gujarat where SEWA is based'."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The Executive Summary states RUDI is 'based in Gujarat, India'."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale SOM team evaluated RUDI's proposed multi-level marketing (MLM) strategy for growing its RUDIben rural sales force. The team conducted primary research (a focus group and a 15-question survey administered to 37 RUDIbens), secondary research on comparable social enterprises (VisionSpring, Amul, Aharam, LivingGoods), and built a spreadsheet-based business planning tool integrating financial and social metrics. Model scenarios showed MLM profits would lag the base scenario until roughly year 5, and surveys revealed RUDIben fears of cannibalization and lack of MLM knowledge; the team therefore recommended RUDI pursue non-MLM growth — recruiting through the SEWA network, improving key sales metrics (visits, conversion ratio, sale size), continuing RUDIben-innovated 'route marketing' — and build out comprehensive social metrics across the value chain.", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The Executive Summary states RUDI 'engaged Yale SOM to evaluate a proposed structure and make recommendations for implementation' of MLM, and describes the business planning tool integrating social and financial metrics."}, {"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The Methodology section describes the focus group and survey of 37 RUDIbens; Key Findings tables show MLM profit differentials by year; the Recommendations section states 'We propose that RUDI pursue non-MLM strategies' and details the social metrics recommendations."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Marketing, Financial Modeling, Impact Assessment, Business Strategy/Revenue", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "Marketing: the report is titled 'An Evaluation of RUDI's Multi-Level Marketing Strategy' and analyzes sales/marketing schemes including MLM and route marketing."}, {"file": "India 2010/RUDI_final_report - 21.docx", "reason": "Financial Modeling: the team 'created a financial model to support and inform RUDI's strategic decision-making' (Business Planning Tool section) with scenario analysis in Appendix H."}, {"file": "India 2010/RUDI_final_report - 21.docx", "reason": "Impact Assessment: the team identified and quantified social metrics (operational metrics, RUDIben survey outcome metrics, proposed engagement survey and Grameen Progress out of Poverty Index in Appendices C and G)."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "RUDI grew from a pilot project of the Self-Employed Women's Association (SEWA, founded by Ela Bhatt, 1.5+ million members) initiated December 8, 2004 and incorporated in 2007. A third RUDI team member, Sandeep Patankar, supplied internal data ('RUDIbens.xls'), and a Morgan Stanley partner, Nitasha Singh, is listed on the title page. During the project RUDIbens themselves innovated cooperative one-day village sales events that RUDI calls 'Route Marketing'.", "sources": [{"file": "India 2010/RUDI_final_report - 21.docx", "reason": "The title page lists the RUDI team and 'Morgan Stanley Partner: Nitasha Singh'; the Introduction and Appendix A describe the SEWA pilot origin (December 8, 2004) and 2007 incorporation; Appendix B's input table cites 'RUDI internal document: RUDIbens.xls provided by Sandeep Patankar'; the Multi-Level Marketing section describes the Route Marketing innovation."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11 - Micro Home Solutions (mHS)", "org": "Micro Home Solutions (mHS)", "folder": "India 2010", "sheet_row": 20, "parent": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11", "filled": 17, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11 - Micro Home Solutions (mHS)", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement corresponds to the Fall 2010 semester of Yale SOM's Global Social Entrepreneurship (GSE) course, with joint planning meetings in New Haven in September 2010, student field visits to India in October 2010, and final client deliverables dated December 2010 through 21 January 2011. [India 2010/TEIL Marketing Plan Final 011611.docx] The title page reads 'Global Social Entrepreneurship / Fall 2010' and every page footer reads 'TEIL Marketing Plan, December 2010'."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Appendix T is Rohit Makhija's day-by-day travel journal of the team site visit to Kerala and Tamil Nadu on October 17-22, 2010."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The title page is dated '21 January 2011'."}]}, {"name": "Parent Program", "header": "Parent Program*", "value": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement corresponds to the Fall 2010 semester of Yale SOM's Global Social Entrepreneurship (GSE) course, with joint planning meetings in New Haven in September 2010, student field visits to India in October 2010, and final client deliverables dated December 2010 through 21 January 2011. [India 2010/TEIL Marketing Plan Final 011611.docx] The title page reads 'Global Social Entrepreneurship / Fall 2010' and every page footer reads 'TEIL Marketing Plan, December 2010'."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Appendix T is Rohit Makhija's day-by-day travel journal of the team site visit to Kerala and Tamil Nadu on October 17-22, 2010."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The title page is dated '21 January 2011'."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "Micro Home Solutions (mHS)", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The title page heading reads 'Micro Home Solutions' and the Executive Summary states 'Micro Home Solutions (mHS) is a multi disciplinary social enterprise based out of New Delhi, India.'"}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "Multi-disciplinary social enterprise", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Executive Summary states 'Micro Home Solutions (mHS) is a multi disciplinary social enterprise based out of New Delhi, India.'"}]}, {"name": "Sector", "header": "Sector", "value": "Affordable housing / low-income urban housing design services", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Executive Summary states the organization's objective 'is to provide economically viable housing solutions for under-served populations', and the Background section describes work on affordable urban housing and homeless shelters."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "mHS's objective is to bring low-cost, high-quality housing opportunities to the urban poor on suitable financial terms, and to introduce sustainable home design — providing economically viable housing solutions for under-served populations.", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Background section states verbatim: 'mHS's objective is to bring low cost, high quality housing opportunities to the urban poor on suitable financial terms, and to introduce sustainable home design.'"}, {"file": "India 2010/mHS GSE Report.docx", "reason": "The Executive Summary states 'The organization's objective is to provide economically viable housing solutions for under-served populations.'"}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "mHS works with government to influence housing policy; brings innovative design and building practices to temporary and permanent homeless shelters in Delhi; and provides Design Home Solutions (DHS), a fee-based technical assistance product (audit and cost estimate, architectural design, and periodic construction oversight) for low-income households, bundled with home-improvement microloans from MFI partner BASIX.", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Background section lists mHS's three current engagements (policy work, homeless shelter design, and the fee-based DHS product)."}, {"file": "India 2010/mHS GSE Report.docx", "reason": "'The Product: DHS' section states 'DHS consists of an audit and cost estimate, architectural design, and periodic construction oversight' and 'DHS is complementary to and bundled with home loans sold by BASIX.'"}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": "The April 2010 DHS pilot in Mangolpuri aimed to deliver the service to 20 households; of 46 prospective clients examined, 3 became DHS clients, and mHS had 9 clients at the time of the analysis.", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Background section states the pilot goal 'was to deliver DHS to 20 households in Mangolpuri, Delhi'; the Communications section traces 46 prospective clients down to '3 people that actually became clients of DHS'; the Breakeven analysis takes 'as a starting point 9 clients than mHS currently has'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": null, "sources": []}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": null, "sources": []}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Housing & Shelter", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The organization's entire mission and product concern housing for the urban poor — 'low cost, high quality housing opportunities to the urban poor' and 'innovative design and building practices for temporary and permanent homeless shelters in Delhi' (Background section)."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Slum/resettlement-colony housing upgrading; self-help housing safety and structural quality (earthquake resistance); housing microfinance technical assistance; homeless shelter design; mason training", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Product Background section describes self-help housing structural deficiencies and mason training goals; the Background section describes the Mangolpuri resettlement colony pilot with MFI BASIX and homeless shelter design work."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "early stage", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Measurement section refers to 'the start-up nature of mHS', and the Background section describes DHS's initial proof-of-concept pilot launched only in April 2010 with a goal of 20 households."}]}, {"name": "Project City", "header": "Project City", "value": "New Delhi", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Executive Summary states mHS is 'based out of New Delhi, India' and that the analysis 'is based on data from the program's initial pilot in Mangolpuri, a resettlement colony outside New Delhi.'"}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Delhi", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Background section states the pilot delivered DHS to households 'in Mangolpuri, Delhi', and mHS's shelter work is 'in Delhi'."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Executive Summary states mHS is 'based out of New Delhi, India'."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale GSE team evaluated the viability of mHS's Design Home Solutions (DHS) product using data from its Mangolpuri pilot, building a decision-tree analysis of the customer funnel (46 prospects to 3 clients) and a four-module financial model with profitability-by-customer-type and breakeven analysis. Recommendations covered communication strategy (refine the target segment, train MFI staff, create a product pamphlet, improve retention), partnerships (a preferred masons list, cement companies, government/large employers, insurance companies such as Aviva India), fee structure (unbundled 'basket of services' and fee amortization options), and ongoing measurement. The team concluded DHS could be financially sustainable, breaking even within about 9 months under its recommendations (29 clients/month needed in the aggressive scenario).", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Executive Summary states 'This report evaluates the viability and presents recommendations for improving mHS's product, Design Home Solutions (DHS)' and that with the recommendations 'it could break even within 9 months'."}, {"file": "India 2010/mHS GSE Report.docx", "reason": "The Recommendations section is organized under 'Communication strategy', 'Partnerships', 'Fee structure' and 'Measurement'; the Financial Model and Analysis section details profitability by customer types A/B/C and the breakeven scenarios (29 clients per month, aggressive scenario); Appendices A and B document the decision tree and the four-module financial model."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue, Marketing", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "Financial Modeling: the team 'developed a financial model to better understand the financial sustainability of the business' (four modules detailed in Appendix B) with breakeven and profitability-by-customer-type analysis."}, {"file": "India 2010/mHS GSE Report.docx", "reason": "Business Strategy/Revenue: recommendations on fee structure, product unbundling, partnerships and customer targeting aim at 'increasing revenue per homeowner, decreasing cost per homeowner, and increasing the number of customers'."}, {"file": "India 2010/mHS GSE Report.docx", "reason": "Marketing (approximate match): the 'Communication Strategy' recommendations — refining the target customer segment, product pamphlets, improving conversion and retention — are customer-acquisition/marketing work."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "The DHS pilot operated in partnership with BASIX (an Indian MFI providing bundled 5-year housing loans of Rs. 200,000-300,000 at ~20% interest) and BALIGA Trust (a local community NGO); Habitat for Humanity's MicroBuild Fund is noted as an emerging competitor. The DHS fee is 3% of construction cost; loan eligibility was restricted to government employees.", "sources": [{"file": "India 2010/mHS GSE Report.docx", "reason": "The Background and Evaluation sections describe the partnership with 'a micro-finance institution, BASIX and a local NGO (BALIGA Trust)', the loan terms, the 3% DHS fee, and the government-employee eligibility criterion; the Context section describes Habitat for Humanity's MicroBuild Fund as an emerging competitor."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11 - Tea Estates India Limited (TEIL)", "org": "Tea Estates India Limited (TEIL)", "folder": "India 2010", "sheet_row": 21, "parent": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11", "filled": 23, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11 - Tea Estates India Limited (TEIL)", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement corresponds to the Fall 2010 semester of Yale SOM's Global Social Entrepreneurship (GSE) course, with joint planning meetings in New Haven in September 2010, student field visits to India in October 2010, and final client deliverables dated December 2010 through 21 January 2011. [India 2010/TEIL Marketing Plan Final 011611.docx] The title page reads 'Global Social Entrepreneurship / Fall 2010' and every page footer reads 'TEIL Marketing Plan, December 2010'."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Appendix T is Rohit Makhija's day-by-day travel journal of the team site visit to Kerala and Tamil Nadu on October 17-22, 2010."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The title page is dated '21 January 2011'."}]}, {"name": "Parent Program", "header": "Parent Program*", "value": "Global Social Entrepreneurship India - 7/1/10 - 6/30/11", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement corresponds to the Fall 2010 semester of Yale SOM's Global Social Entrepreneurship (GSE) course, with joint planning meetings in New Haven in September 2010, student field visits to India in October 2010, and final client deliverables dated December 2010 through 21 January 2011. [India 2010/TEIL Marketing Plan Final 011611.docx] The title page reads 'Global Social Entrepreneurship / Fall 2010' and every page footer reads 'TEIL Marketing Plan, December 2010'."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Appendix T is Rohit Makhija's day-by-day travel journal of the team site visit to Kerala and Tamil Nadu on October 17-22, 2010."}, {"file": "India 2010/ARTI Final Paper FINAL.docx", "reason": "The title page is dated '21 January 2011'."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "Tea Estates India Limited (TEIL)", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary states 'This tourism endeavor falls under the Tea Estates India Limited (TEIL) business', and Appendix I (Letter of Engagement) is headed 'Woodbriar Group/Tea Estates India Limited: Shuba Chandran'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": "www.woodbriargroup.com (parent Woodbriar Group); www.teabungalows.com (TEIL tea bungalows)", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary opens 'The Woodbriar Group (www.woodbriargroup.com) is a successful for-profit enterprise' and later instructs 'the company must start by reviewing www.teabungalows.com and develop this into a strong, simple, visitor and tour operator-friendly website.'"}]}, {"name": "Org Type", "header": "Org Type", "value": "For-profit social enterprise (a business of the for-profit Woodbriar Group with explicit social and environmental objectives)", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary describes Woodbriar as 'a successful for-profit enterprise' with a track record 'for being able to establish a socially-minded, yet profitable, enterprise', and Appendix K notes the team asked whether 'the nature of the project change[s] based on the fact that this is a for-profit enterprise'."}]}, {"name": "Sector", "header": "Sector", "value": "Tea plantations and ecotourism/hospitality", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary describes Woodbriar as 'the largest private tea producer in the country' and TEIL's aim 'to develop a best practice ecotourism/adventure travel experience'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "Woodbriar revitalized the South Indian tea industry to provide sustainable incomes and social services (schools, day care, healthcare clinics) to local citizens; TEIL's ecotourism mission is to create local employment and education opportunities around the region's natural and cultural assets while generating positive social and environmental impacts (a triple-bottom-line endeavor).", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary states Woodbriar 'has revitalized the tea industry in the area, with the purpose of providing sustainable incomes and social services to local citizens' and that TEIL 'aims to develop a best practice ecotourism/adventure travel experience that fits its mission, creating both local employment and education opportunities', calling it 'truly a triple-bottom-line endeavor'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "The parent Woodbriar Group operates tea plantations covering 23,000 acres across the Western Ghats (with tea factories, worker housing, schools and medical facilities) and complies with the Plantations Labour Act. TEIL is restoring colonial-era plantation bungalows in Munnar (Kerala), Valparai, Meghamalai and the Nilgiri Hills (Tamil Nadu) as ecotourism accommodations offering plantation and tea-factory tours, wildlife treks, and cultural experiences.", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Company Analysis section states 'The TEIL tea plantations cover 23,000 acres of land across the Western Ghats in South India' and describes bungalows being restored as tourism destinations; the Executive Summary describes the labour-act compliance and social services."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Appendix I lists the bungalow site locations (Munnar, Kerala; Valparai, Meghamalai and Nilgiri Hills, Tamil Nadu); Appendix D's sample itinerary details plantation/factory tours, treks and cultural programs."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": "Woodbriar Group employs 11,000; the TEIL tourism operation has one manager, one sales executive, and 2-5 staff at each bungalow", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary states 'the company employs 11,000 individuals, most of whom are women', and the Company Analysis Staff subsection states 'The current team consists of one manager, Suresh Babu, and a Sales Executive, Mrs. Parameshwari. In addition, there is a staff of 2 to 5 at each bungalow.'"}]}, {"name": "People Served", "header": "How many people do you serve?", "value": "11,000 employees (mostly women) of the parent Woodbriar Group, plus their families served by plantation schools, day care and healthcare clinics; the tourism pilot (Talayar, Munnar) is a 4-room bungalow currently at ~33% occupancy, with projected staffing growing from 8 to 12 employees.", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary cites 11,000 employees and the schools/day care/healthcare programs for employees' families; the Action Plan describes 'Talayar, the 4-room bungalow in Munnar'; Appendix H footnotes state 'Current occupancy rate ~33%' and the Financial Summary projects employment growing 'from eight employees in Year 1, to 12 employees in Year 6'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Shuba Chandran", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Appendix I (Letter of Engagement) is headed 'Woodbriar Group/Tea Estates India Limited: Shuba Chandran' and states 'The Yale team will sustain communication with the TEIL team via a weekly meeting with Shuba Chandran.'"}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": "CEO", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary cites 'CEO Shuba Chandran's personal reputation as a renowned, successful social entrepreneur and Yale World Fellow'."}]}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Suresh Babu", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Company Analysis Staff subsection names 'one manager, Suresh Babu', and a footnote cites an 'Interview with TEIL Sales Executive Suresh Babu' as a data source."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": "Manager (also referred to as TEIL Sales Executive in a footnote)", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The body text calls Suresh Babu the 'manager' of the current team, while a footnote sourcing market data reads 'Interview with TEIL Sales Executive Suresh Babu'."}]}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Employment, Environmental Quality Protection & Beautification", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Employment: the venture's stated purpose is 'creating new avenues for rural livelihoods by both increasing employment opportunities and providing higher incomes', and impact metrics track increases in local employment and job quality."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Environmental Quality Protection & Beautification (approximate match for conservation/ecotourism): the company 'has currently set aside dozens of acres of protected forest, and is seeking ways to promote conservation efforts and defend wildlife and animal sanctuaries in the area', and the plan centers on eco-friendly operations and wildlife preservation."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Ecotourism and sustainable tourism standards (eco-certification, LEED); wildlife and forest conservation; rural livelihoods and skills training for tea plantation workers (especially women); cultural/heritage preservation; locally-grown organic food sourcing", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary lists the key issues as 'Improved quality of life measures for local staff and their communities; Wildlife preservation and environmental stewardship; Cultural integrity and protecting historic context', and the recommendations cover eco-certification (Appendix C), LEED upgrades, organic farm-to-table food and staff training."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The parent organization is described as 'the largest private tea producer in the country' employing 11,000 people with 23,000 acres of plantations — an established enterprise — although the ecotourism line itself is nascent (a 4-room pilot bungalow at ~33% occupancy with 'limited scale of TEIL's current operations' per the Action Plan)."}]}, {"name": "Project City", "header": "Project City", "value": "Munnar", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary states 'This document is largely focused on the first of the properties to be renovated, Talayar Bungalow in Munnar', and the Action Plan recommends first building out 'Talayar, the 4-room bungalow in Munnar'."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Kerala", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Appendix I lists the sites as 'Munnar, Kerala; Valparai, Tamil Nadu; Meghamalai, Tamil Nadu; Nilgiri Hills, Tamil Nadu', and the Market Analysis uses Kerala tourism statistics."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary describes plantations 'in the states of Kerala and Tamil Nadu in southern India'."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale GSE team produced a marketing plan for TEIL's ecotourism business, focused on the Talayar Bungalow pilot in Munnar. Based on market, competitor, customer and company (SWOT) analyses — including an October 2010 site visit and interviews with tour operators, Morgan Stanley CSR staff and Yale professors — the team evaluated seven customer profiles and recommended targeting Western eco/adventure travelers via niche tour operators and a rebuilt website. The plan covers a '6 P' marketing strategy (product, price, promotion, place, people, planet), recommends raising nightly rates to Rs. 8,500 (monsoon)/Rs. 9,500 (peak), defines social/environmental impact metrics, models a ~7-year payback on Rs. 24.6 million of luxury/LEED and eco upgrades, and proposes a two-step rollout: pilot at Talayar, then expansion and third-party eco-certification across all TEIL bungalows.", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Executive Summary and Marketing Strategy sections describe the target Western Eco and Adventure traveler segment, tour-operator and website channels, and the additional 'people and planet' P's; Appendix A documents the seven customer profiles considered."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "The Financial Summary states 'we calculate the payback period associated with the luxury and eco-friendly upgrades to equal roughly seven years' with Rs. 24,000,000 in LEED/luxury upgrades plus Rs. 600,000 eco upgrades, and the Action Plan lays out the two-step Talayar-first rollout; Appendix T documents the October 17-22, 2010 site visit."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Marketing, Business Strategy/Revenue, Financial Modeling", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Marketing: the deliverable is titled 'TEIL Marketing Plan' and centers on customer segmentation, pricing, promotion, branding and channel (tour operator/website) strategy."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Business Strategy/Revenue: the plan defines the ecotourism business model, product mix, competitive positioning, occupancy/pricing targets and the phased expansion roadmap for building 'a profit center' from tourism operations."}, {"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Financial Modeling: Appendix H contains financial projections (referencing a separate editable model) and the Financial Summary presents a discounted payback analysis with occupancy, rate, staffing and capex assumptions."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "TEIL is the tourism arm of the Woodbriar Group, India's largest private tea producer; CEO Shuba Chandran is a Yale World Fellow. Morgan Stanley's Suswar Ganu (Mumbai CSR team) provided monthly check-ins, and UK tour operator Trans Indus currently books TEIL reservations. The file name date (011611) indicates final delivery on January 16, 2011, while the footer is dated December 2010. The document also records guest reviews of the Talayar bungalow (Appendix E) evidencing an already-operating homestay business prior to the eco upgrade.", "sources": [{"file": "India 2010/TEIL Marketing Plan Final 011611.docx", "reason": "Appendix I states 'the team will conduct monthly check-ins with Suswar Ganu at Morgan Stanley' and identifies 'Trans Indus (www.transindus.co.uk)... the agent that currently books TEIL reservations'; the Executive Summary notes Shuba Chandran is a 'Yale World Fellow'; Appendix E contains 32 guest reviews of the Munnar Talayar Valley Bungalow; the footer reads 'TEIL Marketing Plan, December 2010'."}]}]}, {"pid": "Global Social Entrepreneurship India - 7/1/11 - 6/30/12 - Anudip Foundation", "org": "Anudip Foundation", "folder": "India 2011", "sheet_row": 22, "parent": "Global Social Entrepreneurship India - 7/1/11 - 6/30/12", "filled": 14, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/11 - 6/30/12 - Anudip Foundation", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement belongs to the Fall 2011 semester of Yale SOM's Global Social Entrepreneurship course, with client work running from August 2011 through January 2012 and final deliverables dated and presented in India in January 2012. [India 2011/SEWA Macro Team_Final Report_v17.pdf] p.5 states the engagements 'were undertaken as part of the Fall Global Social Entrepreneurship (GSE) course' and that stu nuary in Kolkata', and the filename date 1-20-2012 matches January 2012 delivery."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "Anudip Foundation", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.4 (Introduction/Background) names the client as 'Anudip Foundation', 'an Indian social enterprise that uses IT to empower rural marginalized youth and women to secure livelihoods'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "Hybrid social enterprise: nonprofit foundation (Anudip/MAST) with a for-profit BPO spin-off (MERITEK)", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.4 states 'Anudip will spin-off a for-profit company called MERITEK... The Anudip Foundation will remain a non-profit; however, it shall own an equity stake in MERITEK'."}, {"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3 describes 'an integrated business model in which it provides training through its nonprofit MAST centers, and then employs its graduates in the for-profit MERITEK centers'."}]}, {"name": "Sector", "header": "Sector", "value": "IT skills training and rural/impact business process outsourcing (BPO)", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3 describes Anudip's market aligned skills training program (MAST) and its 'smartsourcing' MERITEK centers 'offering a variety of business process outsourcing (BPO) functions'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "Anudip's mission is to generate sustainable livelihoods for underserved women and youth through its market aligned skills training program (MAST); its vision is to enhance livelihoods in India's rural communities through education and delivery of information technology.", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3 (Executive Summary) states 'Anudip's vision is to enhance livelihoods in India's rural communities through education and delivery of information technology. Anudip's mission is to generate sustainable livelihoods for underserved women and youth through its market aligned skills training program (MAST)'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "Anudip runs nonprofit MAST centers that train rural marginalized women and youth in IT skills, and employs graduates in for-profit MERITEK 'smartsourcing' centers in peri-urban areas that perform business process outsourcing work; MERITEK's equity distribution in turn subsidizes the MAST training centers.", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3 explains that to provide jobs for MAST graduates 'Anudip has established smartsourcing centers (MERITEK) in peri-urban (or semi-rural) areas, offering a variety of business process outsourcing (BPO) functions', with MERITEK funding the MAST centers through an equity distribution."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": null, "sources": [], "rev": {"status": "cleared", "note": "QA ⚠️ accepted: center counts are operational proxies, not people served; the proxy text moved to Notes with its citation."}}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": null, "sources": []}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": null, "sources": []}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Employment, Education", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3 says the mission is 'to generate sustainable livelihoods for underserved women and youth', i.e., job creation and employment through BPO work — closest category is Employment."}, {"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3 describes the 'market aligned skills training program (MAST)' delivering IT training to rural women and youth, which fits the Education category (vocational/skills training is an approximate match)."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "IT/vocational skills training for rural women and youth; rural BPO ('smartsourcing') job creation; livelihood generation in eastern rural and semi-urban India", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3-4 describe MAST IT training, MERITEK smartsourcing BPO employment for graduates, and expansion 'throughout parts of eastern rural and semi-urban India'."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "middle stage", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3 shows an operational but still-scaling organization with 24 existing centers planning to grow to 106 in four years, and p.4 notes the for-profit MERITEK spin-off is still being established — beyond early stage but not yet an established institution (judgment based on this evidence; no founding year stated)."}]}, {"name": "Project City", "header": "Project City", "value": null, "sources": []}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": null, "sources": []}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.4 identifies Anudip Foundation as 'an Indian social enterprise' operating and expanding 'throughout parts of eastern rural and semi-urban India' (no specific city or state is named in the extractable text)."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale GSE team assessed U.S. market opportunities for project-services (BPO) revenue for Anudip's for-profit MERITEK arm over the next five years, conducting more than 40 interviews plus secondary research across seven industry verticals (university libraries, nonprofits, healthcare, tax and accounting, publishing, film/video production, construction). Deliverables were a written report with a competitor landscape, vertical-by-vertical opportunity analysis, and marketing and business-model recommendations. Key recommendations: pursue libraries, publishing, construction, film/TV and accounting in the short term and full-service accounting and healthcare in the long term; position on cost, quality, customizability and low operator turnover rather than social mission; build an Indian anchor client base, take BPO subcontracting/build-operate-transfer work, and increase skilled hires to about 30%.", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3 (Executive Summary) states the team 'worked with Anudip to assess MERITEK's project services revenue opportunities in the U.S. market in the next five years' and lists the recommended short-term and long-term industries."}, {"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.5 (Methodology) documents 'more than 40 in-person and telephone interviews' with competitors, clients, funders and U.S. industry contacts."}, {"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "pp.45-47 contain the Marketing Recommendations (position on cost/quality rather than social mission) and Business Model Recommendations (subcontracting, Indian anchor clients, ~30% skilled hires)."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Business Strategy/Revenue, Marketing, Scaling", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3 frames the project around identifying new U.S. revenue opportunities and how the business model can 'evolve for continued success' — Business Strategy/Revenue."}, {"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "pp.4-5 and p.45 show a marketing-plan scope (value proposition, positioning, branding, customer segmentation) and explicit 'Marketing Recommendations' — Marketing."}, {"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3 ties the work to Anudip's plan to scale from 24 to 106 centers, and pp.46-47 give recommendations for how to grow ('as they scale') — Scaling."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Appendices 1-3 of the report (including the 'List of Interviews' on p.50) appear to be images/embedded objects with no extractable text, so contact names and interview details there could not be captured. Founder-level names are not given; p.45 quotes a supporter saying 'When Radha asks you to do something, you do it!' about the senior management team, but no full name, title, or contact details appear in the extractable text. People Served left blank: no current beneficiary count is stated in [India 2011/Anudip Cumulative Final Report v7.pdf]; the report gives an operational proxy only — p.3: Anudip currently operates 24 total centers (MAST and MERITEK) and plans to grow to 106 centers in the next four years.", "sources": [{"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "pp.48-50 (Appendix 1, Appendix 2, Appendix 3 - List of Interviews) yield no body text under pdftotext, indicating image-based content."}, {"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.45 contains the quote referencing 'Radha' with no surname or title."}, {"file": "India 2011/Anudip Cumulative Final Report v7.pdf", "reason": "p.3 center counts (24 total centers, growing to 106) — operational proxy moved here from People Served in the 2026-08-02 QA revision."}], "rev": {"status": "revised", "note": "Appended in v2: People Served proxy text (center counts) moved here from the People Served field."}}]}, {"pid": "Global Social Entrepreneurship India - 7/1/11 - 6/30/12 - ONergy", "org": "ONergy", "folder": "India 2011", "sheet_row": 23, "parent": "Global Social Entrepreneurship India - 7/1/11 - 6/30/12", "filled": 20, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/11 - 6/30/12 - ONergy", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from document dates). Timing evidence: This engagement belongs to the Fall 2011 semester of Yale SOM's Global Social Entreprene nd the methodology timeline (p.8) runs from August 17, 2011 to January 6, 2012, ending with a 'Macro team trip to India to meet with SEWA representatives and present findings'."}, {"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.8 states 'The student team will present and submit its findings in January in Kolkata', and the filename date 1-20-2012 matches January 2012 delivery."}]}, {"name": "Organization", "header": "Organization Applying/Participating*", "value": "ONergy", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "The cover page (p.1) titles the report 'GSE India - ONergy', and p.4 describes ONergy's company history and states 'SwitchON is ONergy's nonprofit arm'."}]}, {"name": "Organization Website", "header": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "For-profit social enterprise (renewable energy company) with a nonprofit arm, SwitchON", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.4 describes ONergy as 'a renewable energy social enterprise' and a company 'Incorporated in 2009', and separately identifies 'SwitchON' as 'ONergy's nonprofit arm' that 'depends on grants and funds', implying ONergy itself is the commercial entity."}]}, {"name": "Sector", "header": "Sector", "value": "Clean energy (rural solar products distribution)", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.4 states ONergy is 'a renewable energy social enterprise dedicated to providing rural, un-electrified villages with clean energy solutions for lighting, electricity, and cooking'."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "ONergy's mission is to 'ONergize' 200,000 households by providing rural, un-electrified villages with clean energy solutions for lighting, electricity, and cooking, expanding from three Renewable Energy Centers (RECs) to fifty within five years.", "sources": [{"fi Societal Benefit, Environmental Quality Protection & Beautification", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.4 describes providing clean energy (lighting, electricity, cooking) to rural un-electrified villages — an energy/utilities activity whose closest (approximate) category is Public & Societal Benefit."}, {"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.5 (Social impact) states ONergy measures impact partly by 'carbon dioxide emissions avoided' and 'reduction in kerosene consumption per family', supporting the (approximate) Environmental Quality Protection & Beautification category."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Rural solar electrification and lighting; clean cooking; energy access for base-of-pyramid households; rural entrepreneur livelihoods", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "pp.4-6 describe solar lamps, home lighting and electrification systems, cookstoves, base-of-pyramid customers, and the rural entrepreneur sales network."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "early stage", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.4 states the company was 'Incorporated in 2009' (about two years before the engagement), p.3 notes it has only three RECs, and p.9 gives FY2010-11 revenues of just Rs 39 lakh (~$73,000) — evidence of an early-stage venture; p.10 also calls it 'ONergy's fledging business'."}]}, {"name": "Project City", "header": "Project City", "value": "Kolkata", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.3 calls ONergy 'a Kolkata based social enterprise' and p.8 states the team 'will present and submit its findings in January in Kolkata'."}]}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "West Bengal", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "The appendix (p.19 area) includes a 'Map of West Bengal/RECs and potential expansion areas', p.7 mentions stoves 'sold across villages in West Bengal', and p.10 describes collecting data at the Lakshmikantapur REC during a Kolkata visit."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.4 (Solar energy in rural India section) situates ONergy's work in rural India, with headquarters in Kolkata, India."}]}, {"name": "Project Description", "header": "Project Description", "value": "The Yale GSE team built a financial modeling/decision tool identifying the financial and operational drivers that make an ONergy Renewable Energy Center (REC) profitable, to support expansion from three to fifty RECs in five years. The team collected field data (including entrepreneur-level data from the Lakshmikantapur REC), benchmarked ONergy against peers such as Orb Energy, SELCO, Eversun, Wisdom Solar and TERI, and delivered a spreadsheet model, a management presentation, and a written report. Its four recommendations were to narrow the product mix, implement an inventory management system, hire a regional sales manager, and codify a consistent credit policy — together projected to cut the five-year working-capital requirement per REC from about Rs 27 lakh to about Rs 4 lakh and accelerate REC breakeven.", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.7 (Project Description/Scope) states the goal was to 'identify the fundamental financial and operational drivers that make a REC successful' via 'a financial modeling tool', and p.8 lists deliverables (decision tool spreadsheet model, PowerPoint presentation, written report, supplemental materials)."}, {"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.3 (Executive Summary) lists the four recommendations (product mix, inventory management, sales force, credit policy) and the working-capital reduction from roughly Rs 27 lakh to around Rs 4 lakh."}, {"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.10 describes the October field visit to Kolkata collecting entrepreneur-level data on the Lakshmikantapur REC, and pp.7-12 contain the peer benchmarking (Orb Energy, Eversun, Wisdom Solar, SELCO, TERI)."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue, Scaling", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.8 lists a 'Decision tool - A spreadsheet model that incorporates and illustrates the fundamental financial and operational drivers at the REC level' as the primary deliverable — Financial Modeling."}, {"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "pp.8-12 recommendations on product mix, inventory, sales force and credit policy target REC profitability and revenue — Business Strategy/Revenue."}, {"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.3 frames the work as preparing ONergy 'for future expansion' from three to fifty RECs, with the model indicating 'the magnitude of resources required to set up 50 RECs in 5 years' — Scaling."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "The report includes bios of both the ONergy executive team (Vinay Jaju, Piyush Jaju, Ekta Kothari — Ekta heads the nonprofit arm SwitchON and is noted as a fellow of Yale University's PSE Program) and the five Yale GSE students. Appendix charts (product mix, inventory, breakeven graphs, map of West Bengal RECs) are images without extractable text. No org website, email, or phone numbers appear in the document. People Served left blank: current beneficiary numbers are not stated in [India 2011/ONergyFinal Report 1-20-2012.pdf]; the report gives operational/target proxies only — ONergy operates three RECs (FY2010-11 revenues Rs 39 lakh / ~$73,000) and has a stated goal of serving 200,000 households / 1,000,000 people within five years.", "sources": [{"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "p.13 (Appendix: ONergy team bios) covers Vinay Jaju, Piyush Jaju, and Ekta Kothari, noting Ekta co-founded SwitchON and 'is a fellow of Dasra-Social Impact and Yale University's PSE Program'."}, {"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "pp.14-19 appendix sections consist of chart headings with image content that yields no extractable data text."}, {"file": "India 2011/ONergyFinal Report 1-20-2012.pdf", "reason": "REC counts and the five-year 200,000-household / 1,000,000-people target — proxy/target text moved here from People Served in the 2026-08-02 QA revision."}], "rev": {"status": "revised", "note": "Appended in v2: People Served proxy/target text moved here from the People Served field."}}]}, {"pid": "Global Social Entrepreneurship India - 7/1/11 - 6/30/12 - Self-Employed Women's Association (SEWA)", "org": "Self-Employed Women's Association (SEWA)", "folder": "India 2011", "sheet_row": 24, "parent": "Global Social Entrepreneurship India - 7/1/11 - 6/30/12", "filled": 25, "fields": [{"name": "Project ID", "header": "Project ID*", "value": "Global Social Entrepreneurship India - 7/1/11 - 6/30/12 - Self-Employed Women's Association (SEWA)", "sources": [{"file": null, "reason": "Constructed following the '6) Engagement Projects' convention (Project ID = Parent Program + ' - ' + Organization; Parent Program = program name + fiscal-year 7/1-6/30 date range, program year determined from docum ts Trading Network for Women (GTNfW) which is a non-profit Section 25 company'."}]}, {"name": "Sector", "header": "Sector", "value": "Women's informal-sector livelihoods and member services; clean energy products (cookstoves and solar lanterns) via the Hariyali project", "sources": [{"file": "India 2011/GSE SEWA Micro Final Report.pdf", "reason": "p.4 says SEWA 'works with its members to provide a wide variety of educational, financial, health and social services' to help members achieve better livelihoods."}, {"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "p.3 describes Haryali ('Haryalo Rozgar' - Green Energy and Green Livelihood) distributing 200,000 improved cookstoves and solar lights to SEWA members."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "SEWA's mission is to organize self-employed women for full employment and self-reliance, working with members to provide educational, financial, health and social services so they achieve better livelihoods.", "sources": [{"file": "India 2011/GSE SEWA Micro Final Report.pdf", "reason": "p.4 states 'SEWA's mission is to organize self-employed women for full employment and self-reliance'."}, {"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "p.1 states 'The twin objectives of SEWA are Self Reliance and Employment'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "SEWA organizes poor self-employed women workers and provides them technical training, micro-credit, market linkages, natural resource management, insurance, healthcare, childcare and other services. Its Hariyali project, launched September 2011, sells fuel-efficient cookstove and solar lantern bundles on financed terms to SEWA members through the non-profit SPV GTNfW, backed by an Indian Overseas Bank loan, an IFC first-loss guarantee, and Shell Foundation carbon funding.", "sources": [{"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "pp.1-3 describe SEWA's integrated approach (organizing, capacity building, capital formation, social security) and the Haryali program mechanics via GTNfW with bank loans and IFC guarantee."}, {"file": "India 2011/SEWA Macro Team_Final Report_v17.pdf", "reason": "p.5 details the Hariyali financing: a US$5.1 million IOB loan at 11.25%, an expected 50% first-loss guarantee from IFC (with FMO and Sida), and US$3 million of Shell Foundation support repaid via carbon credits."}, {"file": "India 2011/GSE SEWA Micro Final Report.pdf", "reason": "p.4 states the Hariyali Project was 'Officially launched in September 2011' with a goal of selling two hundred thousand cookstove and lantern bundles over three years."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": "Over 1.3 million members (the Micro report says across seven states; the Haryali introduction says across 9 states, almost half from rural Gujarat); the Hariyali project targets 200,000 cookstove/lantern bundles over three years.", "sources": [{"file": "India 2011/GSE SEWA Micro Final Report.pdf", "reason": "p.4 states 'SEWA now has over 1.3 million members across seven states in India'."}, {"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "p.1 states 'It has a membership of 1.3 million women across 9 states, almost half of which is from rural Gujarat'."}, {"file": "India 2011/SEWA Macro Team_Final Report_v17.pdf", "reason": "p.3 states Hariyali 'aims to supply 200,000 clean energy cookstoves and 200,000 solar lanterns... over a three-year time horizon to members of SEWA'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Anurag Bhatnagar", "sources": [{"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "p.4 is signed 'Anurag Bhatnagar, CEO - GTNfW (also called Haryali)'."}, {"file": "India 2011/GSE SEWA Micro Final Report.pdf", "reason": "p.1 (cover) lists 'SEWA Hariyali Project Team: Anurag Bhatnagar, Chhaya Bhavsar'."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": "CEO, GTNfW ('Haryali') - the SEWA-promoted green livelihood and green energy company", "sources": [{"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "p.4 signature block reads 'CEO - GTNfW (also called Haryali) / A Green Livelihood & Green Energy company promoted by SEWA'."}, {"file": "India 2011/GSE SEWA Macro Team Presentation_Final.pptx", "reason": "Slide 9 speaker notes refer to giving 'the Hariyali leader, Anurag, the ability to make decisions', confirming his lead role."}]}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": "anuragbhat@yahoo.com", "sources": [{"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "p.4 signature block lists 'E: anuragbhat@yahoo.com'."}]}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": "+91", "sources": [{"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "p.4 signature block lists 'M: +91-7600109257'."}]}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": "7600109257", "sources": [{"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "p.4 signature block lists 'M: +91-7600109257' (mobile)."}]}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Chhaya Bhavsar", "sources": [{"file": "India 2011/GSE SEWA Micro Final Report.pdf", "reason": "p.1 (cover) lists the 'SEWA Hariyali Project Team' as 'Anurag Bhatnagar, Chhaya Bhavsar'."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": "SEWA Hariyali Project Team member", "sources": [{"file": "India 2011/GSE SEWA Micro Final Report.pdf", "reason": "p.1 (cover) identifies Chhaya Bhavsar only as part of the 'SEWA Hariyali Project Team'; no formal title is given in any document."}]}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Employment, Mutual & Membership Benefit, Environmental Quality Protection & Beautification", "sources": [{"file": "India 2011/GSE SEWA Micro Final Report.pdf", "reason": "p.4 states SEWA's mission is to organize self-employed women 'for full employment and self-reliance' — Employment."}, {"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "p.1 characterizes SEWA as 'a member-based organization' organized for collective strength and member services — Mutual & Membership Benefit (approximate match for a trade-union structure)."}, {"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "p.3 lists ENVIRONMENT among Haryali's expected benefits ('lesser consumption of wood -> lesser deforestation -> hence lesser CO2') — Environmental Quality Protection & Beautification is an approximate match for the clean-energy project focus."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Women's informal-sector employment and self-reliance; household clean energy (improved cookstoves, solar lanterns); indoor air pollution and health; microfinance/consumer financing; carbon credit revenue for the poor", "sources": [{"file": "India 2011/SEWA An introduction to Haryali.pdf", "reason": "pp.1-3 discuss women's livelihoods, indoor air pollution health harms, the cookstove/lantern solution, deferred-credit financing, and carbon credit revenue channeling."}, {"file": "India 2011/SEWA Macro Team_Final Report_v17.pdf", "reason": "pp.5-7 detail the loan, guarantee and carbon-fund financing structure serving SEWA aved hours into income, and running pricing-strategy pilot tests. The Macro team built an Excel financial model of the overall financing structure (IOB lender, IFC guarantor, Shell Foundation carbon fund, members, and SEWA as administrator) and recommended negotiating a cap on the default buffer (starting at 29% of outstanding debt), extending loan tenure to improve affordability, and locking in long-term carbon contracts at US$7.30/credit or more.", "sources": [{"file": "India 2011/GSE SEWA Micro Final Report.pdf", "reason": "p.3 states 'the micro team assessed the household-level economic benefits of these products for SEWA members, while the macro team evaluated the financing structure', gives the Rs 650 vs Rs 310 base case, and lists the three Micro recommendations (bundling, training leverage, pricing pilots)."}, {"file": "India 2011/SEWA Macro Team_Final Report_v17.pdf", "reason": "pp.3-4 summarize the Macro model of the five stakeholders and the recommendations to cap the buffer at 29% of outstanding debt, balance affordability via loan-term extension, and lock in carbon contracts at US$7.30/credit or more."}, {"file": "India 2011/GSE SEWA Macro Team Presentation_Final.pptx", "reason": "Slides 7 and 9 describe the Macro engagement task ('Model Hariyali's financial dynamics') and the model levers (loan tenure, mark-up pricing, interest spread) delivered to the Hariyali leadership."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Financial Modeling, Business Strategy/Revenue, Impact Assessment", "sources": [{"file": "India 2011/SEWA Macro Team_Final Report_v17.pdf", "reason": "p.7 lists as deliverable 'A flexible Excel financial model' with sensitivity and scenario analyses, and the Micro team's point-of-sale equation (GSE SEWA Micro Final Report p.10) is likewise a quantitative ", "header": "Org Type", "value": "Nonprofit program (internal program of its parent nonprofit, the Center for Rural Development)", "sources": [{"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.8 notes that Rickshaw Bank's financial reporting 'has been part of Center for Rural Development, its parent nonprofit', and p.4 identifies it as an internal program of CRD."}]}, {"name": "Sector", "header": "Sector", "value": "Transport livelihoods / rickshaw micro-leasing and manufacturing", "sources": [{"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.5 describes 'a unique rickshaw micro-leasing program' whose business model 'consists of two components - manufacturing and leasing' (p.6)."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "Rickshaw Bank's mission is to empower and improve the lives of rickshaw pullers in India by providing them access to asset ownership through the issuance of micro leases on rickshaws and other pedal carts.", "sources": [{"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.5 (Rickshaw Bank Overview - Mission) states this mission verbatim."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "Rickshaw Bank manufactures its own uniquely designed rickshaws (design by IIT Guwahati, modified by MIT students) and leases them to rickshaw pullers on a lease-to-own basis (Rs 40 daily payments over 350 days for a Rs 14,000 package), also providing insurance, registration, an identity card, uniform and sandals, and training; daily payments are collected by field collectors from puller groups.", "sources": [{"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.5 describes the micro-leasing program and holistic services (insurance, registration, ID card, uniform, sandals, training)."}, {"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.6 details the manufacturing facility, the IIT Guwahati design modified by MIT students, and the leasing terms (Rs 14,000 package, Rs 40 daily payments over 350 days as of August 2011)."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": "18 full-time manufacturing workers (facility staff only; total organization staff not stated)", "sources": [{"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.6 states 'Rickshaw Bank has an internal manufacturing facility that is currently staffed by eighteen full-time workers'; collectors and office staff are mentioned (pp.6, 23) but not counted."}], "rev": {"status": "kept_ok", "note": "No change needed: the explicit scope qualifier the reviewer asked to retain is already in the cell."}}, {"name": "People Served", "header": "How many people do you serve?", "value": "Approximately 4,000 rickshaw pullers and their families in Assam since inception (nearly 4,000 rickshaws manufactured and distributed).", "sources": [{"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.5 states 'Since inception, the organization has manufactured and distributed nearly 4,000 of its uniquely designed rickshaws' and 'So far, Rickshaw Bank has impacted the lives of approximately 4,000 rickshaw pullers and their families in Assam'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Dr. Pradip Sarmah", "sources": [{"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "The cover page (p.1) lists 'Rickshaw Bank / Pradip Sarmah' as the client counterpart, and p.23 refers to 'board members and founder, Dr. Pradip Sarmah'."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": "Founder", "sources": [{"file": "India 2011/Rickshaw Bank Final Report v8.pdf", "reason": "p.23 (Exhibit 2) explicitly calls him 'founder, Dr. Pradip Sarmah', and p.25 refers to 'Dr. Sarmah's goal of bringing more rapid social and economic change to the bicycle rickshaw puller population of Eastern India'."}]}, {"name"
