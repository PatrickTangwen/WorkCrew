er": "Organization Website", "value": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "For-profit social enterprise (private limited company; an associate of the nonprofit Swayam Shikshan Prayog / SSP)", "sources": [{"file": "India 2014/LOA_SURE_signed_Dec3.pdf", "reason": "The OCR'd letterhead (p.1) shows the corporate form 'Private Limited'."}, {"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The background (p.4) states 'SURE is an associate of Swayam Shikshan Pryog (SSP), a nonprofit organization', and the report throughout treats SURE as a social enterprise seeking financial sustainability."}]}, {"name": "Sector", "header": "Sector", "value": "Clean/green energy product distribution through rural women entrepreneurs", "sources": [{"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The background (p.4) describes SURE recruiting, training and supporting 'local female entrepreneurs to sell green technology products' such as clean cook stoves and solar home lighting."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "To empower rural women as grassroots entrepreneurs to facilitate clean and green energy access at the bottom of the pyramid (BoP); its vision is a rural distribution network of 1,000 economically empowered female entrepreneurs.", "sources": [{"file": "India 2014/GSE_Presentation_SURE_Bangalore_Final.pdf", "reason": "The Mission & Vision slide (p.4) quotes the mission and the 1,000-entrepreneur vision verbatim."}, {"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The background (p.4) states 'Established in 2009, SURE's mission is to empower rural women to relieve poverty and promote the adaptation of green technology at the base of the pyramid (BoP)'."}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "SURE recruits, trains (via its School of Entrepreneurship) and supports rural women entrepreneurs called Sakhis who sell clean-technology products - clean cook stoves, solar home-lighting products, water heaters, water purifiers, and readymade cement toilets - in their home villages; each Sakhi covers three villages and product profits are split 60/40 between Sakhis and SURE, with microfinance-based credit access.", "sources": [{"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The background and 'How SURE Works' sections (p.4-5) describe the Sakhi model, product portfolio, three-village footprint, 60/40 profit split, and microfinance-based credit."}, {"file": "India 2014/SURE_Presentation.pdf", "reason": "Slides on SURE's structure list 'Sakhis: rural female entrepreneurs', 'Footprint: Three villages per Sakhi', and the '40% SURE / 60% Sakhis' revenue structure."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": 15, "sources": [{"file": "India 2014/SURE_Presentation.pdf", "reason": "The 'SURE Institution and Context' slide (p.6) lists '15 Staff Members'."}, {"file": "India 2014/GSE_Presentation_SURE_Bangalore_Final.pdf", "reason": "The same institution slide (p.5) lists '15 Staff Members'."}]}, {"name": "People Served", "header": "How many people do you serve?", "value": "A network of 850-1,000 Sakhis (women entrepreneurs) across Maharashtra and Bihar, with a stated goal of 2,000 Sakhis and 1,000,000 households by 2015; a $1M USAID wPower grant funded empowering 1,000 rural women in clean energy businesses.", "sources": [{"file": "India 2014/LOA_SURE_signed_Dec3.pdf", "reason": "The OCR'd background (p.1) states SURE works in 'over six districts in Maharashtra and two districts in Bihar and a network of 850 Sakhis. Ultimately, SURE's goal is to reach 2000 Sakhis and 1,000,000 households by 2015.'"}, {"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The background (p.4) states 'SURE is working in Maharashtra and Bihar and has a network of 1,000 Sakhi's'."}, {"file": "India 2014/GSE_Presentation_SURE_Bangalore_Final.pdf", "reason": "The USAID slide (p.6-7) describes the '$1,000,000 grant received by USAID | India' to 'Empower 1,000 rural women to launch clean energy businesses... by 2015'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Prema Gopalan", "sources": [{"file": "India 2014/LOA_SURE_signed_Dec3.pdf", "reason": "The OCR'd communications section (p.5) states 'Key contacts at SURE include Prema Gopalan, Upmanyu Patil, and Rajashri Sai', and Prema Gopalan is the first org-side signatory ('Prema Gopalan, Sakhi Unique Rural Enterprise Private Limited', p.5-6)."}, {"file": "India 2014/GSE_Presentation_SURE_Bangalore_Final.pdf", "reason": "The title page (p.1) lists 'SURE: Prema Gopalan - Upmanyu Patil' as the client-side partners."}]}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": null, "sources": []}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Number (Contact 1)", "value": null, "sources": []}, {"name": "Name of Contact 2", "header": "Name of Contact 2", "value": "Upmanyu Patil", "sources": [{"file": "India 2014/LOA_SURE_signed_Dec3.pdf", "reason": "The OCR'd signature block (p.5-6) includes 'Upmanyu Patil, Sakhi Unique Rural Enterprise Private Limited' as the second org-side signatory."}]}, {"name": "Title of Contact 2", "header": "Title of Contact 2", "value": null, "sources": []}, {"name": "Email of Contact 2", "header": "Email of Contact 2", "value": null, "sources": []}, {"name": "Country Code 2", "header": "Country Code (Contact 2)", "value": null, "sources": []}, {"name": "Phone Number 2", "header": "Phone Number (Contact 2)", "value": null, "sources": []}, {"name": "Main Issue Area(s)", "header": "Main Issue Area(s) (e.g. Sector - Education, Healthcare, EconDev, Agriculture, Impact Investing, Gender & Social Equity, Sustainability)", "value": "Community Improvement & Capacity Building, Environmental Quality Protection & Beautification", "sources": [{"file": "India 2014/GSE SURE Report Final.pdf", "reason": "SURE's core activity is 'building the capacity and skill sets of women to improve community development' through micro-entrepreneurship (p.4), an approximate match to 'Community Improvement & Capacity Building' since the list has no dedicated women's-empowerment or energy category."}, {"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The mission promotes 'clean and green energy access' and clean water/sanitation products (p.2-4), an approximate match to 'Environmental Quality Protection & Beautification'."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Rural women's economic empowerment and micro-entrepreneurship; last-mile distribution of clean energy products (cook stoves, solar lighting); clean water and sanitation products; bottom-of-pyramid markets", "sources": [{"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The background (p.4) covers the Sakhi micro-enterprise network, clean cook stoves, solar lighting, water purifiers and cement toilets, and SSP's history addressing indoor air pollution and clean water/sanitation."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "middle stage", "sources": [{"file": "India 2014/SURE_Presentation.pdf", "reason": "The institution slide (p.6) shows founding in 2009 (about five years before the engagement) with a network of 1,000 Sakhis in 2 states but only 15 staff."}, {"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The executive summary (p.2-3) states 'SURE's business model is currently financially unsustainable' and dependent on a USAID grant ending October 2015, indicating it is past startup scale but not yet an established, self-sustaining organization."}]}, {"name": "Project City", "header": "Project City", "value": "Latur", e appendix (p.14-18) covers Living Goods, VisionSpring, Project Shakti and the Product Scorecard."}, {"file": "India 2014/SURE_ProductScorecard.xlsx", "reason": "The 'Scorecard' sheet operationalizes the recommended product-selection tool across market analysis, revenue drivers and expenditure dimensions."}, {"file": "India 2014/SURE Itinerary Jan 2015 DRAFT v2.xlsx", "reason": "The agenda shows the January 2-8, 2015 field visit with Sakhi shadowing, customer home visits, and financial reviews at the SURE office near Latur."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Business Strategy/Revenue, Organizational Systems and Behavior", "sources": [{"file": "India 2014/GSE SURE Report Final.pdf", "reason": "The engagement 'to analyze their business model and product mix in order to improve efficiency and increase product sales' (p.2), including the revenue-per-Sakhi recommendation and product scorecard, evidences 'Business Strategy/Revenue'."}, {"file": "India 2014/GSE SURE Report Final.pdf", "reason": "Recommendation I 'Streamline Operational Priorities' (p.9), addressing competing mission priorities and internal operations, is an approximate match to 'Organizational Systems and Behavior'."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "'LOA_SURE_signed_Dec3.pdf' is a scanned PDF with no text layer; its contents (including the signature block) were recovered via OCR. The LOA names a third key contact, Rajashri Sai. The LOA also references an earlier 'MIT Sloane's SURE project conclusions and presentation' as an input, indicating SURE had previously worked with another university t ": null, "sources": []}, {"name": "Org Type", "header": "Org Type", "value": "Microfinance and livelihood promotion institution (provides financial inclusion services, institutional development, and agriculture/livestock services for the rural poor)", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 3 speaker notes state BASIX 'was established in 1996, and immediately began providing microfinance solutions for India's poor, and also provided consulting services for \"livelihood promotion\"', expanding into a 'Triad Strategy' of financial inclusion, institutional development, and ag/livestock services."}]}, {"name": "Sector", "header": "Sector", "value": "Microfinance / rural agricultural livelihoods (Farmer Producer Organizations)", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 3 notes describe microfinance and livelihood promotion, and slides 4-5 show BASIX's work promoting Farmer Producer Organizations ('214 registered FPO's supporting 250,000 farmers')."}]}, {"name": "Org Mission", "header": "Org Mission", "value": "To promote the livelihoods of India's rural poor through a 'Triad Strategy': (1) financial inclusion services, (2) institutional development such as the creation of cooperatives, and (3) agriculture/livestock and other services.", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 3 ('BASIX Mission') speaker notes state: 'They have expanded into a \"Triad Strategy\" that includes (1) financial inclusion services (2) Institutional development - such as the creation of cooperatives, and (3) Ag/Livestock and other services for the rural poor.'"}]}, {"name": "Org Main Activities and Services", "header": "Org Main Activities and Services", "value": "BASIX provides microfinance for India's poor and consulting services for livelihood promotion. A core activity is promoting Farmer Producer Organizations (FPOs) - farmer-owned collectives built from Farmer Interest Groups of ~15-20 farmers - with 214 registered FPOs supporting 250,000 farmers across 21 states, including 2 FPOs in Manipur.", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 3 notes describe the microfinance and livelihood-promotion consulting activities since 1996."}, {"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 4 explains the FPO structure ('~15-20 Farmers = Farmers Interest Group (FIG)', '~50 FIGs = 1 FPO') and slide 5 states '214 registered FPO's supporting 250,000 farmers', with a map legend of 21 states with BASIX FPOs and 'Manipur - 2 FPOs'."}]}, {"name": "Staff Count", "header": "How many staff members does the org have?", "value": null, "sources": []}, {"name": "People Served", "header": "How many people do you serve?", "value": "250,000 farmers (supported through 214 registered FPOs)", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 5 ('BASIX FPOs') states '214 registered FPO's supporting 250,000 farmers'."}]}, {"name": "Name of Contact 1", "header": "Name of Contact 1", "value": "Farah", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 1 lists 'CLIENT: FARAH, NEKIB, BIROJ (BASIX STAFF)'; only first names are given."}], "rev": {"status": "kept_ok", "note": "No change needed: first-name-only caveat already recorded in Notes; no authoritative roster exists in the folder."}}, {"name": "Title of Contact 1", "header": "Title of Contact 1", "value": "BASIX staff (no formal title given)", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 1 characterizes Farah only as one of the '(BASIX STAFF)' client contacts."}]}, {"name": "Email of Contact 1", "header": "Email of Contact 1", "value": null, "sources": []}, {"name": "Country Code 1", "header": "Country Code (Contact 1)", "value": null, "sources": []}, {"name": "Phone Number 1", "header": "Phone Num as creating cooperatives), since the allowed list has no direct microfinance/economic-development category."}]}, {"name": "Sub Area Issues", "header": "Sub Area Issues", "value": "Smallholder farmer collectivization (FIGs/FPOs); agricultural market access and value chains; post-harvest value-add processing; rural microfinance and financial inclusion; rural livelihoods in Northeast India (Manipur)", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slides 4-7 cover FPO collectivization and the agri-value chain, slide 6 covers 'Challenges Unique to Manipur', slide 7 poses the market-access and value-add processing problem statements, and slide 3 notes cover microfinance/financial inclusion."}]}, {"name": "Maturity of Organization", "header": "Maturity of Organization (early stage, middle stage, established)", "value": "established", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 3 speaker notes state BASIX 'was established in 1996' - roughly 20 years of operation at the time of the presentation."}, {"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 5 shows national scale: '214 registered FPO's supporting 250,000 farmers' across 21 states, and slide 11 quotes its CEO Vijay Mahajan - evidence of a large, mature organization."}]}, {"name": "Project City", "header": "Project City", "value": null, "sources": []}, {"name": "Project State/Province/District", "header": "Project State/Province/District", "value": "Manipur", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 5 highlights 'Manipur - 2 FPOs', slide 6 is titled 'Challenges Unique to Manipur', and slide 8 notes name the FPO site visits 'FPOs: Kangleipak & Kakching' (in Manipur)."}]}, {"name": "Project Country", "header": "Project Country", "value": "India", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 4 discusses 'The average farmer in India has ~1 hectare of land' and the deck concerns BASIX's FPOs across Indian states, focused on Manipur (slides 4-6)."}]}, {"name": "Project Description", "header": "Project Description", "value": "A five-member Yale GSE student team (Abdul, Allison, Marguerite, Molly, Pamela), working with three BASIX staff clients and an IIMB partner, examined how BASIX-promoted Farmer Producer Organizations in Manipur can improve farmers' livelihoods. The problem statements were how small farmers can improve market access and use value-add processing to increase income. Methods included site visits and interviews (including the Kangleipak and Kakching FPOs) plus a global literature review of best practices. The team delivered findings and recommendations on motivating collectivization, a set of decision-making tools for selecting value-add products (worksheet, data-collection spreadsheet, decision matrix), ownership-model options drawn from global comparators, and benchmarks of success such as increased farmer income and decreased spoilage.", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 1 gives the title 'IMPROVING FARMERS' LIVELIHOODS THROUGH PROMOTING FARMER PRODUCER ORGANIZATIONS (FPO'S)' and lists 'MEMBERS: ABDUL, ALLISON, MARGUERITE, MOLLY, PAMELA', 'CLIENT: FARAH, NEKIB, BIROJ (BASIX STAFF)', 'IIMB PARTNER: RAM'."}, {"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slide 7 states the problem statements ('How can small farmers improve their access to markets? How can small farmers utilize value-add processing to increase income?') and slide 8 lists methodologies ('Site Visits and Interviews', 'Global Research/Lit Review'), with notes naming 'FPOs: Kangleipak & Kakching'."}, {"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "Slides 9-16 present findings and recommendations, slide 13 notes state 'The GSE Team determined that a set of decision-making tools for selecting value-add products would be the most useful deliverable' (Value-add Processing Worksheet, Data Collection Spreadsheet, Decision-making Matrix), and slide 16 gives benchmarks of success ('Increase in farmer income / Decrease in % of product spoilage')."}]}, {"name": "Project Tags", "header": "Project Tags (Financial Modeling, Impact Assessment, Marketing, Business Strategy/Revenue, Organizational Systems and Behavior, Investing/Endowment, Scaling, Technology Innovation)", "value": "Business Strategy/Revenue, Scaling, Marketing", "sources": [{"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "'Business Strategy/Revenue' fits the core work on market access, value-add processing to increase farmer income, and ownership/business-model recommendations (slides 7, 9-11, 14-15)."}, {"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "'Scaling' fits the recommendation on slide 10 to 'Focus on scaling, allow transport to follow' and the collectivization/expansion recommendations on slide 12."}, {"file": "India 2016/BASIX SI Lab Presentation_FINAL.pptx", "reason": "'Marketing' is an approximate match for the slide 10 recommendation to 'Create quality standards and branding for higher profit margins' and the market-linkage recommendations."}]}, {"name": "Project Folder Link", "header": "Project Folder Link", "value": null, "sources": []}, {"name": "Project Success", "header": "Project Success (High, Medium, Low)", "value": null, "sources": []}, {"name": "Notes", "header": "Notes", "value": "Only the SI Lab final presentation is available for this organization/year - no final report, scope of work, or contact sheet - so most administrative fields (website, staff count, full contact details) cannot be filled. Client contacts are given by first name only: Farah, Nekib, and a third staff member Biroj (slide 1); an 'IIMB PARTNER: RAM' is also listed. The deck names the client only as 'BASIX' and does not identify a specific BASIX legal entity; content (est. 1996, micr
