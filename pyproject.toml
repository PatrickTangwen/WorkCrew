[project]
name = "workflow-app"
version = "0.1.0"
description = "Local-first document-to-workbook workflow engine (Claude Code Filler + Codex Reviewer)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "langgraph>=1.0",
    "pypdf>=6.15.0",
    "openpyxl>=3.1.5",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pyyaml>=6.0.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.1",
]

[project.scripts]
workflow = "workflow_app.cli:main"

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=8",
    "ruff>=0.12",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live agent-runtime smoke tests spend subscription quota; excluded from
# the default run (plan section 41). Run them with: pytest -m smoke
addopts = "-m 'not smoke'"
markers = [
    "smoke: live agent-runtime smoke tests, excluded from the default run",
]

[tool.ruff]
line-length = 88
# Never reformat prose documents (ruff formats fenced code blocks in
# markdown; project_plan_v3.md is an authoritative reference).
extend-exclude = ["*.md"]
